  const L=[r.ds];
  L.push('เที่ยวงาน '+r.trips+' · ปิดงาน '+r.closed+(r.plan?(' · แผน '+r.plan):''));
  L.push('พจส. ต้องมา '+r.sched+' · มา '+r.present+' · สาย '+r.late+' · ขาด '+r.absent+' · ลา '+r.leave
    +(r.unchecked?(' · ยังไม่เช็ก '+r.unchecked):'')+(r.ot?(' · OT '+r.ot):''));
  const ty=JOBTYPES.filter(t=>r.types[t.k]).map(t=>t.s+' '+r.types[t.k]);
  if(ty.length)L.push('ประเภทงาน: '+ty.join(' · '));
  const wt=WT_GROUPS.filter(x=>r.wt[x.k]&&(r.wt[x.k].ok||r.wt[x.k].over))
    .map(x=>x.name+' ไม่เกิน '+r.wt[x.k].ok+'/เกิน '+r.wt[x.k].over);
  if(wt.length)L.push('เวลา: '+wt.join(' · '));
  if(r.hoursN)L.push('เวลาทำงานเฉลี่ย '+(Math.round(r.hours/r.hoursN*10)/10)+' ชม./เที่ยว');
  return L.join('\n');
}
function dTrend(daily,pick,lab,color){
  const vals=daily.map(pick), N=vals.length;
  if(!N)return '';
  const max=Math.max(1,...vals), W=Math.max(320,N*46), H=118, pad=16;
  const x=i=>pad+(N===1?(W-pad*2)/2:i*(W-pad*2)/(N-1)), y=v=>H-pad-10-(v/max)*(H-pad*2-10);
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
  const area='M'+x(0)+','+(H-pad-10)+' L'+vals.map((v,i)=>x(i)+','+y(v)).join(' L')+' L'+x(N-1)+','+(H-pad-10)+' Z';
  const hit=(W-pad*2)/Math.max(1,N)/2+6;
  return `<svg class="dsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lab)}">
    <path d="${area}" fill="${color}" opacity=".13"></path>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"></polyline>
    ${vals.map((v,i)=>`<g class="dpt${dashPickDay===daily[i].ds?' on':''}" data-dd="${esc(daily[i].ds)}">
      <title>${esc(dayDetailText(daily[i]))}</title>
      <rect x="${x(i)-hit}" y="0" width="${hit*2}" height="${H}" fill="transparent"></rect>
      <circle cx="${x(i)}" cy="${y(v)}" r="${dashPickDay===daily[i].ds?5.5:3.5}" fill="${dashPickDay===daily[i].ds?color:'#fff'}" stroke="${color}" stroke-width="2"></circle>
      <text x="${x(i)}" y="${y(v)-8}" font-size="8.5" text-anchor="middle" fill="#5a6b82">${v}</text>
      <text x="${x(i)}" y="${H-3}" font-size="8" text-anchor="middle" fill="#8a97a8">${daily[i].ds.slice(5)}</text></g>`).join('')}
  </svg>`;
}
/* ---------- ข้อความสรุปสำหรับคัดลอก ---------- */
function dashText(A){
  const L=[];
  L.push('สรุปงานขนส่ง EV — BU4');
  L.push('ช่วง '+A.dates[0]+' ถึง '+A.dates[A.dates.length-1]+' ('+A.haveDays+'/'+A.dates.length+' วันที่มีข้อมูล)');
  L.push('');
  L.push('เที่ยวงานรวม '+A.trips+' เที่ยว · เฉลี่ย '+A.tripsPerDay.toFixed(1)+' เที่ยว/วัน');
  L.push('ปิดงานแล้ว '+A.closed+' เที่ยว · แผนที่ตั้งไว้ '+A.plan+' เที่ยว'+(A.plan?(' ('+Math.round(A.trips/A.plan*100)+'% ของแผน)'):''));
  L.push('พจส. มาทำงาน '+A.att.present+'/'+A.att.sched+' ('+A.attRate.toFixed(1)+'%) · สาย '+A.att.late+' · ขาด '+A.att.absent+' · ลา '+A.att.leave+' · OT '+A.att.ot);
  L.push('เวลาทำงานเฉลี่ย '+A.hoursAvg.toFixed(1)+' ชม./เที่ยว · เกินเกณฑ์ '+A.over8+' เที่ยว');
  WT_GROUPS.forEach(x=>{const q=A.wt[x.k];if(q&&q.n)L.push('  · '+x.name+' ไม่เกิน '+q.ok+' · เกิน '+q.over+' (จาก '+q.n+' เที่ยว)');});
  L.push('');
  L.push('แยกตามประเภทงาน');
  JOBTYPES.forEach(t=>L.push('  · '+t.f+' '+(A.byType[t.k]||0)+' เที่ยว'));
  const top=k=>Object.keys(k).map(x=>[x,k[x]]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  L.push('');
  L.push('สินค้า/เส้นทางที่วิ่งมากสุด');
  top(A.prod).forEach(([k,v])=>L.push('  · '+k+' '+v+' เที่ยว'));
  return L.join('\n');
}
/* ---------- วาดหน้า ---------- */

      ${card('ลา',A.att.leave,'')}
      ${card('มา OT วันหยุด',A.att.ot,'จากวันหยุด '+A.att.off+' คน-วัน')}
      ${card('ยังไม่เช็ก',A.att.unchecked,'ควรเป็น 0 เมื่อจบวัน')}

    <div class="dtwo">
      <div class="dpanel"><h3>พจส. ที่มาสายบ่อยสุด <span class="cno">(ครั้ง)</span></h3>
        ${late.length?dBars((function(){const o={};late.forEach(x=>o[x.name+(x.code?(' · '+x.code):'')]=x.late);return o;})(),8,'#b8860b'):'<div class="cno">ไม่มีคนมาสายในช่วงนี้</div>'}</div>
      <div class="dpanel"><h3>พจส. ที่ขาดงานบ่อยสุด <span class="cno">(ครั้ง)</span></h3>
        ${abs.length?dBars((function(){const o={};abs.forEach(x=>o[x.name+(x.code?(' · '+x.code):'')]=x.absent);return o;})(),8,'#c0392b'):'<div class="cno">ไม่มีคนขาดงานในช่วงนี้</div>'}</div>

  /* --- เส้นทาง --- */
  else if(dashTab==='route'){
    body=`<div class="dgrid4">

      ${card('เที่ยวรวม',A.trips,'ในช่วงที่เลือก')}
      ${card('เฉลี่ยต่อเส้นทาง',(Object.keys(A.prod).length?(A.trips/Object.keys(A.prod).length).toFixed(1):'0'),'เที่ยว/เส้นทาง')}
    </div>
    <div class="dtwo">
      <div class="dpanel"><h3>สินค้า / เส้นทาง <span class="cno">(เที่ยว)</span></h3>${dBars(A.prod,10)}</div>
      <div class="dpanel"><h3>ต้นทาง <span class="cno">(เที่ยว)</span></h3>${dBars(A.origin,10,'#7b5599')}</div>
    </div>`;

  else if(dashTab==='truck'){

    const low=tk.slice().reverse().slice(0,8);
    body=`<div class="dgrid4">
      ${card('รถที่ออกงาน',Object.keys(A.trucksSeen).length,'จาก '+config.length+' คันในกองรถ','hero')}
      ${card('เที่ยวรวม',A.trips,'เฉลี่ย '+A.tripsPerDay.toFixed(1)+' เที่ยว/วัน')}
      ${card('เฉลี่ยต่อคัน',(Object.keys(A.trucksSeen).length?(A.trips/Object.keys(A.trucksSeen).length).toFixed(1):'0'),'เที่ยว/คัน ในช่วงนี้')}

    <div class="dtwo">
      <div class="dpanel"><h3>รถที่วิ่งมากสุด <span class="cno">(เที่ยว)</span></h3>${dBars(A.truck,10,'#2b6cb0')}</div>
      <div class="dpanel"><h3>รถที่วิ่งน้อยสุด <span class="cno">(เที่ยว)</span></h3>
        ${low.length?dBars((function(){const o={};low.forEach(([k,v])=>o[k]=v);return o;})(),10,'#b8860b'):'<div class="cno">ไม่มีข้อมูล</div>'}</div>

  else {

    const rows=WT_GROUPS.map(x=>{const q=g(x.k);
      return `<div class="drow" style="grid-template-columns:1fr 150px 62px">
        <div><div style="margin-bottom:3px">${esc(x.name)} <span class="cno">${esc(x.who)}</span></div>
          <div style="display:flex;height:9px;border-radius:20px;overflow:hidden;background:#eef1f6">
            <div style="width:${q.n?Math.round(q.ok/q.n*100):0}%;background:#2f8f6b"></div>
            <div style="width:${q.n?Math.round(q.over/q.n*100):0}%;background:#c0392b"></div></div></div>
        <div class="cno" style="text-align:right">ไม่เกิน ${q.ok} · เกิน ${q.over}</div>
        <div class="dnum">${q.n}</div></div>`;}).join('');
    body=`<div class="dgrid4">
      ${card('เวลาทำงานเฉลี่ย',A.hoursAvg.toFixed(1),'ชม./เที่ยว (จาก '+A.hours.length+' เที่ยวที่ปิดงาน)','hero')}
      ${WT_GROUPS.map(x=>card(x.name+' ผ่านเกณฑ์',okpc(x.k),'ไม่เกิน '+g(x.k).ok+' · เกิน '+g(x.k).over+' · เฉลี่ย '+(g(x.k).n?(g(x.k).sum/g(x.k).n).toFixed(1):'-')+' ชม.')).join('')}
      ${card('เกินเกณฑ์รวม',A.over8,pct(A.over8,A.hours.length)+'% ของเที่ยวที่ปิดงาน')}
    </div>
    <div class="dtwo">
      <div class="dpanel"><h3>ไม่เกิน / เกิน แยกตามเกณฑ์ <span class="cno">(เที่ยว)</span></h3>${rows}</div>
      <div class="dpanel"><h3>เวลาทำงานเฉลี่ยรายวัน <span class="cno">(ชม.)</span></h3>
        ${dTrend(A.daily,r=>r.hoursN?Math.round(r.hours/r.hoursN*10)/10:0,'เวลาเฉลี่ยรายวัน','#2f8f6b')}</div>
    </div>`;
  }

  const prog=dashBusy?`<div class="dload" style="margin-top:8px"><i style="width:${dashNeed?Math.round(dashDone/dashNeed*100):100}%"></i></div>
     <div class="cno" style="margin-top:4px">กำลังดึงข้อมูล ${dashDone}/${dashNeed} วัน…</div>`:'';

  document.getElementById('view').innerHTML=`<div class="dwrap">
    <div class="dbar">
      <b style="font-size:14px">ช่วงข้อมูล</b>
      <span class="dseg">${seg(1,'1 วัน')}${seg(3,'3 วัน')}${seg(5,'5 วัน')}${seg(7,'7 วัน')}${seg(14,'14 วัน')}${seg(30,'1 เดือน')}</span>
      <span class="dpick ${dashCustom()?'on':''}">เลือกเอง
        <input type="date" id="dFrom" value="${esc(dashFrom||A.dates[0])}">
        <span class="cno">ถึง</span>
        <input type="date" id="dTo" value="${esc(dashTo||A.dates[A.dates.length-1])}">

      ${A.dates.length>=DASH_MAX_DAYS?('<span class="dchip" style="color:var(--absent)">จำกัดสูงสุด '+DASH_MAX_DAYS+' วัน</span>'):''}
      <span style="margin-left:auto" class="dhide">
        <button class="btn" id="dRefresh">⟳ ดึงใหม่</button>
        <button class="btn" id="dCopy">📋 คัดลอกสรุป</button>
        <button class="btn" id="dPrint">🖨 บันทึก PDF</button>
      </span>
    </div>
    ${prog}
    ${(function(){
      if(!dashPickDay)return '';
      const r=A.daily.find(x=>x.ds===dashPickDay);
      if(!r)return '';
      return '<div class="dpanel" style="border-color:var(--accent)">'
        +'<h3>รายละเอียดวันที่ '+esc(dashPickDay)+' <button class="btn mini" id="dPickClear" style="margin-left:auto">✕ ปิด</button></h3>'
        +'<div style="font-size:13.5px;line-height:1.85;white-space:pre-line">'+esc(dayDetailText(r).split('\n').slice(1).join('\n'))+'</div></div>';
    })()}
    <div class="dbar" style="padding:8px 12px">
      <span class="dseg">${tabBtn('overview','ภาพรวม')}${tabBtn('people','คน')}${tabBtn('route','เส้นทาง')}${tabBtn('truck','เที่ยวรถ')}${tabBtn('time','เวลา')}</span>
      <span class="cno" style="margin-left:auto">ข้อมูลจากหน้า 4 · อัปเดต ${nowHM()} น.</span>
    </div>
    ${body}
  </div>`;
  restore();
}

/* ---------- ช่องเลือกวันที่ของหน้า 6 ---------- */
document.getElementById('view').addEventListener('change',e=>{
  if(e.target.id==='dFrom'||e.target.id==='dTo'){
    const a=document.getElementById('dFrom'), b=document.getElementById('dTo');
    if(a&&b&&a.value&&b.value){dashFrom=a.value;dashTo=b.value;dashLoad();renderDash();}
    return;
  }
});
/* ---------- ปุ่มต่าง ๆ ของหน้า 6 ---------- */
document.getElementById('view').addEventListener('click',e=>{
  const dd=e.target.closest('[data-dday]');
  if(dd){dashDays=+dd.dataset.dday;dashFrom='';dashTo='';dashLoad();renderDash();return;}
  if(e.target.closest('#dClear')){dashFrom='';dashTo='';dashLoad();renderDash();return;}
  if(e.target.closest('#dPickClear')){dashPickDay='';renderDash();return;}
  const dp=e.target.closest('[data-dd]');
  if(dp){dashPickDay=(dashPickDay===dp.dataset.dd)?'':dp.dataset.dd;renderDash();return;}
  const dt=e.target.closest('[data-dtab]');
  if(dt){dashTab=dt.dataset.dtab;renderDash();return;}
  if(e.target.closest('#dRefresh')){dashLoad(true);return;}
  if(e.target.closest('#dPrint')){window.print();return;}
  if(e.target.closest('#dCopy')){
    const txt=dashText(dashAgg());
    try{
      navigator.clipboard.writeText(txt).then(()=>alert('คัดลอกสรุปแล้ว วางใน LINE / PowerPoint / Word ได้เลย'),
        ()=>alert(txt));
    }catch(err){alert(txt);}
    return;
  }
});

/* init */
/* ---- passcode gate (deterrent) ---- */
const GATE_HASH='1374cd4e';
function gateHash(s){s=(s||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h.toString(16);}
function unlockGate(){document.getElementById('gate').style.display='none';boot();}
function tryGate(){
  const v=document.getElementById('gate_code').value||'';
  if(gateHash(v)===GATE_HASH){if(document.getElementById('gate_remember').checked)lsSet('fleet:unlocked',GATE_HASH);unlockGate();}
  else{document.getElementById('gate_err').textContent='รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง';}
}
document.getElementById('gate_go').addEventListener('click',tryGate);
document.getElementById('gate_code').addEventListener('keydown',e=>{if(e.key==='Enter')tryGate();});
if(lsGet('fleet:unlocked')===GATE_HASH){unlockGate();}
else{setTimeout(()=>{const i=document.getElementById('gate_code');if(i)i.focus();},80);}

async function boot(){
  try{ await boot_(); }catch(err){ showFatal('เริ่มระบบ',err); }
}
async function boot_(){
  document.getElementById('dateInput').value=curDate;
  adminName=lsGet('fleet:admin')||'';
  try{const o=JSON.parse(lsGet('fleet:sumprod')||'null');if(o&&typeof o==='object')sumProdOpen=o;}catch(e){}
  /* URL ที่ตั้งเองผ่าน ⚙ ชนะ (มี flag manual) · ค่าค้างเก่าที่ไม่ได้ตั้งใจ ใช้ค่าในไฟล์แทน */
  const man=lsGet('fleet:backend:manual')==='1'?(lsGet('fleet:backend')||''):'';
  backendURL=man||BACKEND_URL_DEFAULT||'';
  if(!man&&lsGet('fleet:backend')&&lsGet('fleet:backend')!==BACKEND_URL_DEFAULT)lsSet('fleet:backend',BACKEND_URL_DEFAULT);
  await loadConfig();await loadRoutes();await loadOmsCfg();await loadDay();
  document.getElementById('fleetcount').textContent=Array.isArray(config)?config.length:'?';
  updateAdminChip();
  render();flag('ok');startPoll();startAlarms();fitTabs();
  if(tab==='roster')scrollToCurrentHour();
  if(!adminName||!backendURL)openLogin();
}
