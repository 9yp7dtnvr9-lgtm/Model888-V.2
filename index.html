}
let dashFillCache={w1:0,w2:0}, dashFillPass=false;
/* วัดความกว้างจริงของกล่องกราฟหลังวาดเสร็จ ถ้าคลาดจากที่ใช้ไปเกิน 8px ให้วาดซ้ำครั้งเดียว
   ทำแบบนี้เพราะตอนสร้าง HTML ยังไม่รู้ความกว้างของพาเนล แต่เส้นฐานต้องยาวเต็มพอดี */
function dashFillMeasure(){
  const v=document.getElementById('view');
  if(!v)return false;
  const one=[...v.querySelectorAll('.dpanel')].find(pn=>!pn.closest('.dtwo')&&pn.querySelector('.dscroll'));
  const two=v.querySelector('.dtwo .dpanel .dscroll');
  let changed=false;
  if(one){const w=Math.floor(one.querySelector('.dscroll').clientWidth);
    if(w>200&&Math.abs(w-dashFillCache.w1)>8){dashFillCache.w1=w;changed=true;}}
  if(two){const w=Math.floor(two.clientWidth);
    if(w>200&&Math.abs(w-dashFillCache.w2)>8){dashFillCache.w2=w;changed=true;}}
  return changed;
}
/* ตัวเลขทศนิยม 1 ตำแหน่งแบบทนค่าหาย — หน้าทั้งหน้าไม่ควรดับเพราะตัวเลขหายไปตัวเดียว */
function n1(v){return (Number(v)||0).toFixed(1);}   /* กัน undefined/NaN จาก pick() หลุดเข้าไปเป็นพิกัด SVG */
/* ค่าต่อวันของเกณฑ์ 1.4 — 2 ตำแหน่ง เพราะ 0.4 กับ 0.35 ครั้ง/วัน ต้องแยกอันดับออกจากกันได้ */
function n2(v){return (Number(v)||0).toFixed(2);}
function chTicks(max){const t=[0];const h=max/2;if(Number.isInteger(h)&&h>0)t.push(h);else if(max>10)t.push(Math.round(h));t.push(max);return t;}
/* เส้นตารางแนวนอน + ตัวเลขกำกับแกน Y */
function chGrid(x1,x2,ticks,y){
  return ticks.map(t=>`<line x1="${x1}" y1="${y(t)}" x2="${x2}" y2="${y(t)}" stroke="${t===0?CH_AXIS:CH_GRID}" stroke-width="1"></line>`
    +`<text x="${x1-6}" y="${y(t)+3}" font-size="8.5" text-anchor="end" fill="${CH_MUTE}" style="font-variant-numeric:tabular-nums">${t}</text>`).join('');
}
function chYAxis(x,top,base){return `<line x1="${x}" y1="${top-6}" x2="${x}" y2="${base}" stroke="${CH_AXIS}" stroke-width="1"></line>`;}
/* แท่งกราฟ: มุมบนโค้ง 4px ก้นแท่งตัดตรงติดเส้นแกน X */
function chBarPath(x,y,w,base){
  const h=base-y; if(h<=0.5)return '';
  const r=Math.min(4,w/2,h);
  return `M${x},${base} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${base} Z`;
}
function chLegend(series,hint){
  return `<div style="display:flex;gap:14px;font-size:11.5px;color:${CH_INK};margin-top:8px;flex-wrap:wrap;align-items:center">`
    +series.map(s=>`<span><i style="display:inline-block;width:9px;height:9px;background:${s.color};border-radius:2px;margin-right:5px;vertical-align:-1px"></i>${esc(s.label)}</span>`).join('')
    +(hint?`<span class="cno">${esc(hint)}</span>`:'')+`</div>`;
}
/* กราฟแท่งกลุ่มทั่วไป — แท่งในกลุ่มเดียวกันชิดกัน เว้นช่องว่างสีพื้น 2px ระหว่างแท่ง
   ส่วนช่องว่างระหว่าง "วัน" กว้างกว่า เพื่อให้เห็นว่าแท่งไหนเป็นชุดเดียวกัน
   items: [{ds, vals:[ตัวเลขตามลำดับ series], tip}] */
function chGroupedBars(items,series,aria,opts){
  const O=opts||{};
  const N=items.length; if(!N)return '<div class="cno">ไม่มีข้อมูล</div>';
  const S=series.length;
  const max=chNiceMax(Math.max(1,...items.map(it=>Math.max(0,...it.vals)))), ticks=chTicks(max);
  const padL=28,padR=14,padT=16,xBand=20,H=O.H||168;
  const innerH=H-padT-xBand, base=padT+innerH;
  /* ช่องว่างระหว่างแท่งในกลุ่มเดียวกัน — 2026-08-17 ผู้ใช้สั่งให้แท่งของวันเดียวกันชิดกันสนิท
     (opts.gap=0) เว้นเฉพาะระหว่างวัน · ค่าเดิม 2px ยังใช้ได้ถ้าไม่ส่ง opts มา */
  const BG=(O.gap===0)?0:2;
  const alwaysVals=!!O.alwaysVals;                        /* บังคับติดตัวเลขทุกแท่งที่ไม่เป็นศูนย์ */
  /* ความกว้างต่อวันหดลงเมื่อวันมาก (ช่วง 1 เดือน) เพื่อไม่ให้กราฟยาวเกินไป — ที่เหลือเลื่อนดูข้างได้ */
  const wide=alwaysVals?S*13+12:0;                        /* ต้องกว้างพอให้ตัวเลขไม่ทับกัน */
  let gW=Math.max(N<=4?110:N<=8?82:N<=14?58:N<=24?40:S*9+10, S*7+6, wide);
  /* ถ้ากราฟแคบกว่าพาเนล ให้ยืดช่องต่อวันจนเต็ม เพื่อให้เส้นฐาน/เส้นตารางยาวเต็มหน้า */
  const fillW=O.fill||0;
  if(fillW&&padL+padR+N*gW<fillW)gW=(fillW-padL-padR)/N;
  const W=Math.max(240,Math.round(padL+padR+N*gW));
  const barW=Math.max(6,Math.min(26,(gW*0.72-(S-1)*BG)/S));
  const inner=barW*S+BG*(S-1);
  const y=v=>base-(v/max)*innerH;
  const showVals=alwaysVals||barW>=11;
  const vFont=barW>=11?8.5:7.5;
  const everyX=Math.max(1,Math.ceil(N/14));               /* ป้ายวันที่เว้นระยะเมื่อวันมาก ไม่ให้ตัวหนังสือทับกัน */
  const showX=i=>(i%everyX)===0||i===N-1;
  /* ถ้าวันน้อย ๆ แล้วกลุ่มแท่งแคบกว่าพื้นที่วาด ให้จัดไว้กลางแกน ไม่ให้เหลือที่ว่างข้างเดียว */
  const off=Math.max(0,(W-padL-padR-N*gW)/2);
  const groups=items.map((it,i)=>{
    const gx=padL+off+gW*i, cx=gx+gW/2, x0=cx-inner/2, on=dashPickDay===it.ds;
    const bars=series.map((sr,k)=>{
      const v=it.vals[k]||0; if(!v)return '';             /* แท่งค่าศูนย์ไม่วาดและไม่ติดเลข 0 (รกตา) */
      const bx=x0+k*(barW+BG), by=y(v);
      return `<path d="${chBarPath(bx,by,barW,base)}" fill="${sr.color}"></path>`
        +(showVals?`<text x="${bx+barW/2}" y="${by-4}" font-size="${vFont}" text-anchor="middle" fill="${CH_INK}" style="font-variant-numeric:tabular-nums">${v}</text>`:'');
    }).join('');
    return `<g class="dpt${on?' on':''}" data-dd="${esc(it.ds)}">
      <title>${esc(it.tip)}</title>
      <rect x="${gx}" y="${padT-6}" width="${gW}" height="${innerH+6}" fill="${on?'rgba(43,108,176,.07)':'transparent'}"></rect>
      ${bars}
      ${showX(i)?`<text x="${cx}" y="${H-6}" font-size="8" text-anchor="middle" fill="${CH_MUTE}">${esc(String(it.ds).slice(5))}</text>`:''}</g>`;
  }).join('');
  return `<div class="dscroll"><svg class="dsvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
    ${chGrid(padL,W-padR,ticks,y)}${chYAxis(padL,padT,base)}${groups}
  </svg></div>`;
}

/* ---------- กราฟแท่งซ้อน 1 รายการ = 1 แท่ง แบ่งช่วงสีข้างในแท่ง (2026-08-17) ----------
   ใช้กับ Section 1.1 (1 วัน 1 แท่ง = แผนคนที่ต้องมา) และ 1.2 (1 คน 1 แท่ง = รอบที่วิ่งได้)
   items:  [{key, x, vals:[...], tip, foot}]   x = ป้ายใต้แกน · foot = ข้อความเล็กท้ายแท่ง
   series: [{label, color, ink}]  ink = สีตัวเลขที่วางในช่วงสีนั้น
   opts:   {H, clickable, minBand} */
function chStackedBars(items,series,aria,opts){
  const O=opts||{};
  const N=items.length; if(!N)return '<div class="cno">ไม่มีข้อมูล</div>';
  /* it.vals อาจเป็น [n,n,...] (แท่งเดียว) หรือ [[..],[..]] (หลายแท่งซ้อนในวันเดียวกัน)
     ใช้ทำ "แท่งแผน" กับ "แท่งไม่มา/มีปัญหา" วางคู่กันในวันเดียว ให้กราฟไม่รกเหมือนซ้อนรวมกันหมด */
  const multi=Array.isArray(items[0]&&items[0].vals[0]);
  const stacksOf=it=>multi?it.vals:[it.vals];
  const K=multi?items[0].vals.length:1;                    /* จำนวนแท่งต่อวัน */
  const totals=items.map(it=>stacksOf(it).map(a=>a.reduce((x,y)=>x+(+y||0),0)));
  const max=chNiceMax(Math.max(1,...totals.map(a=>Math.max(...a)))), ticks=chTicks(max);
  const padL=30,padR=16,padT=O.padT||24,xBand=O.xBand||24,H=O.H||220;
  const innerH=H-padT-xBand, base=padT+innerH;
  /* ช่วงสั้น ๆ ให้แต่ละแท่งกว้างขึ้น เพื่อไม่ให้กราฟกองอยู่มุมซ้ายของพาเนลกว้าง ๆ
     ช่วงยาวหดลงแล้วเลื่อนดูข้างในกล่องตามเดิม */
  let gW=Math.max(O.minBand||0, N<=4?110:N<=8?86:N<=14?60:N<=24?40:30);
  const fillW=O.fill||0;
  if(fillW&&padL+padR+N*gW<fillW)gW=(fillW-padL-padR)/N;   /* ยืดให้เต็มพาเนล */
  const W=Math.max(260,Math.round(padL+padR+N*gW));
  const BGAP=multi?4:0;                                    /* ช่องว่างระหว่างแท่งในวันเดียวกัน */
  const barW=Math.max(8,Math.min(multi?30:40,(gW*(multi?0.74:0.6)-BGAP*(K-1))/K));
  const y=v=>base-(v/max)*innerH;
  const GAP=2;                                            /* ช่องว่างสีพื้นระหว่างช่วงสี ตามมาตรฐานกราฟของระบบ */
  const everyX=Math.max(1,Math.ceil(N/16));
  const showX=i=>(i%everyX)===0||i===N-1;
  const off=Math.max(0,(W-padL-padR-N*gW)/2);
  const inner=barW*K+BGAP*(K-1);
  const bars=items.map((it,i)=>{
    const gx=padL+off+gW*i, cx=gx+gW/2, x0=cx-inner/2;
    const on=O.clickable&&dashPickDay===it.key;

      let acc=0;
      vals.forEach((v0,k)=>{
        const v=+v0||0; if(v<=0)return;
        const sr=ser[k]||{color:CH_IDLE,ink:'#fff'};
        const yA=y(acc), yB=y(acc+v); acc+=v;
        const h=Math.max(1,yA-yB-(k===top?0:GAP));
        out += (k===top)
          ? `<path d="${chBarPath(bx,yB,barW,yB+h)}" fill="${sr.color}"></path>`
          : `<rect x="${bx}" y="${yB}" width="${barW}" height="${h}" fill="${sr.color}"></rect>`;
        if(h>=11&&barW>=15)
          out += `<text x="${bx+barW/2}" y="${yB+h/2+3.2}" font-size="9" text-anchor="middle" fill="${sr.ink||'#fff'}" style="font-variant-numeric:tabular-nums;font-weight:600">${v}</text>`;
        else if(barW>=10)
          out += `<text x="${bx+barW/2}" y="${yB-3}" font-size="7.5" text-anchor="middle" fill="${CH_INK}" style="font-variant-numeric:tabular-nums">${v}</text>`;
      });

      /* it.tot = ยอดที่ต้องการให้เขียนกำกับบนหัวแท่ง แทนผลบวกของทุกช่วงสี
         ใช้ตอนที่มีช่วงสี "ส่วนที่ยังไม่ถึงแผน" อยู่ในแท่ง — ผลบวกจะเท่ากับแผน ไม่ใช่ปริมาณงานจริง
         ตำแหน่งยังอิงหัวแท่งจริง (stackTot) เพื่อไม่ให้ตัวเลขไปทับช่วงสี */
      const tot=(!multi&&it.tot!==undefined)?it.tot:stackTot;

    return `<g class="dpt${on?' on':''}"${O.clickable?` data-dd="${esc(it.key)}"`:''}>
      <title>${esc(it.tip)}</title>

      ${out}
      ${showX(i)?`<text x="${cx}" y="${H-(it.foot?14:6)}" font-size="8" text-anchor="middle" fill="${CH_MUTE}">${esc(it.x)}</text>`:''}
      ${footTxt}</g>`;

function dTrend(daily,pick,lab,color,opts){
  const O=opts||{};
  const vals=daily.map(r=>chNum(pick(r))), N=vals.length;
  if(!N)return '';
  const max=chNiceMax(Math.max(0,...vals)), ticks=chTicks(max);
  /* ระยะห่างต่อวันหดลงเมื่อวันมาก เพื่อไม่ให้กราฟยาวเป็นริบบิ้นบาง ๆ
     (ช่วง 1 เดือนเดิมกว้าง ~1,790px ตอนนี้เหลือ ~1,030px) ที่เหลือให้เลื่อนดูข้างในกล่อง */
  let step = N<=8?56 : N<=14?44 : N<=24?34 : 26;
  const padL=28,padR=14,padT=18,xBand=20,H=O.H||168;
  const innerH=H-padT-xBand, base=padT+innerH;
  /* ยืดระยะต่อวันให้กราฟกว้างเต็มพาเนล เส้นฐานจึงยาวเต็มหน้าแม้ข้อมูลมีไม่กี่วัน */
  const fillW=O.fill||0;
  if(fillW&&padL+padR+N*step<fillW)step=(fillW-padL-padR)/N;
  const W=Math.max(240,Math.round(padL+padR+N*step));
  const xa=padL+16, xb=W-padR-6;
  /* ป้ายตัวเลขบนจุด: ไม่ติดทุกจุด (ชนกันและอ่านไม่ออกเวลาวันมาก)
     ติดที่จุดแรก/จุดท้าย/จุดสูงสุด/จุดต่ำสุด และทุก ๆ ช่วงหนึ่ง — วันน้อยก็ติดครบเหมือนเดิม */
  const showAllVals = step>=44;
  const everyVal = Math.max(1,Math.ceil(N/10));
  const iMax = vals.indexOf(Math.max(...vals)), iMin = vals.indexOf(Math.min(...vals));
  const showVal = i => showAllVals || i===0 || i===N-1 || i===iMax || i===iMin || (i%everyVal)===0;
  /* ป้ายวันที่ใต้แกน: เว้นระยะเมื่อวันมาก ไม่ให้ตัวหนังสือทับกัน */
  const everyX = Math.max(1,Math.ceil(N/14));
  const showX = i => (i%everyX)===0 || i===N-1;
  const x=i=>N===1?(xa+xb)/2:xa+i*(xb-xa)/(N-1), y=v=>base-(v/max)*innerH;
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
  const area='M'+x(0)+','+base+' L'+vals.map((v,i)=>x(i)+','+y(v)).join(' L')+' L'+x(N-1)+','+base+' Z';
  const hit=Math.max(14,(xb-xa)/Math.max(1,N-1)/2);
  return `<div class="dscroll"><svg class="dsvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lab)}">
    ${chGrid(padL,W-padR,ticks,y)}${chYAxis(padL,padT,base)}
    <path d="${area}" fill="${color}" opacity=".10"></path>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
    ${vals.map((v,i)=>`<g class="dpt${dashPickDay===daily[i].ds?' on':''}" data-dd="${esc(daily[i].ds)}">
      <title>${esc(dayDetailText(daily[i]))}</title>
      <rect x="${x(i)-hit}" y="${padT-6}" width="${hit*2}" height="${innerH+6}" fill="transparent"></rect>
      <circle cx="${x(i)}" cy="${y(v)}" r="${dashPickDay===daily[i].ds?5:4}" fill="${dashPickDay===daily[i].ds?color:'#fff'}" stroke="${color}" stroke-width="2"></circle>
      ${(showVal(i)||dashPickDay===daily[i].ds)?`<text x="${x(i)}" y="${y(v)-9}" font-size="8.5" text-anchor="middle" fill="${CH_INK}" style="font-variant-numeric:tabular-nums">${v}</text>`:''}
      ${showX(i)?`<text x="${x(i)}" y="${H-6}" font-size="8" text-anchor="middle" fill="${CH_MUTE}">${daily[i].ds.slice(5)}</text>`:''}</g>`).join('')}
  </svg></div>`;
}
/* ---------- รายงานเที่ยวรถแยกตามกลุ่ม (2026-08) ----------
   นับ "เที่ยว" เฉพาะที่ปิดงานแล้วเท่านั้น (ตามที่ยืนยัน) ต่อคัน ต่อวัน แบ่งเป็น 3/2/1/0 เที่ยว
   รถ 0 เที่ยว แยกเป็นรายงานย่อยต่างหาก (อาจส่งซ่อม/มีปัญหา) ให้บันทึกหมายเหตุได้ */
/* รวมหมายเหตุเดิมจากหน้า 1 (คอลัมน์ "หมายเหตุ" ต่อกะ/ต่อคนขับ ของรถคันนั้น) เป็นข้อความเดียว
   ตัดค่าซ้ำ/ค่าว่างออก — ใช้เป็นค่าเริ่มต้นของช่องหมายเหตุรถ 0 เที่ยว ก่อนที่ CC จะพิมพ์เพิ่มเอง */
function dnoteJoin(posMap){
  if(!posMap||typeof posMap!=='object')return '';
  const vals=[...new Set(Object.values(posMap).map(v=>String(v||'').trim()).filter(Boolean))];
  return vals.join(' / ');
}
function tripBucketCounts(row,group){
  const g=FLEET_GROUPS.find(x=>x.k===group)||FLEET_GROUPS[0];
  const fleet=(row.fleet||[]).filter(t=>t&&t.truckNo&&g.test(t));
  let b3=0,b2=0,b1=0; const zero=[];
  fleet.forEach(t=>{
    const n=(row.truckClosed||{})[t.truckNo]||0;
    if(n>=3)b3++; else if(n===2)b2++; else if(n===1)b1++;
    else{
      /* หมายเหตุที่บันทึกไว้เฉพาะทาง (ช่องนี้) มาก่อน — ถ้ายังไม่มี ใช้หมายเหตุเดิมจากหน้า 1 เป็นค่าเริ่มต้น ยังแก้ไข/พิมพ์เพิ่มได้ตามปกติ */
      /* ต้องแยก "ยังไม่เคยกรอก" (undefined) ออกจาก "กรอกแล้วแต่ลบออกเอง" ('') ไม่งั้นลบค่าไม่ได้ เพราะจะเด้งกลับไปเอาหมายเหตุหน้า 1 */
      const saved=(row.truckNote||{})[t.truckNo];
      const note=(saved!==undefined)?saved:dnoteJoin((row.dnote||{})[t.truckNo]);
      zero.push({truckNo:t.truckNo,route:t.routeGroup||'',note:note||''});
    }
  });
  return {b3:b3,b2:b2,b1:b1,zero:zero,total:fleet.length};
}
function dGroupedBars(daily,group){
  const N=daily.length; if(!N)return '<div class="cno">ไม่มีข้อมูล</div>';
  const rows=daily.map(r=>r.noData?{b3:0,b2:0,b1:0,zero:[],total:0}:tripBucketCounts(r,group));
  const SER=[{label:'3 เที่ยว/วัน',color:'#2f8f6b'},{label:'2 เที่ยว/วัน',color:'#b8860b'},{label:'1 เที่ยว/วัน',color:'#c0392b'}];
  const items=daily.map((r,i)=>({ds:r.ds,vals:[rows[i].b3,rows[i].b2,rows[i].b1],
    tip:r.ds+' — 3 เที่ยว '+rows[i].b3+' คัน · 2 เที่ยว '+rows[i].b2+' คัน · 1 เที่ยว '+rows[i].b1+' คัน · 0 เที่ยว '+rows[i].zero.length+' คัน'}));
  /* 2026-08-17 · แท่งของวันเดียวกันชิดกัน เว้นแค่ระหว่างวัน และติดตัวเลขทุกแท่ง */
  return chGroupedBars(items,SER,'เที่ยวที่ปิดงานแล้วต่อคัน 3/2/1 เที่ยวต่อวัน',
      {gap:0,alwaysVals:true,fill:dashFillW(1)})
    +chLegend(SER,'กดแท่งวันไหนก็ได้ เพื่อดูรายละเอียดของวันนั้น');
}
/* ---------- กราฟแท่งกลุ่มทั่วไป N ชุด/วัน (ใช้กับ "ขาด/สาย/ลา รายวัน" หน้า 6) ----------
   series: [{key,label,color,pick:r=>ค่าของวันนั้น}, ...] */
function dMultiBars(daily,series,opts){
  const N=daily.length; if(!N)return '<div class="cno">ไม่มีข้อมูล</div>';
  const items=daily.map(r=>{
    const vals=series.map(sr=>r.noData?0:chNum(sr.pick(r)));
    return {ds:r.ds,vals:vals,tip:r.ds+' — '+series.map((sr,k)=>sr.label+' '+vals[k]).join(' · ')};
  });
  return chGroupedBars(items,series,series.map(sr=>sr.label).join(' / ')+' รายวัน',opts)+chLegend(series,'');
}

/* ================= Section 1 · พจส. (2026-08-17) ================= */
/* 1.1 — 1 วัน 1 แท่ง ความสูงทั้งแท่ง = แผนที่ พจส. ต้องมาทำงานของวันนั้น
   ข้างในแบ่ง 4 ช่วง รวมกันได้เท่ากับแผนพอดี จึงอ่านเป็นสัดส่วนได้ตรง */
/* ================= 1.1 ปริมาณงาน (2026-08-18) =================
   ข้อมูลชุดเดียวกับตาราง "ปริมาณงานเทียบแผน (แยกตามประเภทงาน 4 กลุ่ม)" ของหน้า 4
   แผนอ่านจาก day.plan คีย์ "กลุ่ม|สินค้า" · งานจริงนับใบงานด้วย jobType(j) เกณฑ์เดียวกับหน้า 4
   1 วัน 2 แท่งวางชิดกัน
     แท่งซ้าย "ตามแผน" : ทำจริงงานหลัก + ทำจริงงานรอง(VT) + ที่ยังไม่ถึงแผน (หรือส่วนที่เกินแผน)
     แท่งขวา  "งานนอก" : BU อื่น สายยาว + สายสั้น */
/* 2026-08-19 ผู้ใช้สั่ง: 1 วัน 1 แท่ง = "ปริมาณงานที่จ่ายทั้งหมด" ของวันนั้น
   แยกสีแค่ 2 อย่าง งานใน BU4 (หลัก + VT) กับ งานนอก BU (BU อื่น สายยาว + สายสั้น)
   แล้วเทียบกับแผนงานของวันนั้น
     ทำได้ไม่ถึงแผน -> เติมช่วงสีเทา "ยังไม่ถึงแผน" ให้หัวแท่งไปจบที่เส้นแผน
     ทำเกินแผน      -> **ไม่เติมช่วงสีเพิ่ม** เพราะจะทำให้แท่งสูงเกินงานจริง บอกเป็นข้อความใต้แท่งแทน
   ตัวเลขบนหัวแท่งคือปริมาณงานที่จ่ายจริง (ไม่ใช่ผลบวกที่มีสีเทารวมอยู่) ผ่าน it.tot */
const SER_WORK=[
  {label:'งานใน BU4 (หลัก + VT)',        color:CH_W_MAIN, ink:'#fff'},
  {label:'งานนอก BU (BU อื่น)',           color:CH_W_LONG, ink:'#fff'},
  {label:'ยังไม่ถึงแผน',                  color:CH_W_GAP,  ink:CH_INK}
];
function dWorkStack(daily){
  const items=daily.map(r=>{
    const T=r.types||{};
    const inBU=(T.main||0)+(T.vt||0);                      /* งานใน BU4 = หลัก + VT */
    const outBU=(T.oth_l||0)+(T.oth_s||0);                 /* งานนอก BU = BU อื่น ทั้งสายยาวและสายสั้น */
    const total=inBU+outBU;                                /* ปริมาณงานที่จ่ายทั้งหมดของวันนั้น */
    const plan=r.plan||0;                                  /* แผนรวมทุกกลุ่มของวันนั้น (ชุดเดียวกับหน้า 4) */
    const gap=Math.max(0,plan-total), over=Math.max(0,total-plan);
    const P=r.planByType||{};
    return {key:r.ds,x:String(r.ds).slice(5),vals:[inBU,outBU,gap],tot:total,
      foot:plan?('แผน '+plan+(over?(' · เกิน +'+over):'')):'ไม่ได้ตั้งแผน',
      tip:r.ds+' — จ่ายงานทั้งหมด '+total+' เที่ยว'
        +' (งานใน BU4 '+inBU+' [หลัก '+(T.main||0)+' · VT '+(T.vt||0)+']'
        +' · งานนอก BU '+outBU+' [สายยาว '+(T.oth_l||0)+' · สายสั้น '+(T.oth_s||0)+'])'
        +' || แผน '+plan+' เที่ยว'
        +(plan?(' · ทำได้ '+Math.round(total/plan*100)+'% ของแผน'):' (ยังไม่ได้ตั้งแผน)')
        +(gap?(' · ยังไม่ถึงแผน '+gap):'')+(over?(' · เกินแผน '+over):'')
        +(plan?(' || แผนแยกกลุ่ม: ใน BU4 '+((P.main||0)+(P.vt||0))+' · นอก BU '+((P.oth_l||0)+(P.oth_s||0))):'')};
  });
  /* ช่องสีเทาใส่ในคำอธิบายเฉพาะเมื่อมีวันที่ทำไม่ถึงแผนจริง ไม่งั้นรกเปล่า ๆ */
  const anyGap=items.some(it=>(+it.vals[2]||0)>0);
  const legend=SER_WORK.slice(0,2).concat(anyGap?[SER_WORK[2]]:[]);
  return chStackedBars(items,SER_WORK,'ปริมาณงานที่จ่ายรายวัน แยกงานใน BU / นอก BU เทียบแผน',
      {H:250,clickable:true,fill:dashFillW(1)})
    +chLegend(legend,'1 วัน 1 แท่ง = ปริมาณงานที่จ่ายทั้งหมด · ตัวเลขบนหัวแท่ง = จำนวนที่จ่ายจริง · ข้อความใต้แท่ง = แผนของวันนั้น (และส่วนที่เกินแผน ถ้ามี) · ข้อมูลชุดเดียวกับตารางปริมาณงานเทียบแผน หน้า 4');
}

/* แท่งที่ 1 — เทียบกับ "แผนที่ต้องมา" ของวันนั้น รวมกันได้เต็มแท่งพอดี */
const SER_ATT=[
  {label:'มา · วิ่งงานหลัก',   color:CH_MAIN, ink:'#fff'},
  {label:'มา · วิ่งงานรอง',    color:CH_OUT,  ink:'#fff'},
  {label:'มาแต่ไม่ได้วิ่งงาน', color:CH_IDLE, ink:'#fff'},
  {label:'ยังขาดจากแผน',       color:CH_NONE, ink:CH_INK}
];
/* แท่งที่ 2 — ฝั่งที่มีปัญหา แยกออกมาอีกแท่งเพื่อไม่ให้แท่งเดียวรกเกินไป (2026-08-17) */
const SER_ATT2=[
  {label:'สาย',        color:'#eda100',  ink:'#fff'},
  {label:'ลา',         color:CH_LEAVE,   ink:'#fff'},
  {label:'ขาด',        color:CH_ABSENT,  ink:'#fff'},
  {label:'ยังไม่เช็ก', color:CH_NONE,    ink:CH_INK}
];
function dAttStack(daily){
  const items=daily.map(r=>{
    const A=r.noData?[0,0,0,0]:[r.pMain,r.pOut,r.pIdle,(r.pLeave+r.pAbsent+r.pUncheck)];
    const B=r.noData?[0,0,0,0]:[r.pLate,r.pLeave,r.pAbsent,r.pUncheck];
    const plan=A[0]+A[1]+A[2]+A[3];
    return {key:r.ds,x:String(r.ds).slice(5),vals:[A,B],
      tip:r.ds+' — แผนต้องมา '+plan+' คน'
        +' · มาจริง '+(A[0]+A[1]+A[2])+' คน (วิ่งงานหลัก '+A[0]+' · วิ่งงานรอง '+A[1]+' · มาแต่ไม่ได้วิ่งงาน '+A[2]+')'
        +' · ไม่มา '+A[3]+' คน'
        +' || ฝั่งปัญหา: สาย '+B[0]+' (นับรวมอยู่ในคนที่มาแล้ว) · ลา '+B[1]+' · ขาด '+B[2]+' · ยังไม่เช็ก '+B[3]
        +(r.pOtOff?(' · มา OT วันหยุดอีก '+r.pOtOff+' คน (ไม่อยู่ในแผน)'):'')};
  });
  const legend=SER_ATT.concat(SER_ATT2.slice(0,3));
  return chStackedBars(items,SER_ATT,'การมาทำงานของ พจส. รายวัน — แท่งซ้ายเทียบแผน แท่งขวาฝั่งปัญหา',
      {H:250,clickable:true,fill:dashFillW(1),series2:SER_ATT2,subLab:['แผน','ปัญหา'],noTotal:[1]})
    +chLegend(legend,'แท่งซ้าย = เทียบกับแผนที่ต้องมา · แท่งขวา = สาย/ลา/ขาด/ยังไม่เช็ก ("สาย" นับรวมอยู่ในคนที่มาแล้ว) · กดแท่งเพื่อดูรายละเอียดวัน');
}
/* 1.2 — 1 คน 1 แท่ง ความสูง = รอบที่วิ่งได้ทั้งช่วง แบ่งสีหลัก/นอก ท้ายแท่งบอก ชม./รอบ */
const SER_RND=[

/* 1.4 — ตารางจัดอันดับ (เกณฑ์ใหม่ 2026-08-19)
   วัดด้วย "รอบต่อวันที่มาทำงาน" ไม่ใช่ยอดรวมทั้งช่วง — เพราะยอดรวมเอาเปรียบคนที่มาครบทุกวัน
   ตัวหาร = จำนวนวันที่คนนั้นมาทำงานจริง (มา/มาสาย/มา OT) **ภายในช่วงวันที่เลือกเท่านั้น**
   เลือก 7 วัน ตัวหารก็นับแค่ 7 วันนั้น เปลี่ยนช่วง อันดับเปลี่ยนตามทันที
   เท่ากันดู ชม./รอบ (น้อยกว่า = ทำได้เร็วกว่า = ดีกว่า) แล้วจึงดูรอบรวม */
function dPersonRank(A){

      <tbody>${list.map((p,i)=>`<tr>

          ><span style="font-weight:700;font-size:15px">${n2(p.rpd)}</span>
          <div class="cno" style="font-size:11px">จาก ${p.cameDays} วัน</div></td>
        <td class="mono" style="text-align:center">${p.rounds}</td>
        <td class="mono" style="text-align:center">${p.main||'-'}</td>
        <td class="mono" style="text-align:center">${p.out||'-'}</td>
        <td class="mono" style="text-align:center">${p.hpr!==null?p.hpr:'<span class="cno">-</span>'}</td></tr>`).join('')}</tbody>
      </table></div></div>`;
  };
  return `<div class="cno" style="margin:-4px 0 8px">เกณฑ์: <b>รอบ ÷ จำนวนวันที่คนนั้นมาทำงานจริง</b> ในช่วง ${A.dates.length} วันที่เลือก
      · เท่ากันดู ชม./รอบ น้อยกว่าก่อน · คนที่ยังไม่มีวันมาทำงานในช่วงนี้ไม่เข้าอันดับ</div>
    <div class="dtwo">
    ${tbl(good,'พจส. ทำรอบได้ดี 10 อันดับ <span class="cno">(รอบ/วัน มากก่อน)</span>','ยังไม่มีข้อมูล')}
    ${tbl(bad,'พจส. ทำรอบได้น้อย 10 อันดับ <span class="cno">(รอบ/วัน น้อยก่อน)</span>','ยังไม่มีข้อมูล')}
  </div>`;
}
/* สาย / ลา / ขาด — วัดเป็น "% ของวันที่ต้องมาทำงาน" (2026-08-19)
   ตัวหารคือ dutyDays ไม่ใช่ cameDays เพราะวันที่ลาหรือขาด คนนั้นไม่ได้มา
   ถ้าหารด้วยวันที่มา คนที่ลา 3 จาก 5 วันจะได้ 150% ซึ่งอ่านไม่ได้
   ค่านี้เป็นสัดส่วนอยู่แล้ว (มากสุด = ทุกวันที่ต้องมา = 100%) จึงแสดงเป็น % และติดสัญลักษณ์ % ทุกที่
   ยังโชว์จำนวนครั้งดิบ / วันที่ต้องมา กำกับไว้ เพื่อให้ตรวจย้อนได้ว่า % มาจากไหน */
function pctOf(v){return Math.round((Number(v)||0)*100)+'%';}
function dRatePanel(A,head,rateKey,cntKey,color,none){
  const list=A.people.filter(p=>p.dutyDays>0&&(p[cntKey]||0)>0)
    .sort((a,b)=>(b[rateKey]-a[rateKey])||((b[cntKey]||0)-(a[cntKey]||0))
      || String(a.name||a.code).localeCompare(String(b.name||b.code),'th'))
    .slice(0,8);
  if(!list.length)return `<div class="dpanel"><h3>${head}</h3><div class="cno">${none}</div></div>`;
  const max=list[0][rateKey]||1;
  return `<div class="dpanel"><h3>${head}</h3>`
    +list.map((p,i)=>{
      const tip=(p.name||'-')+' ('+p.code+') — '+p[cntKey]+' ครั้ง จาก '+p.dutyDays
        +' วันที่ต้องมาทำงาน = '+pctOf(p[rateKey])+' · อันดับที่ '+(i+1);
      return `<div class="drow" title="${esc(tip)}">
        <div><div style="margin-bottom:3px">${esc(p.name||'-')}
          <span class="cno mono" style="font-size:11px">${esc(p.code)}</span>
          <span class="cno" style="font-size:11px"> · ${p[cntKey]} ครั้ง / ${p.dutyDays} วัน</span></div>
          <div class="dbar2"><i style="width:${Math.round(p[rateKey]/max*100)}%;background:${color}"></i></div></div>
        <div class="dnum">${pctOf(p[rateKey])}</div></div>`;
    }).join('')
    +`</div>`;
}
/* ================= Section 2 · รายงาน "รถ 0 เที่ยว" (2026-08-17) =================
   "0 เที่ยว" = วันนั้นรถคันนั้นไม่มีเที่ยวที่ปิดงานเลย (เกณฑ์เดียวกับกราฟ 2.1)
   ตารางที่ 1 รายชื่อเบอร์รถ · กดแล้วตารางที่ 2 โชว์ไทม์ไลน์รายวันพร้อมสาเหตุ
   สาเหตุไล่ตามลำดับความสำคัญ: หมายเหตุที่ CC พิมพ์ > ไม่มีคนขับ > จ่ายงานแล้วยังไม่ปิด > มีคนแต่ไม่ได้จ่ายงาน */
const ZERO_WHY = {
  note   : ['หมายเหตุจาก CC','note'],
  nocrew : ['ไม่มีคนขับ','bad'],
  nojob  : ['มีคนขับ แต่ไม่ได้จ่ายงาน','warn'],
  holiday: ['วันหยุดทั้งคัน','muted'],
  nodata : ['ไม่มีข้อมูลของวันนั้น','muted']
};
function zeroReason(row,no){
  if(!row||row.noData)return {k:'nodata',text:''};
  const tc=(row.truckCrew||{})[no];
  if(!tc)return {k:'nodata',text:''};
  /* หมายเหตุที่ CC พิมพ์ไว้มาก่อนเสมอ (ช่องเฉพาะ > หมายเหตุต่อกะจากหน้า 1) */
  const saved=(row.truckNote||{})[no];
  const note=(saved!==undefined&&String(saved).trim())?String(saved).trim()
            :dnoteJoin((row.dnote||{})[no]);
  if(note)return {k:'note',text:note};
  if(tc.crew&&tc.off>=tc.crew)return {k:'holiday',text:''};
  if(!tc.came)return {k:'nocrew',text:'ขาด '+tc.absent+' · ลา '+tc.leave+' · วันหยุด '+tc.off
    +(tc.uncheck?(' · ยังไม่เช็ก '+tc.uncheck):'')};
  return {k:'nojob',text:'คนขับมา '+tc.came+' คน'};
}
/* รวมรายคัน: กี่วันที่ไม่ได้วิ่ง และสาเหตุที่พบบ่อยสุด
   *** เกณฑ์ "0 เที่ยว" ต้องตรงกับตารางที่ 4 ของหน้า 4 (roundsData) ***
   หน้า 4 นับ "รอบ" = จำนวนใบงานที่จ่ายให้รถคันนั้น (ตามเลขรถวิ่งจริง) ไม่ได้ดูว่าปิดงานหรือยัง
   ก่อนแก้ 2026-08-18 หน้านี้ใช้ "เที่ยวที่ปิดงานแล้ว" ทำให้รถที่จ่ายงานแล้วแต่ยังไม่ปิด
   ขึ้นเป็น 0 เที่ยวที่นี่ แต่หน้า 4 ขึ้น 1 รอบ ตัวเลขสองหน้าจึงไม่ตรงกัน (ผู้ใช้แจ้ง)
   และกรองรายชื่อรถแบบเดียวกับหน้า 4: รถที่คนขับน้อยกว่าเป้า และไม่มีใบงานเลย จะไม่อยู่ในตาราง */
function zeroTruckData(A){
  const inFleet={}; (A.daily||[]).forEach(r=>Object.keys(r.truckCrew||{}).forEach(no=>inFleet[no]=1));
  const rows=Object.keys(inFleet).map(no=>{
    const days=[]; const why={};
    (A.daily||[]).forEach(r=>{
      const tc=(r.truckCrew||{})[no];
      if(!r.noData&&tc&&tc.jobs>0)return;                   /* วันนั้นมีใบงาน = ไม่ใช่ 0 รอบ (เกณฑ์หน้า 4) */
      if(r.noData&&!tc)return;                              /* ไม่มีข้อมูลและไม่มีรถคันนี้ในตารางกะ */
      /* หน้า 4 ตัดรถที่คนขับน้อยกว่าเป้าและไม่มีใบงานออกจากตาราง — ทำเหมือนกัน */
      if(tc&&!tc.jobs&&tc.crew<TARGET_ROUNDS)return;
      const w=zeroReason(r,no);
      if(w.k==='holiday')return;                            /* วันหยุดทั้งคัน ไม่ถือว่าเป็นปัญหา */
      days.push({ds:r.ds,k:w.k,text:w.text});
      why[w.k]=(why[w.k]||0)+1;
    });
    const top=Object.keys(why).sort((a,b)=>why[b]-why[a])[0]||'';
    const route=(()=>{for(const r of (A.daily||[])){const tc=(r.truckCrew||{})[no];if(tc&&tc.route)return tc.route;}return '';})();
    return {truck:no,route:route,zeroDays:days.length,days:days,why:why,top:top};
  }).filter(r=>r.zeroDays>0);
  rows.sort((a,b)=>(b.zeroDays-a.zeroDays)||a.truck.localeCompare(b.truck,'th'));
  return rows;
}
function zeroChip(k,extra){
  const L=ZERO_WHY[k]||[k,'muted'];
  const cls=L[1]==='bad'?'b-wait':L[1]==='warn'?'b-charge':L[1]==='note'?'b-done':'';
  return `<span class="badge ${cls}">${esc(L[0])}</span>`+(extra?` <span class="cno">${esc(extra)}</span>`:'');
}
function dZeroReport(A){
  const rows=zeroTruckData(A);
  const nDays=(A.daily||[]).length;
  if(!rows.length)return `<div class="dpanel"><h3>3.3 · รถ 0 รอบ</h3>
    <div class="cno">ทุกคันได้รับใบงานครบทุกวันในช่วงนี้</div></div>`;
  const sel=rows.find(r=>r.truck===dashZeroPick)||null;
  /* ช่อง "หมายเหตุ" ในตารางนี้ = **โชว์เฉย ๆ แก้ไม่ได้** (ผู้ใช้สั่ง 2026-08-19)
     ถ้าจะแก้ต้องกดแถวเข้าไปแก้ที่แผงไทม์ไลน์ด้านขวา ซึ่งเห็นรายวันประกอบว่าทำไมไม่ได้วิ่ง
     ยังไม่เคยพิมพ์หมายเหตุ = โชว์ป้ายสาเหตุที่ระบบเดาให้ตามเดิม
     สองสถานะซ้อนในช่องเดียว (znoteval / znoteauto) เพื่อสลับได้ทันทีตอนพิมพ์ที่แผงขวา
     โดยไม่ต้องวาดทั้งหน้าใหม่ (ถ้าวาดใหม่ ช่องที่กำลังพิมพ์จะเสียโฟกัส) */
  const list=rows.map(r=>{
    const auto=r.top?(ZERO_WHY[r.top]?ZERO_WHY[r.top][0]:r.top):'';
    const has=truckNoteOf(r.truck);
    const tip=(has?('หมายเหตุของ '+r.truck+': '+has)
                  :(auto?('ระบบเดาให้: '+auto+' ('+(r.why[r.top]||0)+' วัน)'):''))
      +' — กดแถวนี้เพื่อแก้หมายเหตุที่แผงไทม์ไลน์';
    return `<tr class="zrow${sel&&sel.truck===r.truck?' on':''}" data-zpick="${esc(r.truck)}" title="${esc(tip)}">
      <td class="plate">${esc(r.truck)}</td>
      <td class="cno">${esc(r.route||'-')}</td>
      <td class="mono" style="text-align:center;font-weight:700;font-size:15px">${r.zeroDays}</td>
      <td class="mono" style="text-align:center;color:var(--muted)">${nDays}</td>
      <td data-znoteshow="${esc(r.truck)}"><span class="znoteval"${has?'':' style="display:none"'}>${esc(has)}</span><span class="znoteauto"${has?' style="display:none"':''}>${auto?zeroChip(r.top):'<span class="cno">—</span>'}</span></td>
      <td style="text-align:center;color:var(--muted)">▸</td></tr>`;
  }).join('');
  const tbl1=`<div class="dpanel"><h3>3.3 · รถ 0 รอบ <span class="cno">(ไม่มีใบงานเลยในวันนั้น · เกณฑ์เดียวกับตารางที่ 4 หน้า 4 · กดที่แถวเพื่อดูไทม์ไลน์)</span></h3>
    <div class="tablewrap" style="max-height:340px;overflow:auto"><table style="min-width:540px">
    <thead><tr><th>เบอร์รถ</th><th>ต้นทาง</th><th style="text-align:center">วันที่ 0 รอบ</th>
      <th style="text-align:center">จากทั้งหมด</th><th style="min-width:190px">หมายเหตุ</th><th></th></tr></thead>
    <tbody>${list}</tbody></table></div>
    <div class="cno" style="margin-top:8px">ช่องหมายเหตุในตารางนี้ <b>ดูได้อย่างเดียว</b>
      · จะแก้ให้กดที่แถว แล้วพิมพ์ในช่องหมายเหตุที่แผงไทม์ไลน์ด้านขวา
      · ป้ายสีคือสาเหตุที่ระบบเดาให้ จะถูกแทนที่เมื่อพิมพ์หมายเหตุเอง</div></div>`;

  const tbl2=(()=>{
    if(!sel)return `<div class="dpanel"><h3>ไทม์ไลน์รายวัน</h3>
      <div class="cno">กดเลือกเบอร์รถจากตารางด้านซ้าย เพื่อดูว่าไม่ได้วิ่งวันไหนและเพราะอะไร</div></div>`;
    const strip=sel.days.map(d=>{
      const L=ZERO_WHY[d.k]||[d.k,'muted'];
      const col=L[1]==='bad'?CH_ABSENT:L[1]==='warn'?'#eda100':L[1]==='note'?CH_MAIN:'#c8d0da';
      return `<span class="ztick" style="background:${col}" title="${esc(d.ds+' — '+L[0]+(d.text?(' · '+d.text):''))}"></span>`;
    }).join('');
    const body=sel.days.map(d=>`<tr>
      <td class="mono">${esc(d.ds)}</td>
      <td>${zeroChip(d.k,d.text)}</td></tr>`).join('');
    const sum=Object.keys(sel.why).map(k=>(ZERO_WHY[k]?ZERO_WHY[k][0]:k)+' '+sel.why[k]+' วัน').join(' · ');
    const autoSel=sel.top?(ZERO_WHY[sel.top]?ZERO_WHY[sel.top][0]:sel.top):'';
    /* ที่เดียวที่แก้หมายเหตุได้ — เก็บที่ truckNotes (1 คัน 1 ข้อความ ไม่ผูกวัน)
       *** ไม่เขียนลง day.dnote หรือ day.truckNote *** หมายเหตุของแหล่งที่มาจึงไม่ถูกแตะ */
    return `<div class="dpanel"><h3>ไทม์ไลน์ของ ${esc(sel.truck)}
        <span class="cno">0 รอบ ${sel.zeroDays} วัน จาก ${nDays} วัน</span>
        <button class="btn mini" id="dZeroClear" style="margin-left:auto">✕ ปิด</button></h3>
      <div class="zstrip">${strip}</div>
      <div class="cno" style="margin:8px 0 10px">${esc(sum)}</div>
      <div style="margin:0 0 12px">
        <div class="lb" style="margin-bottom:4px">หมายเหตุของ ${esc(sel.truck)}
          <span class="cno">(ประจำตัวรถ ไม่ผูกกับวันที่เลือก · ไม่ไปแก้หมายเหตุที่หน้า 1)</span></div>
        <input class="znote" id="dZeroNote" data-znote="${esc(sel.truck)}" value="${esc(truckNoteOf(sel.truck))}"
          placeholder="${esc(autoSel?('ยังไม่มีหมายเหตุ · ระบบเดาให้ว่า '+autoSel):'พิมพ์หมายเหตุของรถคันนี้')}" maxlength="200">
      </div>
      <div class="tablewrap" style="max-height:260px;overflow:auto"><table style="min-width:320px">
      <thead><tr><th>วันที่</th><th>0 รอบเพราะ</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  })();
  return `<div class="dtwo">${tbl1}${tbl2}</div>`;
}

/* ชื่อยาวใต้แท่งกราฟจะทับกัน ตัดให้สั้นแต่ยังเดาได้ว่าใคร */
function shortName(v){
  const s=String(v||'').trim(); if(!s)return '-';
  const p=s.split(/\s+/);
  return p.length>1 ? (p[0].slice(0,7)+' '+p[1].slice(0,1)+'.') : s.slice(0,9);
}
/* กล่อง "รายละเอียดวันที่" ที่เด้งขึ้นเมื่อกดแท่ง/จุดบนกราฟ

function dPickPanel(A){

/* รายชื่อรถ 0 เที่ยว(ปิดงาน) ของวันที่เลือก + ช่องบันทึกหมายเหตุ (แก้แล้วเซฟอัตโนมัติ) */
/* ฟังก์ชัน dZeroPanel (ตาราง "รถ 0 เที่ยว") ถูกลบออก 2026-08-14 ตามที่ผู้ใช้สั่ง */
function dashText(A){
  const L=[];
  L.push('สรุปงานขนส่ง EV — BU4');
  L.push('ช่วง '+A.dates[0]+' ถึง '+A.dates[A.dates.length-1]+' ('+A.haveDays+'/'+A.dates.length+' วันที่มีข้อมูล)');
  L.push('');
  L.push('เที่ยวงานรวม '+A.trips+' เที่ยว · เฉลี่ย '+n1(A.tripsPerDay)+' เที่ยว/วัน');
  L.push('ปิดงานแล้ว '+A.closed+' เที่ยว · แผนที่ตั้งไว้ '+A.plan+' เที่ยว'+(A.plan?(' ('+Math.round(A.trips/A.plan*100)+'% ของแผน)'):''));
  L.push('พจส. มาทำงาน '+A.att.present+'/'+A.att.sched+' ('+n1(A.attRate)+'%) · สาย '+A.att.late+' · ขาด '+A.att.absent+' · ลา '+A.att.leave+' · OT '+A.att.ot);
  L.push('เวลาทำงานเฉลี่ย '+n1(A.hoursAvg)+' ชม./เที่ยว · เกินเกณฑ์ '+A.over8+' เที่ยว');
  WT_GROUPS.forEach(x=>{const q=A.wt[x.k];if(q&&q.n)L.push('  · '+x.name+' ไม่เกิน '+q.ok+' · เกิน '+q.over+' (จาก '+q.n+' เที่ยว)');});
  L.push('');
  L.push('แยกตามประเภทงาน');
  JOBTYPES.forEach(t=>L.push('  · '+t.f+' '+(A.byType[t.k]||0)+' เที่ยว'));
  const top=k=>Object.keys(k).map(x=>[x,k[x]]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  L.push('');
  L.push('สินค้า/เส้นทางที่วิ่งมากสุด');
  top(A.prod).forEach(([k,v])=>L.push('  · '+k+' '+v+' เที่ยว'));
  L.push('');
  L.push('รายบุคคลย้อนหลัง (Section 5)');
  L.push('  · พจส. ทั้งหมดในช่วงนี้ '+(A.people||[]).length+' คน · วิ่งงานอย่างน้อย 1 เที่ยว '
    +(A.people||[]).filter(p=>p.rounds>0).length+' คน · ไม่ได้วิ่งงานเลย '
    +(A.people||[]).filter(p=>!p.rounds).length+' คน');
  return L.join('\n');
}
/* ================= Section 5 · ตารางสรุป + รายละเอียดรายบุคคล (2026-08-28) =================
   ข้อมูลดิบมาจาก A.people[].histDays ที่ dashAgg/personHistDays เตรียมไว้แล้ว (ดูหัวข้อด้านบน)
   ตารางสรุป: แสดง พจส. ทุกคนที่อยู่ในตารางกะของช่วงนี้เสมอ รวมคนที่ไม่ได้วิ่งงานเลย (ตามที่ผู้ใช้สั่ง 2026-08-28)

function histTableHTML(A){
  const list=A.people||[];
  if(!list.length)return `<div class="dpanel"><h3>5.1 · สรุปรายคน</h3><div class="cno">ไม่มี พจส. ในตารางกะของช่วงวันที่เลือก</div></div>`;

/* กล่องรายละเอียดของ พจส. หนึ่งคน — แยกเป็นบล็อกตามวันที่มีเที่ยวจริงในช่วงที่เลือก
   สองคอลัมน์เวลาที่ต้องแยกกันชัด (ยืนยันกับผู้ใช้ 2026-08-28):
   "เวลาวิ่ง" = ออก→ปิดงานของเที่ยวนั้นเที่ยวเดียว (workHours ตัวเดียวกับที่อื่นในระบบใช้)
   "นับจากรายงานตัว/เที่ยวก่อนหน้า" = ต่อเนื่องทีละเที่ยวจากเวลารายงานตัว/ปิดงานเที่ยวก่อน
   เที่ยวที่ยังไม่ปิดงาน (closed ว่าง) โชว์สถานะจริงผ่าน runStatus(j) แทนเวลา — ไม่แปะป้ายข้ามวันตามที่สั่ง */
function histDetailHTML(p){
  const days=(p.histDays||[]).filter(d=>d.trips.length>0);
  if(!days.length)return '<div class="cno" style="padding:12px 16px">ไม่มีเที่ยวงานในช่วงนี้</div>';
  return '<div style="padding:12px 16px 4px 40px">'+days.map(d=>{
    const body=d.trips.map(t=>{
      const rs=runStatus(t);
      const closedCell=t.closed?('<span class="mono">'+esc(t.closed)+'</span>')
        :('<span class="badge '+rs[1]+'">'+esc(rs[2])+'</span>');
      const runTxt=(t.run!==''&&t.run!=null)?(t.run+' ชม.'):'<span class="cno">-</span>';
      const segTxt=(t.seg!=null)?(t.seg+' ชม.'):'<span class="cno">-</span>';
      return `<tr>
        <td class="mono" style="text-align:center">${t.no}</td>
        <td>${jtBadge(t.type)} ${esc(t.product||'-')}</td>
        <td>${esc(t.origin||'(ไม่ระบุ)')} <span class="cno">→</span> ${esc(t.dest||'(ไม่ระบุ)')}</td>
        <td class="mono" style="text-align:center">${(t.distance||t.distance===0)?esc(String(t.distance)):'-'}</td>
        <td class="mono" style="text-align:center">${t.depart?esc(t.depart):'-'}</td>
        <td style="text-align:center">${closedCell}</td>
        <td style="text-align:center">${runTxt}</td>
        <td style="text-align:center">${segTxt}<div class="cno" style="font-size:10.5px">${esc(t.segFrom)} → ปิดงานนี้</div></td>
      </tr>`;
    }).join('');
    return `<div style="margin-bottom:14px">
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;margin-bottom:6px">
        <b class="mono">${esc(d.ds)}</b>
        <span class="cno">มารายงานตัว <b class="mono" style="color:var(--ink)">${d.arrive?esc(d.arrive):'-'}</b></span>
        <span class="cno">ปิดงานเที่ยวสุดท้าย <b class="mono" style="color:var(--ink)">${d.lastClose?esc(d.lastClose):'-'}</b></span>
        <span class="cno">รวมเวลาอยู่ปฏิบัติงาน <b class="mono" style="color:var(--ink)">${d.spanH!=null?(d.spanH+' ชม.'):'-'}</b></span>
      </div>
      <div class="tablewrap"><table style="min-width:720px">
        <thead><tr><th style="text-align:center">เที่ยว</th><th>สินค้า</th><th>เส้นทาง</th>
          <th style="text-align:center">กม.</th><th style="text-align:center">ออก</th>
          <th style="text-align:center">ปิดงาน</th><th style="text-align:center">เวลาวิ่ง</th>
          <th style="text-align:center">นับจากรายงานตัว/เที่ยวก่อนหน้า</th></tr></thead>
        <tbody>${body}</tbody></table></div></div>`;
  }).join('')+'</div>';
}
/* ---------- วาดหน้า ---------- */
function renderDash(){
  const restore=keepScroll();
  const A=dashAgg();
  const seg=(v,lab)=>`<button class="${(!dashCustom()&&dashDays===v)?'on':''}" data-dday="${v}">${lab}</button>`;
  /* ปุ่มกระโดดไป Section — แทนแท็บเดิม เลื่อนหน้าไปหาหัวข้อนั้น ไม่ได้วาดหน้าใหม่ */
  const jump=(k,lab)=>`<button data-djump="${k}">${lab}</button>`;
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const card=(k,v,s2,cls)=>`<div class="dcard ${cls||''}"><div class="k">${k}</div><div class="v">${v}</div>${s2?('<div class="s">'+s2+'</div>'):''}</div>`;

  /* 2026-08-17 · รวม 3 Section ไว้ในหน้าเดียว ไม่มีแท็บแล้ว
     แท็บ "ภาพรวม" ถูกถอดออกไปก่อนหน้านี้ (2026-08-14) และแท็บ "เส้นทาง" ถูกถอดออกรอบนี้
     กราฟสินค้า/เส้นทาง กับ ต้นทาง จึงไม่มีบนหน้านี้แล้ว (ข้อมูลยังถูกนับไว้ใน dashAgg สำหรับปุ่มคัดลอกสรุป) */
  const D=Math.max(1,A.haveDays);                       /* ตัวหารของค่าเฉลี่ยรายวัน */
  const avg1=v=>(v/D).toFixed(1);
  const secHead=(n,ttl,sub)=>`<div class="dsech" id="dsec${n}"><span class="dsecn">${n}</span>
    <h2>${ttl}</h2>${sub?`<span class="cno">${sub}</span>`:''}</div>`;
  const at=k=>(dashPickDay&&dashPickAt===k)?dPickPanel(A):'';

  /* ---------- Section 1 · ปริมาณงาน ----------
     2026-08-19 ผู้ใช้สั่งแยกเป็น 2 Section: ภาพสรุป "ปริมาณงาน" ขึ้นมาก่อน แล้วค่อย "พจส."
     ของเดิมเอาการ์ด พจส. ขึ้นก่อนแล้วมีกราฟปริมาณงานแทรกอยู่กลาง ทำให้อ่านสองเรื่องปนกัน
     คีย์ data-dwho ('s10','s11','s21','s31') คงเดิมโดยตั้งใจ — เป็นชื่อภายในที่กล่องรายละเอียดวันใช้อ้าง
     เปลี่ยนแค่เลขที่โชว์บนหัวข้อ */
  const sec1=`${secHead('1','ปริมาณงาน','ตัวเลขในการ์ดเป็นค่าเฉลี่ยต่อวัน จาก '+A.haveDays+' วันที่มีข้อมูล')}
    <div class="dgrid4">
      ${card('เที่ยวงานที่จ่าย',avg1(A.trips),'เที่ยว/วัน · รวม '+A.trips+' เที่ยว','hero')}
      ${card('ตามแผน',avg1(A.plan),'เที่ยว/วัน · ทำได้ '+pct(A.trips,A.plan)+'% ของแผน')}
      ${card('ปิดงานแล้ว',avg1(A.closed),'เที่ยว/วัน · '+pct(A.closed,A.trips)+'% ของที่จ่าย')}
      ${(function(){const BT=A.byType||{},PT=A.planByType||{};   /* กันพังถ้า A ไม่ครบ — หน้าทั้งหน้าไม่ควรดับ */
        return JOBTYPES.map(t=>card(t.s,avg1(BT[t.k]||0),'เที่ยว/วัน · รวม '+(BT[t.k]||0)
          +(PT[t.k]?(' · แผน '+PT[t.k]):''))).join('');})()}
    </div>
    <div class="dpanel" data-dwho="s10">
      <h3>1.1 · ปริมาณงานรายวัน <span class="cno">(1 วัน 1 แท่ง = งานที่จ่ายทั้งหมด · แยกสี งานใน BU4 / งานนอก BU · เทียบแผนของวันนั้น)</span></h3>
      ${dWorkStack(A.daily)}</div>
    ${at('s10')}`;

  /* ---------- Section 2 · พจส. ---------- */

      ${card('รอบต่อคน',(runP.length?(rndTot/runP.length).toFixed(1):'0'),'รอบ/คน ในช่วงนี้ ('+runP.length+' คนที่มีงาน)')}

    ${dPersonRank(A)}

      · วันหยุดของตัวเองไม่นับเป็นตัวหาร · 100% = เป็นทุกวันที่ต้องมาทำงาน · ตัวเล็ก = ครั้งดิบ / วันที่ต้องมา</div>
    <div class="dthree">
      ${dRatePanel(A,'พจส. ที่มาสายบ่อยสุด <span class="cno">(% ของวันที่ต้องมาทำงาน)</span>','latePd','late','#b8860b','ไม่มีคนมาสายในช่วงนี้')}
      ${dRatePanel(A,'พจส. ที่ลาบ่อยสุด <span class="cno">(% ของวันที่ต้องมาทำงาน)</span>','leavePd','leave',CH_LEAVE,'ไม่มีคนลาในช่วงนี้')}
      ${dRatePanel(A,'พจส. ที่ขาดงานบ่อยสุด <span class="cno">(% ของวันที่ต้องมาทำงาน)</span>','absPd','absent','#c0392b','ไม่มีคนขาดงานในช่วงนี้')}
    </div>`;

  /* ---------- Section 2 · เที่ยวรถ ---------- */
  const tk=Object.keys(A.truck).map(k=>[k,A.truck[k]]).sort((a,b)=>b[1]-a[1]);
  const low=tk.slice().reverse().slice(0,8);
  const sec2=`${secHead('3','เที่ยวรถ','นับตามเลขรถที่วิ่งจริง ตรงกับหน้า 4')}
    <div class="dgrid4">

      ${card('ครบ '+TARGET_ROUNDS+' รอบ',avg1(A.hitDaySum||0),'คัน/วัน · เคยทำครบ '+A.hitTrucks+' คัน')}

    <div class="dbar" style="padding:8px 12px">
      <!-- 2026-08-17 · ถอดแท็บทั้งหมดออก รวมเป็นหน้าเดียว · 2026-08-19 แยกปริมาณงานออกจาก พจส. เป็น 4 Section -->
      <span class="dseg">${jump('s1','1 · ปริมาณงาน')}${jump('s2','2 · พจส.')}${jump('s3','3 · เที่ยวรถ')}${jump('s4','4 · เวลา')}${jump('s5','5 · รายบุคคลย้อนหลัง')}</span>
      <span class="cno" style="margin-left:auto">ข้อมูลจากหน้า 4 · อัปเดต ${nowHM()} น.</span>
    </div>
    ${body}
  </div>`;
  restore();
  /* วัดของจริงแล้ววาดซ้ำรอบเดียว ให้เส้นฐานกราฟยาวเต็มพาเนลพอดี (ไม่วนซ้ำ) */
  if(!dashFillPass&&dashFillMeasure()){
    dashFillPass=true;
    try{ renderDash(); } finally { dashFillPass=false; }
  }
}

/* ---------- ช่องเลือกวันที่ของหน้า 6 ---------- */
document.getElementById('view').addEventListener('input',e=>{
  /* หมายเหตุประจำตัวรถ ตาราง 2.3 — เก็บที่ truckNotes ไม่แตะ day.dnote / day.truckNote
     ไม่วาดหน้าใหม่ระหว่างพิมพ์ ช่องจึงไม่เสียโฟกัส (แบบเดียวกับหน้า 1 และหน้า 5) */
  const zn=e.target.dataset?e.target.dataset.znote:undefined;
  if(zn!==undefined){
    const txt=e.target.value;
    truckNotes[String(zn)]=txt;
    saveTruckNotesSoon();
    /* อัปเดตช่องโชว์ในตารางซ้ายทันทีแบบไม่วาดหน้าใหม่ — ช่องที่กำลังพิมพ์จึงไม่เสียโฟกัส
       ลบข้อความหมดแล้วต้องกลับไปโชว์ป้ายสาเหตุที่ระบบเดาให้ ไม่ใช่ค้างเป็นช่องว่าง */
    const cell=document.querySelector('[data-znoteshow="'+String(zn).replace(/"/g,'\\"')+'"]');
    if(cell){
      const v=cell.querySelector('.znoteval'), a=cell.querySelector('.znoteauto');
      if(v){v.textContent=txt; v.style.display=txt?'':'none';}
      if(a)a.style.display=txt?'none':'';
    }
    return;
  }
});
document.getElementById('view').addEventListener('change',e=>{
  if(e.target.id==='dFrom'||e.target.id==='dTo'){
    const a=document.getElementById('dFrom'), b=document.getElementById('dTo');
    if(a&&b&&a.value&&b.value){dashFrom=a.value;dashTo=b.value;dashLoad();renderDash();}
    return;
  }
  /* ตัวบันทึก "หมายเหตุรถ 0 เที่ยว" ถูกถอดออก 2026-08-14 พร้อมกับตารางที่มันอยู่
     ข้อมูล day.truckNote ที่ CC เคยพิมพ์ไว้ยังอยู่ในระบบครบ ไม่ได้ถูกลบ แค่ไม่มีที่แสดง/แก้บนหน้าจอ */
});
/* ---------- ปุ่มต่าง ๆ ของหน้า 6 ---------- */
document.getElementById('view').addEventListener('click',e=>{
  const dd=e.target.closest('[data-dday]');
  if(dd){dashDays=+dd.dataset.dday;dashFrom='';dashTo='';dashLoad();renderDash();return;}
  if(e.target.closest('#dClear')){dashFrom='';dashTo='';dashLoad();renderDash();return;}
  if(e.target.closest('#dPickClear')){dashPickDay='';dashPickAt='';renderDash();return;}
  /* ปุ่มกระโดดไป Section (แทนแท็บเดิม) */
  const jp=e.target.closest('[data-djump]');
  if(jp){
    const el=document.getElementById('dsec'+jp.dataset.djump.slice(1));
    if(el)el.scrollIntoView({block:'start',behavior:'smooth'});
    return;
  }
  if(e.target.closest('#dPeopleAll')){dashAllPeople=!dashAllPeople;renderDash();return;}
  /* Section 5 · เปิด/ยุบรายละเอียดรายบุคคล — เปิดได้ทีละคน กดซ้ำที่คนเดิม = ปิด */
  const hp=e.target.closest('[data-hperson]');
  if(hp){dashHistOpen=(dashHistOpen===hp.dataset.hperson)?'':hp.dataset.hperson;renderDash();return;}
  if(e.target.closest('#dZeroClear')){dashZeroPick='';renderDash();return;}
  const zp=e.target.closest('[data-zpick]');
  if(zp){dashZeroPick=(dashZeroPick===zp.dataset.zpick)?'':zp.dataset.zpick;renderDash();return;}
  const dp=e.target.closest('[data-dd]');
  if(dp){
    /* กราฟรายคน (key ขึ้นต้นด้วย p:) ไม่ใช่การเลือกวัน ปล่อยผ่าน */
    if(/^p:/.test(String(dp.dataset.dd)))return;
    const who=e.target.closest('[data-dwho]');
    const at=who?who.dataset.dwho:'';
    /* กดวันเดิมซ้ำที่กราฟเดิม = ปิดกล่อง · แต่ถ้ากดวันเดิมจาก "กราฟอื่น" ให้ย้ายกล่องไปกราฟนั้น
       ไม่ใช่ปิดหาย (ไม่งั้น CC กดกราฟล่างแล้วกล่องหายไปเฉย ๆ) */
    const sameDay=(dashPickDay===dp.dataset.dd), sameChart=(dashPickAt===at);
    dashPickDay=(sameDay&&sameChart)?'':dp.dataset.dd;
    dashPickAt=dashPickDay?at:'';
    renderDash();
    /* ถ้ากล่องรายละเอียดอยู่นอกจอ ให้เลื่อนมาให้เห็นพอดี (ไม่กระโดดไปบนสุดของหน้า) */
    if(dashPickDay){const pp=document.querySelector('.dpickpanel');
      if(pp){const r=pp.getBoundingClientRect();
        if(r.top<70||r.bottom>window.innerHeight)pp.scrollIntoView({block:'center',behavior:'smooth'});}}
    return;
  }
  const dt=e.target.closest('[data-dtab]');
  if(dt){dashTab=dt.dataset.dtab;renderDash();return;}
  const df=e.target.closest('[data-dfleet]');
  if(df){dashFleetGroup=df.dataset.dfleet;renderDash();return;}
  if(e.target.closest('#dRefresh')){dashLoad(true);return;}
  if(e.target.closest('#dPrint')){window.print();return;}
  if(e.target.closest('#dCopy')){
    const txt=dashText(dashAgg());
    try{
      navigator.clipboard.writeText(txt).then(()=>alert('คัดลอกสรุปแล้ว วางใน LINE / PowerPoint / Word ได้เลย'),
        ()=>alert(txt));
    }catch(err){alert(txt);}
    return;
  }
});

/* init */
/* ---- passcode gate (deterrent) ---- */
const GATE_HASH='1374cd4e';
function gateHash(s){s=(s||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h.toString(16);}
function unlockGate(){document.getElementById('gate').style.display='none';boot();}
function tryGate(){
  const v=document.getElementById('gate_code').value||'';
  if(gateHash(v)===GATE_HASH){if(document.getElementById('gate_remember').checked)lsSet('fleet:unlocked',GATE_HASH);unlockGate();}
  else{document.getElementById('gate_err').textContent='รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง';}
}
document.getElementById('gate_go').addEventListener('click',tryGate);
document.getElementById('gate_code').addEventListener('keydown',e=>{if(e.key==='Enter')tryGate();});
if(lsGet('fleet:unlocked')===GATE_HASH){unlockGate();}
else{setTimeout(()=>{const i=document.getElementById('gate_code');if(i)i.focus();},80);}

async function boot(){
  try{ await boot_(); }catch(err){ showFatal('เริ่มระบบ',err); }
}
async function boot_(){
  document.getElementById('dateInput').value=curDate;
  adminName=lsGet('fleet:admin')||'';
  try{const o=JSON.parse(lsGet('fleet:sumprod')||'null');if(o&&typeof o==='object')sumProdOpen=o;}catch(e){}
  /* URL ที่ตั้งเองผ่าน ⚙ ชนะ (มี flag manual) · ค่าค้างเก่าที่ไม่ได้ตั้งใจ ใช้ค่าในไฟล์แทน */
  const man=lsGet('fleet:backend:manual')==='1'?(lsGet('fleet:backend')||''):'';
  backendURL=man||BACKEND_URL_DEFAULT||'';
  if(!man&&lsGet('fleet:backend')&&lsGet('fleet:backend')!==BACKEND_URL_DEFAULT)lsSet('fleet:backend',BACKEND_URL_DEFAULT);
  await withBusy('กำลังโหลดข้อมูล…',async()=>{await loadConfig();await loadRoutes();await loadOmsCfg();await loadTruckNotes();await loadDay();});
  document.getElementById('fleetcount').textContent=Array.isArray(config)?config.length:'?';
  updateAdminChip();
  render();flag('ok');startPoll();startAlarms();startOmsWork();fitTabs();
  if(tab==='roster')scrollToCurrentHour();
  if(!adminName||!backendURL)openLogin();
}
</script>
