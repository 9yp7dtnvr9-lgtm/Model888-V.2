<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>ศูนย์กำกับงานขนส่ง EV — BU4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --nav:#0f2138;--nav2:#1a3050;--line:#e2e7ee;--surface:#f3f6f9;--card:#fff;--ink:#152238;--muted:#65728a;
    --m:#d99a1e;--m-bg:#fbf3da;--a:#2f8f6b;--a-bg:#e6f3ec;--n:#3a4f86;--n-bg:#e8ebf5;
    --present:#1f9d55;--present-bg:#e5f4ea;--absent:#d6483f;--absent-bg:#fbe9e7;--leave:#8b93a4;--leave-bg:#eef0f4;--off:#a6791f;--off-bg:#f6efdc;--ot:#e0a417;--ot-bg:#fbf1d6;
    --go:#1f9d55;--stop:#c9ccd4;--accent:#1f9d55;--accent2:#f6c445;--radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",system-ui,sans-serif;background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased}
  .mono{font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-variant-numeric:tabular-nums}
  h1,h2,h3,.display{font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif}
  header{background:var(--nav);color:#fff;padding:13px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px rgba(246,196,69,.25);flex:none}
  .brand h1{font-size:18px;font-weight:600;margin:0;line-height:1.1}
  .brand small{display:block;color:#9fb0c6;font-size:12px;margin-top:2px}
  .topspace{flex:1}
  .datebox{display:flex;align-items:center;gap:8px;background:var(--nav2);padding:7px 12px;border-radius:10px}
  .datebox label{font-size:12px;color:#9fb0c6}
  .datebox input{border:0;background:transparent;color:#fff;font-family:inherit;font-size:14px}
  .datebox input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7;cursor:pointer}
  .saveflag{font-size:12px;color:#7fd6a8;min-width:92px;text-align:right}
  .saveflag.saving{color:#f0c66b}
  .adminchip{display:flex;align-items:center;gap:8px;background:var(--nav2);padding:6px 12px;border-radius:10px;font-size:13px;color:#dfe7f1}
  .adminchip .linkish{background:none;border:0;color:var(--accent2);cursor:pointer;font-family:inherit;font-size:12px;text-decoration:underline}
  .adminchip .loginbtn{background:var(--accent2);color:#20130a;border:0;border-radius:8px;padding:5px 12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  nav.tabs{background:var(--nav2);display:flex;gap:2px;padding:0 12px;overflow-x:auto;position:sticky;top:var(--hh,56px);z-index:39;box-shadow:0 2px 8px rgba(15,33,56,.18)}
  nav.tabs button{background:transparent;border:0;color:#93a4bc;font-family:inherit;font-size:14px;padding:12px 15px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
  nav.tabs button .num{font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-size:12px;background:rgba(255,255,255,.08);padding:1px 7px;border-radius:20px}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--accent2)}
  main{padding:18px;max-width:1500px;margin:0 auto}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;position:relative;overflow:hidden}
  .stat .lab{font-size:12px;color:var(--muted);margin-bottom:4px}
  .stat .val{font-size:25px;font-weight:600;line-height:1}
  .stat .val small{font-size:14px;color:var(--muted);font-weight:400}
  .stat.hero{background:var(--nav);color:#fff;border-color:var(--nav)}
  .stat.hero .lab{color:#9fb0c6}
  .stat .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent2)}
  .stat.go .val{color:var(--present)}.stat.miss .val{color:var(--absent)}.stat.lv .val{color:var(--leave)}.stat.gap .val{color:var(--accent)}.stat.ot .val{color:var(--ot)}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
  .toolbar input[type=search]{flex:1;min-width:170px;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-family:inherit;font-size:14px;background:var(--card)}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 13px;font-family:inherit;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
  .btn:hover{border-color:#bcc4d2}
  .btn.solid{background:var(--nav);color:#fff;border-color:var(--nav)}
  .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary{background:var(--go);color:#fff;border-color:var(--go)}
  .pill{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .pill.active{background:var(--nav);color:#fff;border-color:var(--nav)}
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
  .tablewrap.scroll{max-height:calc(100vh - 320px)}
  .tablewrap.sbox{max-height:340px;overflow:auto}
  .tablewrap.sbox5{max-height:206px;overflow:auto}
  .tablewrap.sbox10{max-height:472px;overflow:auto}
  .tablewrap.sbox10{max-height:472px;overflow:auto}
  tr.aheadrow{background:#fbf3da}
  tr.nowrow{background:#e6f3ec}
  .cardhead{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .cardhead h2{margin:0;flex:1}
  .btn.mini{padding:5px 11px;font-size:13px}
  .roundsum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .rchip{font-size:12.5px;background:#f3f6f9;border:1px solid var(--line);border-radius:20px;padding:5px 12px;color:var(--muted)}
  .rchip b{font-size:15px;color:var(--ink);margin:0 2px}
  .rchip.ok{background:var(--present-bg);border-color:#b8e0c6;color:var(--present)}
  .rchip.ok b{color:var(--present)}
  .rchip.warn{background:var(--m-bg);border-color:#e6cf94;color:var(--off)}
  .rchip.warn b{color:var(--off)}
  .rchip.bad{background:var(--absent-bg);border-color:#f0c2bd;color:var(--absent)}
  .rchip.bad b{color:var(--absent)}
  .rsep{width:1px;height:20px;background:var(--line)}
  th.th-sort{cursor:pointer;user-select:none;white-space:nowrap}
  th.th-sort:hover{background:#eef2f7;color:var(--ink)}
  th.th-sort.on{color:var(--ink)}
  .sortcaret{font-size:9px;margin-left:4px;opacity:.45}
  th.th-sort.on .sortcaret{opacity:1;color:var(--accent)}
  .tablewrap.sbox thead th{box-shadow:0 1px 0 var(--line)}
  .grouphdr td{position:sticky;background:var(--n-bg);color:var(--n);font-weight:600;font-size:12.5px;padding:6px 12px;border-bottom:1px solid var(--line);top:39px;z-index:1}
  .otbtn{border:1px solid var(--ot);background:var(--ot-bg);color:var(--ot);border-radius:7px;padding:3px 9px;font-size:12px;cursor:pointer;font-family:inherit;margin-top:5px}
  .otyes{font-size:11px;color:var(--ot);background:var(--ot-bg);border:1px solid #e6cf94;border-radius:6px;padding:2px 7px;display:inline-block;margin-right:5px}
  .edrow td{padding:7px 10px}
  .edrow input,.edrow select{border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-family:inherit;font-size:13px;background:#fff}
  .edtruck{background:#f7f9fc}
  .edtruck td{font-weight:600;border-top:2px solid var(--line)}
  .miniadd{border:1px dashed #b7c0cf;background:#fff;border-radius:7px;padding:4px 10px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--accent)}
  .arrivein{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-size:13px;background:#fff}
  .arrivein:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
  .planlink{border:1px solid var(--accent);background:var(--present-bg);color:var(--accent);border-radius:8px;padding:6px 11px;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500}
  .planlink:hover{background:var(--accent);color:#fff}
  .planlink.done{border-color:var(--line);background:#f1f4f8;color:var(--muted);font-weight:400;cursor:default}
  .planlink.done:hover{background:#f1f4f8;color:var(--muted);border-color:var(--line)}
  .actualin{border:1px solid var(--accent2);border-radius:7px;padding:4px 7px;font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-size:12px;background:#fffdf3;width:92px}
  .omsbtn{border:0;background:transparent;cursor:pointer;padding:2px;font-family:inherit}
  .omsbtn:hover{opacity:.75}
  .jsel{border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-family:inherit;font-size:12.5px;background:#fff;max-width:168px}
  .jsel:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
  .jsel:hover{border-color:#bcc4d2}
  .noteinp{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-family:inherit;font-size:12px;background:#fff;width:150px}
  .noteinp:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
  .departin{border:1px solid var(--accent2);border-radius:7px;padding:4px 6px;font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-size:12px;background:#fffdf3}
  .departin:focus{outline:2px solid var(--accent2)}
  tr.jrow{cursor:pointer}
  tr.jrow:hover{background:#eef4fb!important}
  .dgrid{display:grid;grid-template-columns:132px 1fr;gap:7px 14px;font-size:13.5px;align-items:baseline}
  .dgrid .lb{color:var(--muted);font-size:12.5px}
  .dsec{margin:14px 0 6px;font-size:12.5px;font-weight:600;color:var(--n);border-bottom:1px solid var(--line);padding-bottom:5px}
  .dbig{font-size:16px;font-weight:600}
  .woin{min-width:130px;min-height:34px;resize:both;overflow:auto;font-size:12.5px;line-height:1.5}
  .tag.tseq{background:#eef4fb;color:#2b6cb0;border-color:#c9dcf0;font-weight:600}
  .rin{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-family:inherit;font-size:13px;background:#fff}
  .rin:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
  /* ---------- Dashboard (หน้า 6) ---------- */
  .dwrap{display:flex;flex-direction:column;gap:14px}
  .dbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .dseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .dseg button{border:0;background:#fff;padding:7px 13px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--ink);border-right:1px solid var(--line)}
  .dseg button:last-child{border-right:0}
  .dseg button.on{background:var(--nav);color:#fff;font-weight:600}
  .dgrid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .dcard .k{font-size:12px;color:var(--muted);letter-spacing:.2px}
  .dcard .v{font-size:26px;font-weight:700;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
  .dcard .s{font-size:12px;color:var(--muted);margin-top:3px}
  .dcard.hero{background:linear-gradient(135deg,var(--nav),#20406b);border-color:var(--nav)}
  .dcard.hero .k,.dcard.hero .s{color:#c9d7ea}
  .dcard.hero .v{color:#fff}
  .dpanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .dpanel h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .dpanel h3 .cno{font-weight:400}
  .drow{display:grid;grid-template-columns:1fr 62px;gap:8px;align-items:center;padding:5px 0;font-size:13px}
  .dbar2{height:9px;border-radius:6px;background:#eef1f6;overflow:hidden}
  .dbar2 i{display:block;height:100%;border-radius:6px;background:var(--accent)}
  .dnum{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
  .dtwo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .dsvg{width:100%;height:auto;display:block}
  .dpt{cursor:pointer}
  .dpt rect{pointer-events:all}
  .dpt:hover circle{r:5.5}
  .drow[title]{cursor:help}
  .rchip.outbox{cursor:pointer;background:#eef4fb;color:#1f5fa8;border-color:#bcd6f2;font-weight:600}
  .rchip.outbox:hover{background:#dfeaf7}
  .tag.m1212{background:#eaf3ff;color:#1f5fa8;border-color:#bcd6f2;font-weight:600}
  .dpick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:4px 9px;font-size:12.5px;background:#fff}
  .dpick.on{border-color:var(--accent);background:var(--present-bg)}
  .dpick input[type=date]{border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-family:inherit;font-size:12.5px}
  .dchip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);background:#fff}
  .dload{height:4px;border-radius:4px;background:#e8edf4;overflow:hidden}
  .dload i{display:block;height:100%;background:var(--accent);transition:width .25s}
  @media(max-width:820px){.dtwo{grid-template-columns:1fr}}
  @media print{
    header,nav.tabs,footer,.dbar{display:none!important}
    .dcard,.dpanel{break-inside:avoid;border-color:#bbb}
    body{background:#fff}
  }
  .planin{width:74px;text-align:center;border:1px solid var(--accent2);border-radius:7px;padding:5px 6px;font-family:inherit;font-size:13px;background:#fffdf3;font-variant-numeric:tabular-nums}
  .planin:focus{outline:2px solid var(--accent2)}
  .hmin{width:66px;text-align:center;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .hmin::placeholder{color:#b9c1cd;letter-spacing:0}
  .actualin:focus{outline:2px solid var(--accent2)}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,33,56,.55);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 16px;overflow:auto}
  .modal-card{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:12px}
  .modal-head h2{margin:0;font-size:17px}
  .modal-x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
  .modal-actions{margin-top:18px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding-top:14px}
  .field input[readonly]{background:#f4f6f9;color:var(--muted)}
  #gate{position:fixed;inset:0;z-index:300;background:linear-gradient(135deg,#0f2138,#193353);display:flex;align-items:center;justify-content:center;padding:20px}
  .gate-card{background:#fff;border-radius:18px;max-width:380px;width:100%;padding:34px 28px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4)}
  .gate-logo{font-size:40px;margin-bottom:6px}
  .gate-card h2{margin:0 0 6px;font-size:18px;color:var(--nav)}
  .gate-card p{margin:0 0 18px;font-size:13.5px;color:var(--muted)}
  .gate-card input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:16px;text-align:center;letter-spacing:2px}
  .gate-card input[type=password]:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
  .gate-remember{display:flex;align-items:center;gap:7px;justify-content:center;font-size:12.5px;color:var(--muted);margin:12px 0}
  .gate-err{color:var(--absent);font-size:13px;min-height:18px;margin-bottom:8px}
  #gate .btn.primary{width:100%;padding:12px;font-size:15px}
  table{border-collapse:collapse;width:100%;min-width:900px;font-size:12.5px}
  thead th{position:sticky;top:0;background:#fbfcfe;z-index:2;text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);padding:9px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th.m{color:var(--m)}thead th.a{color:var(--a)}thead th.n{color:var(--n)}
  tbody td{padding:7px 9px;border-bottom:1px solid #eef1f5;vertical-align:middle;font-size:12.5px}
  tbody tr:hover{background:#fafbfe}
  tbody tr.stopped{opacity:.55}
  td.truck{white-space:nowrap}
  .plate{font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-weight:600;font-size:13px}
  .cno{font-size:11px;color:var(--muted)}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;background:#eef1f5;color:var(--muted);margin-left:4px}
  td.m{background:var(--m-bg)}td.a{background:var(--a-bg)}td.n{background:var(--n-bg)}
  .drv{font-size:12.5px;line-height:1.25}
  .drv .tm{font-size:11px;color:var(--muted);font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif}
  .drv.empty{color:var(--accent);font-style:italic}
  .stbtns{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
  .st{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 8px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--muted)}
  .st:hover{border-color:#aeb7c5}
  .st.present.sel{background:var(--present-bg);color:var(--present);border-color:var(--present)}
  .st.absent.sel{background:var(--absent-bg);color:var(--absent);border-color:var(--absent)}
  .st.leave.sel{background:var(--leave-bg);color:var(--leave);border-color:var(--leave)}
  .st.late.sel{background:#fdf0d5;color:#b57608;border-color:#e0a417}
  /* ---- ปุ่มไอคอนแจ้งเตือนบนหัวเว็บ ---- */
  .hicon{position:relative;border:0;border-radius:10px;padding:7px 11px;font-size:17px;cursor:pointer;line-height:1;font-family:inherit}
  .hicon.alarm{background:var(--accent2);color:#20130a}
  .hicon.alert{background:var(--absent);color:#fff}
  .hicon:disabled{opacity:.35;cursor:default}
  .hbadge{position:absolute;top:-5px;right:-5px;background:var(--nav);color:#fff;border-radius:20px;font-size:10.5px;font-weight:600;padding:1px 5px;min-width:16px}
  .hicon.alarm .hbadge{background:#20130a}
  @keyframes hpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .hicon.ring{animation:hpulse 1s ease-in-out infinite}
  /* ---- วิดเจท Alarm (กลางจอ) ---- */
  #alarmBox{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;width:min(94vw,470px);
    background:#fff;border:3px solid var(--m);border-radius:14px;box-shadow:0 18px 50px rgba(15,33,56,.32);display:none;overflow:hidden}
  #alarmBox .wtop{background:var(--m-bg);border-bottom:1px solid #e6cf94;padding:12px 16px;display:flex;align-items:center;gap:10px}
  #alarmBox .wtop .ttl{font-size:17px;font-weight:600;color:#8a5d05;flex:1}
  /* ---- วิดเจท Alert (มุมขวาบน) ---- */
  #alertBox{position:fixed;top:112px;right:16px;z-index:201;width:min(94vw,400px);
    background:rgba(214,72,63,.93);border:3px solid #8f2b24;border-radius:14px;box-shadow:0 14px 40px rgba(120,20,15,.4);display:none;overflow:hidden;color:#fff}
  #alertBox .wtop{background:rgba(0,0,0,.18);padding:11px 15px;display:flex;align-items:center;gap:9px}
  #alertBox .wtop .ttl{font-size:16px;font-weight:600;flex:1}
  #alertBox .wrow{border-bottom:1px solid rgba(255,255,255,.22)}
  #alertBox .wrow .nm{color:#fff}
  #alertBox .wsub,#alertBox .wfoot{color:rgba(255,255,255,.85)}
  #alertBox a.tel{color:#fff;text-decoration:underline}
  .wlist{max-height:46vh;overflow:auto}
  .wrow{padding:9px 15px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .wrow:last-child{border-bottom:0}
  .wrow .nm{font-size:14px;font-weight:600;flex:1;min-width:0}
  .wrow .wsub{font-size:11.5px;color:var(--muted);display:block;font-weight:400;margin-top:2px}
  .wrow .tm{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  a.tel{color:var(--n);text-decoration:none;font-variant-numeric:tabular-nums}
  a.tel:hover{text-decoration:underline}
  .wfoot{padding:10px 15px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .wdel{padding:0 2px;font-size:15px;line-height:1;opacity:.55}
  .wdel:hover{opacity:1}
  #alertBox .wdel{color:#fff}
  .wclose{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 16px;font-family:inherit;font-size:13.5px;cursor:pointer;font-weight:500}
  #alertBox .wclose{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:#fff}
  .offbadge{font-size:11px;color:var(--off);background:var(--off-bg);border:1px solid #e6cdb4;border-radius:6px;padding:2px 7px;display:inline-block;margin-top:5px}
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .track{width:46px;height:26px;border-radius:20px;background:var(--stop);position:relative;transition:background .15s}
  .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch.on .track{background:var(--go)}
  .switch.on .track::after{left:23px}
  .switch .txt{font-size:12.5px;font-weight:500;color:var(--muted);width:50px}
  .switch.on .txt{color:var(--go)}
  /* forms */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .card h2{font-size:16px;margin:0 0 14px}
  .formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:14px;background:#fff}
  .formactions{margin-top:14px;display:flex;gap:9px;align-items:center}
  /* board */
  .stampcell{text-align:center}
  .stampcell .lab{font-size:11px;color:var(--muted);margin-bottom:3px}
  .stampcell input{width:78px;border:1px solid var(--line);border-radius:7px;padding:4px;font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-size:13px;text-align:center}
  .stampcell button{margin-top:3px;font-size:10.5px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 6px;cursor:pointer;font-family:inherit;color:var(--muted)}
  .badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .b-wait{background:#eef0f4;color:#69748a}.b-run{background:var(--m-bg);color:var(--off)}.b-charge{background:var(--n-bg);color:var(--n)}.b-done{background:var(--present-bg);color:var(--present)}
  .b-charged{background:var(--a-bg);color:var(--a)}
  .boardbox{cursor:pointer;transition:outline .1s,transform .1s}
  .boardbox:hover{transform:translateY(-1px)}
  .boardbox.sel{outline:2px solid var(--accent2);outline-offset:1px}
  .boardbox.go .val{color:var(--off)}.boardbox.chg .val{color:var(--n)}.boardbox.chd .val{color:var(--a)}.boardbox.dn .val{color:var(--present)}
  .jtype{font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line)}
  .jtype.main{background:#eaf3fb;color:#2f6f96;border-color:#cfe3f2}
  .jtype.vt{background:#f4ecfb;color:#7b5599;border-color:#e4d3f2}
  .jtype.oth_l{background:#e9f6f1;color:#2f8f6b;border-color:#c6e6da}
  .jtype.oth_s{background:#fdf0d5;color:#b57608;border-color:#e9d29a}
  .empty-note{padding:34px;text-align:center;color:var(--muted)}
  .del{border:0;background:none;color:var(--absent);cursor:pointer;font-size:16px}
  .hint{background:#eef4fb;border:1px solid #d4e5f5;border-radius:10px;padding:12px 14px;font-size:13px;color:#33566f;margin-bottom:14px}
  footer{padding:14px 20px;color:var(--muted);font-size:12px;text-align:center}
  @media(max-width:720px){.brand h1{font-size:16px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{header,nav.tabs,.toolbar,footer,.switch .txt,.stampcell button,.del{display:none!important}.st:not(.sel){display:none}.tablewrap{border:0}table{min-width:0;font-size:11px}.track{display:none}}
</style>
</head>

function isModel1212(j){
  if(!j)return false;
  if(String(j.product||'').indexOf('รับตรง')<0)return false;
  const o=String(j.origin||'');
  if(o.indexOf('วรวัฒน์')>=0||o.indexOf('ธัญญผล')>=0)return false;
  return true;
}

    ||routes.find(x=>(x.product||'').trim()===p);

}

function jtByDistance(cur,km){

function seedRoutes(){
  return ROUTEDATA.map(r=>{
    const def=PROD_DEFAULT[r.product]||[];
    const o=(r.origin&&r.origin.trim())||def[0]||'';
    const d=(r.dest&&r.dest.trim())||def[1]||'';
    let km=r.distance||matchDistanceRule(o,d)||'';
    return {id:ruid(),product:r.product||'',origin:o,dest:d,distance:String(km||''),
            type:(km&&+km<=100)?'vt':(r.type||'main')};
  });
}

}
function uniqField(f){
  const out=[];
  routes.forEach(r=>{const v=(r[f]||'').trim();if(v&&out.indexOf(v)<0)out.push(v);});
  return out.sort((a,b)=>a.localeCompare(b,'th'));
}

/* ระยะทาง: ดูจากทะเบียนก่อน ถ้าไม่มีค่อยใช้กฎเดิม */
function matchDistance(o,d){
  o=(o||'').trim();d=(d||'').trim();
  const hit=routes.find(r=>(r.origin||'').trim()===o&&(r.dest||'').trim()===d&&r.distance);
  if(hit)return +hit.distance;
  const one=routes.find(r=>(r.origin||'').trim()===o&&r.distance);
  if(one&&!d)return +one.distance;
  return matchDistanceRule(o,d);
}
/* กฎสำรอง (ใช้เมื่อยังไม่มีในทะเบียน) */
function matchDistanceRule(o,d){
  o=o||'';d=d||'';const H=(s,k)=>s.indexOf(k)>=0;
  const plant=H(d,'โรงไฟฟ้า'),jc=H(d,'JC'),ev=H(d,'EV');
  if(H(o,'วังจันทร์')&&plant)return 140;
  if((H(o,'นครหลวง')||H(o,'โชคชัย'))&&plant)return 135;
  if(H(o,'ปักธงชัย')&&plant)return 135;
  if(H(o,'บางปะกง')&&plant)return 110;
  if(jc)return 135;
  if(H(o,'วัฒนานคร')&&ev)return 135;
  if(H(o,'ศาลาลำดวน'))return 60;
  if(H(o,'ปางสีดา'))return 70;
  return '';
}

/* ============ ระบบบันทึกแบบส่งเฉพาะช่องที่แก้ (patch ops) ============
   เดิมส่งข้อมูลทั้งวันขึ้นไปทับ -> ค่าที่ CC คนอื่นเพิ่งแก้ถูกค่าเก่าในเครื่องเราทับ

   -> คนละช่อง/คนละคัน/คนละงาน บันทึกพร้อมกันได้ ไม่มีใครหาย            */
let pendingOps=[];

const FLAT_SEC={plan:1,running:1};

/* นำ op ไปใช้กับข้อมูลในเครื่อง (ตรรกะเดียวกับฝั่งเซิร์ฟเวอร์) */
function applyOpLocal(doc,op){
  if(!doc||!op||!op.k)return;
  if(op.k==='cell'&&CELL_SEC[op.s]){
    doc[op.s]=doc[op.s]||{};doc[op.s][op.t]=doc[op.s][op.t]||{};doc[op.s][op.t][op.p]=op.v;
  }else if(op.k==='flat'&&FLAT_SEC[op.s]){
    doc[op.s]=doc[op.s]||{};doc[op.s][op.key]=op.v;
  }else if(op.k==='jobset'){
    const j=(doc.jobs||[]).find(x=>String(x.id)===String(op.id));if(j)j[op.f]=op.v;
  }else if(op.k==='jobadd'){
    doc.jobs=doc.jobs||[];
    if(!doc.jobs.some(x=>String(x.id)===String(op.job.id)))doc.jobs.push(JSON.parse(JSON.stringify(op.job)));
  }else if(op.k==='jobdel'){
    doc.deleted=doc.deleted||[];
    if(doc.deleted.indexOf(String(op.id))<0)doc.deleted.push(String(op.id));
    doc.jobs=(doc.jobs||[]).filter(x=>String(x.id)!==String(op.id));
  }else if(op.k==='seq'){doc.seq=Math.max(Number(doc.seq)||0,Number(op.v)||0);}
}

const DAY_ALIAS=(function(){
  const m={};
  [[0,['อาทิตย์','อาทิต','อา','อาทิตย','sun','sunday','su']],
   [1,['จันทร์','จันทร','จ','mon','monday','mo']],

   [5,['ศุกร์','ศุกร','ศ','fri','friday','fr']],
   [6,['เสาร์','เสาร','ส','sat','saturday','sa']]
  ].forEach(([i,ws])=>ws.forEach(w=>{m[w]=i;}));
  return m;
})();
function normDayStr(v){

}
function dayIdx(v){

}

/* ---- เวลาแบบ 24 ชม. ไม่ขึ้นกับภาษาของเบราว์เซอร์ ----
   รับได้ทั้ง 630 / 0630 / 6:30 / 18:5  ->  คืน "06:30" / "18:05"
   คืน ''   = ช่องว่าง        คืน null = รูปแบบไม่ถูกต้อง            */
const LATE_GRACE=10;   /* มาช้ากว่าเวลาเข้ากะเกินกี่นาที ถือว่า "สาย" (ตรงกับเกณฑ์ Alert) */
function isLateArrival(d,arriveHM){
  const sm=parseStart(shiftOf(d,curDate)), am=hm2min(arriveHM);
  if(sm===null||am===null)return false;
  let diff=am-sm;
  if(diff>720)diff-=1440;          /* กะข้ามเที่ยงคืน */
  if(diff<-720)diff+=1440;
  return diff>LATE_GRACE;
}
function normHM(v){
  v=String(v==null?'':v).trim();
  if(!v)return '';
  let d=v.replace(/[^0-9]/g,'');
  if(v.indexOf(':')>0){
    const p=v.split(':');
    d=String(p[0]).replace(/\D/g,'').padStart(2,'0')+String(p[1]||'0').replace(/\D/g,'').padStart(2,'0');
  }else if(d.length===1)d='0'+d+'00';
  else if(d.length===2)d=d+'00';
  else if(d.length===3)d='0'+d;
  if(d.length!==4)return null;
  const h=+d.slice(0,2),m=+d.slice(2);
  if(isNaN(h)||isNaN(m)||h>23||m>59)return null;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

const tsort={};
function thS(tbl,k,lab,al){
  const st=tsort[tbl]||{},on=st.key===k;
  return `<th class="th-sort${on?' on':''}" data-ts="${tbl}" data-tsk="${k}"${al?` style="text-align:${al}"`:''}>${lab}<span class="sortcaret">${on?(st.dir>0?'▲':'▼'):'⇅'}</span></th>`;
}
function sortBy(tbl,arr,getters){
  const st=tsort[tbl];
  if(!st||!st.key||!getters[st.key])return arr;
  const g=getters[st.key],d=st.dir;
  return arr.slice().sort((a,b)=>{
    const x=g(a),y=g(b);
    const nx=(typeof x==='number'),ny=(typeof y==='number');
    if(nx||ny)return (((nx?x:0)||0)-((ny?y:0)||0))*d;
    return String(x==null?'':x).localeCompare(String(y==null?'':y),'th')*d;
  });
}
function sortActive(tbl){const st=tsort[tbl];return !!(st&&st.key);}

/* ---------- KPIs ---------- */
function kpis(){
  let running=0,present=0,absent=0,leave=0,off=0,ot=0,late=0,unchecked=0,total=0;
  for(const t of config){
    if(isRunning(t.truckNo))running++;
    const a=attOf(t.truckNo);
    for(const d of (t.drivers||[])){
      total++;
      const v=a[d.pos];
      if(isOff(t,d,curDate)){ off++; if(v==='ot')ot++; continue; }   // วันหยุด fix ตามตารางกะ ไม่หัก OT
      if(v==='present')present++;else if(v==='late')late++;else if(v==='absent')absent++;else if(v==='leave')leave++;else if(v==='ot')ot++;else unchecked++;
    }
  }
  const scheduled=total-off;      // ต้องมาทำงานวันนี้ (ตามตารางกะ)
  const actual=present+late+ot;   // มาทำงานจริงทั้งหมด (รวมสาย + OT)
  return {running,present,absent,leave,off,ot,late,unchecked,total,scheduled,actual};
}

function parseStart(shift){if(!shift)return null;const m=String(shift).match(/(\d{1,2}):(\d{2})/);if(!m)return null;return ((+m[1])%24)*60+(+m[2]);}
/* ---- เวลากะที่ใช้จริงของ พจส. ในวันหนึ่ง ----
   ไฟล์ตารางกะมี 2 ชุดเวลา + วันที่ให้เปลี่ยนของแต่ละคัน (รอให้ถึงรอบวันหยุดก่อน)
   ถ้าวันที่ดู >= วันเปลี่ยน -> ใช้เวลาชุดใหม่ ไม่งั้นใช้ชุดเดิม            */
function shiftOf(d,ds){
  if(!d)return '';
  ds=ds||curDate;
  if(d.shift2&&d.shiftFrom&&String(ds)>=String(d.shiftFrom))return d.shift2;
  return d.shift||'';
}

function shiftPending(d,ds){
  ds=ds||curDate;
  return !!(d&&d.shift2&&d.shiftFrom&&String(ds)<String(d.shiftFrom)&&d.shift2!==d.shift);
}
/* แปลงค่าวันที่จาก Excel: รับได้ทั้งเลข serial, "19 Jul 26", "19/07/2026", "2026-07-19" */
const MON3={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function xlDate(v){
  if(v===null||v===undefined||v==='')return '';
  if(typeof v==='number'&&isFinite(v)&&v>20000){
    const d=new Date(Date.UTC(1899,11,30)+v*86400000);
    return d.toISOString().slice(0,10);
  }
  const t=String(v).trim();
  let m=t.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=t.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{2,4})/);
  if(m){const mo=MON3[m[2].toLowerCase()];let y=+m[3];if(y<100)y+=2000;
    if(mo)return y+'-'+String(mo).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');}
  m=t.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;if(y>2400)y-=543;
    return y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');}
  const dt=new Date(t);
  return isNaN(dt.getTime())?'':dt.toISOString().slice(0,10);
}
function parseEnd(shift){
  if(!shift)return null;
  const m=String(shift).match(/(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/);
  if(!m)return null;
  return ((+m[3])%24)*60+(+m[4]);
}
function shiftDuration(shift){
  const a=parseStart(shift), b=parseEnd(shift);
  if(a===null||b===null)return null;
  let dur=b-a; if(dur<=0)dur+=1440;      /* กะข้ามเที่ยงคืน */
  return dur;
}
function startLabel(shift){if(!shift)return '-';const m=String(shift).match(/(\d{1,2}:\d{2})/);return m?m[1]:'-';}
function shiftCls(pos){return pos==='1'?'m':pos==='2'?'a':'n';}

function rollCallTable(){
  let list=[];
  for(const t of config)for(const d of (t.drivers||[]))list.push({t,d,startMin:parseStart(shiftOf(d,curDate))});
  list=list.filter(r=>{
    const off=isOff(r.t,r.d,curDate);
    if(filter==='work'&&off)return false;
    if(filter==='off'&&!off)return false;
    if(filter==='incomplete'){const cur=attOf(r.t.truckNo)[r.d.pos]||'';if(off||cur)return false;}
    if(STATUS_FILTERS[filter]){const cur=attOf(r.t.truckNo)[r.d.pos]||'';if(cur!==filter)return false;}
    if(search){const q=search.toLowerCase();if(!((r.t.truckNo+' '+r.t.routeGroup+' '+r.d.name).toLowerCase().includes(q)))return false;}
    return true;
  });
  list.sort((a,b)=>{const x=a.startMin==null?99999:a.startMin,y=b.startMin==null?99999:b.startMin;return x-y||a.t.truckNo.localeCompare(b.t.truckNo);});
  let body='';
  if(sortActive('roster')){
    const ST={present:'1 มา',late:'2 สาย',ot:'3 OT',absent:'4 ขาด',leave:'5 ลา','':'9 ยังไม่เช็ก'};
    const sorted=sortBy('roster',list,{
      start:r=>r.startMin==null?99999:r.startMin,
      truck:r=>r.t.truckNo+' '+(r.t.routeGroup||''),
      pos:r=>+r.d.pos||0,
      name:r=>r.d.name||'',
      status:r=>ST[attOf(r.t.truckNo)[r.d.pos]||'']||'9',
      arrive:r=>((day.arrive[r.t.truckNo]||{})[r.d.pos]||'~'),
      dnote:r=>((day.dnote[r.t.truckNo]||{})[r.d.pos]||'~')
    });
    for(const r of sorted)body+=rollRow(r);
  }else{
    const groups={};for(const r of list){const h=r.startMin==null?-1:Math.floor(r.startMin/60);(groups[h]=groups[h]||[]).push(r);}
    const hours=Object.keys(groups).map(Number).sort((a,b)=>a-b);
    for(const h of hours){
      const label=h<0?'ไม่ระบุเวลา':(String(h).padStart(2,'0')+':00 น.');
      body+=`<tr class="grouphdr"><td colspan="8">🕐 ${label} — ${groups[h].length} คนรายงานตัว</td></tr>`;
      for(const r of groups[h])body+=rollRow(r);
    }
  }
  return `<div class="tablewrap scroll"><table>
    <thead><tr>${thS('roster','start','เข้ากะ')}${thS('roster','truck','เบอร์รถ / ต้นทาง')}${thS('roster','pos','กะ')}${thS('roster','name','พจส.')}${thS('roster','status','สถานะ')}${thS('roster','arrive','เวลามาจริง')}<th>จ่ายแผน</th>${thS('roster','dnote','หมายเหตุ')}</tr></thead>
    <tbody>${body||'<tr><td colspan="8" class="empty-note">ไม่พบรายการ</td></tr>'}</tbody></table></div>`;
}
function rollRow(r){
  const t=r.t,d=r.d,off=isOff(t,d,curDate),cur=attOf(t.truckNo)[d.pos]||'',sc=shiftCls(d.pos);
  const nDone=(day.jobs||[]).filter(j=>String(j.mainTruck||j.truck)===String(t.truckNo)&&String(j.shift)===String(d.pos)).length;
  const av=(day.arrive[t.truckNo]||{})[d.pos]||'';
  let statusCell;
  if(off&&cur!=='ot')statusCell=`<span class="offbadge">วันหยุด (${esc(dayOffLabel(d)||d.dayOff)})</span> <button class="otbtn" data-ot="${esc(t.truckNo)}" data-pos="${d.pos}">＋ มาทำ OT</button>`;
  else if(off&&cur==='ot')statusCell=`<span class="otyes">✓ มา OT</span><button class="otbtn" data-ot="${esc(t.truckNo)}" data-pos="${d.pos}">ยกเลิก</button>`;
  else statusCell=`<div class="stbtns">${[['present','มา'],['late','สาย'],['absent','ขาด'],['leave','ลา']].map(([v,l])=>`<button class="st ${v}${cur===v?' sel':''}" data-att="${esc(t.truckNo)}" data-pos="${d.pos}" data-val="${v}">${l}</button>`).join('')}</div>`;
  return `<tr>
    <td class="mono" style="font-weight:600">${startLabel(shiftOf(d,curDate))}${shiftPending(d,curDate)?`<div class="cno" title="รอถึงรอบวันหยุดก่อนเปลี่ยน">→ ${esc(startLabel(d.shift2))} ${esc(d.shiftFrom)}</div>`:''}</td>
    <td class="truck"><span class="plate">${esc(t.truckNo)}</span><div class="cno">${esc(t.routeGroup)}</div></td>
    <td><span class="tag" style="color:var(--${sc});background:var(--${sc}-bg)">กะ${esc(d.pos)}</span></td>
    <td><div class="drv">${esc(d.name)}</div><div class="cno">${d.code?('รหัส '+esc(d.code)):''}${(d.code&&d.phone)?' · ':''}${d.phone?esc(d.phone):''}${
      !d.dayOff ? ' · <span style="color:var(--absent)" title="ยังไม่ได้ตั้งวันหยุดในตารางกะ">ยังไม่ตั้งวันหยุด</span>'
      : (dayIdx(d.dayOff)<0
          ? ' · <span style="color:var(--absent)" title="ระบบอ่านค่าวันหยุดนี้ไม่ออก จึงไม่นับเป็นวันหยุด — แก้ที่ ✎ แก้ไขรายชื่อ">⚠ วันหยุด &quot;'+esc(d.dayOff)+'&quot; อ่านไม่ออก</span>'
          : ' · <span title="วันนี้คือวัน'+esc(dayName(curDate))+'" style="color:'+(off?'var(--off)':'var(--muted)')+'">หยุด '+esc(dayOffLabel(d))+'</span>')}</div></td>
    <td>${statusCell}</td>
    <td>${hmField(av,'data-arrive="'+esc(t.truckNo)+'" data-pos="'+d.pos+'"')}</td>
    <td>${(()=>{
      /* จ่ายไปแล้ว -> ล็อกปุ่มไว้ให้เห็นสถานะ (แม้เป็นวันหยุด) */
      if(nDone)return '<button class="planlink done" disabled title="จ่ายไปแล้ว '+nDone+' เที่ยว — ถ้าต้องจ่ายเที่ยวถัดไป ให้ไปจ่ายที่หน้า 2 รายละเอียดงาน">จ่ายแล้ว'+(nDone>1?(' '+nDone+' เที่ยว'):'')+'</button>';
      /* ขาด / ลา / วันหยุด (ที่ยังไม่กดมาทำ OT) -> จ่ายงานไม่ได้ */
      const blocked = (cur==='absent') ? 'ขาด' : (cur==='leave') ? 'ลา' : ((off&&cur!=='ot') ? 'วันหยุด' : '');
      if(blocked)return '<span class="cno">— จ่ายแผนไม่ได้ ('+blocked+')</span>';
      return '<button class="planlink" data-plan="'+esc(t.truckNo)+'" data-pos="'+d.pos+'">จ่ายแผน →</button>';
    })()}</td>
    <td><input class="noteinp" style="width:150px" data-dnote="${esc(t.truckNo)}" data-pos="${d.pos}" value="${esc((day.dnote[t.truckNo]||{})[d.pos]||'')}" placeholder="หมายเหตุ…"></td>
  </tr>`;
}

/* ==================== เชื่อมต่อระบบ OMS (ส่งแผนงาน) ====================
   เบราว์เซอร์เรียก http:// จากหน้า https:// ไม่ได้ และปลายทางไม่เปิด CORS
   จึงส่งผ่าน Apps Script เป็นตัวกลาง                                       */
let omsAuto = true;                  /* กดจ่ายงาน = ส่งเข้า OMS ทันที (ปิดได้ที่ ⚙ ตั้งค่า) */
let omsQty  = 'trip';                /* ค่าที่ใส่หลัง WO: trip=เลขเที่ยว · one=1 · plan=แผนของสินค้านั้น */
const OMS_QTY_OPT = [['trip','เลขเที่ยวของงานนั้น'],['one','1 ต่อการจ่ายงาน 1 ครั้ง'],['plan','แผนรายสินค้าของวันนั้น']];

async function loadOmsCfg(){
  try{
    const a=await store.get('fleet:oms:auto');
    if(a!==null&&a!==undefined&&String(a)!=='')omsAuto=(String(a)==='1');   /* ไม่เคยตั้ง = เปิดไว้ */
    const q=await store.get('fleet:oms:qty'); if(q&&OMS_QTY_OPT.some(x=>x[0]===q))omsQty=q;
  }catch(e){}
}
async function saveOmsCfg(){
  await store.set('fleet:oms:auto', omsAuto?'1':'0');
  await store.set('fleet:oms:qty', omsQty);
}
/* เลขที่ใบงานของงานหนึ่ง ๆ — ดึงจากทะเบียนหน้า 5 ตามสินค้า+ต้นทาง+ปลายทาง */
function woOf(j){
  const P=(j.product||'').trim(), O=(j.origin||'').trim(), D=(j.dest||'').trim();
  const r=routes.find(x=>(x.product||'').trim()===P&&(x.origin||'').trim()===O&&(x.dest||'').trim()===D)
       || routes.find(x=>(x.product||'').trim()===P&&(x.origin||'').trim()===O)
       || routes.find(x=>(x.product||'').trim()===P);
  return r ? String(r.wo||'').trim() : '';
}
/* ประกอบข้อมูลที่จะส่ง */
function omsPayload(j){
  const t=truckByNo(j.mainTruck||j.truck), d=driverAt(t,j.shift);
  const empId=String((d&&d.code)||j.code||'').trim();
  const truckId=String(j.mainTruck||j.truck||'').trim();
  const wo=woOf(j);
  let qty=1;
  if(omsQty==='trip') qty=parseInt(j.trip,10)||1;
  else if(omsQty==='plan'){ const v=Number((day.plan||{})[jobType(j)+'|'+(j.product||'')]); qty=(isFinite(v)&&v>0)?v:1; }
  const miss=[];
  if(!empId)  miss.push('รหัส พจส.');
  if(!truckId)miss.push('เบอร์รถ');
  if(!wo)     miss.push('เลขที่ใบงาน (ตั้งที่หน้า 5)');
  return { empId, truckId, wo, qty, workList: wo+':'+qty, jobId:String(j.id), miss };
}
/* ยิงจริง (หรือทดลอง) ผ่าน Apps Script */
async function omsSend(j,dry){
  if(!backendURL)return {ok:false,message:'ยังไม่ได้ตั้ง URL ระบบกลาง'};
  const p=omsPayload(j);
  if(p.miss.length)return {ok:false,message:'ข้อมูลไม่ครบ: '+p.miss.join(' · ')};
  try{
    const r=await fetch(backendURL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({omsplan:1,tk:API_TOKEN,dryRun:dry?1:0,
        empId:p.empId,truckId:p.truckId,workList:p.workList,jobId:p.jobId})});
    const d=await r.json();
    return d||{ok:false,message:'ไม่มีคำตอบจากระบบกลาง'};
  }catch(e){return {ok:false,message:'ต่อระบบกลางไม่ได้'};}
}
/* ส่งแล้วบันทึกผลกลับไปที่งาน */
async function omsSendAndSave(j,force){
  if(!j)return;
  if(j.omsDoc&&!force)return;                      /* ส่งสำเร็จแล้ว ไม่ส่งซ้ำเอง */
  setJobField(j,'omsState','sending');saveDay();renderDispatch();
  const r=await omsSend(j,false);
  setJobField(j,'omsState', r.ok?'ok':'err');
  setJobField(j,'omsMsg',  String(r.message||'').slice(0,200));
  setJobField(j,'omsAt',   nowHM());
  if(r.ok&&r.doc)setJobField(j,'omsDoc',String(r.doc));
  saveDay();renderDispatch();
  return r;
}

function omsBadge(j){
  if(j.omsDoc)      return '<span class="badge b-done" title="'+esc(j.omsDoc)+' · ส่งเมื่อ '+esc(j.omsAt||'')+'">ส่งแล้ว</span>';
  if(j.omsState==='sending') return '<span class="badge b-run">กำลังส่ง…</span>';
  if(j.omsState==='err')     return '<span class="badge b-wait" title="'+esc(j.omsMsg||'')+'">ไม่สำเร็จ</span>';
  return '<span class="cno">—</span>';
}

/* ---- แก้รายละเอียดงานที่จ่ายไปแล้ว (สินค้า/ต้นทาง/ปลายทาง) ----
   ตัวเลือกมาจากทะเบียนหน้า 5 เท่านั้น · แก้แล้วระยะทางกับประเภทงานตามให้เอง
   ซึ่งทำให้ เวลาถึงต้นทาง หน้า 3 · การจัดกลุ่มหน้า 4 · ไฟล์ Excel เปลี่ยนตามทั้งหมด */
function applyRouteToJob(j){
  const P=(j.product||'').trim(),O=(j.origin||'').trim(),D=(j.dest||'').trim();
  const r=routes.find(x=>(x.product||'').trim()===P&&(x.origin||'').trim()===O&&(x.dest||'').trim()===D)
       ||routes.find(x=>(x.product||'').trim()===P&&(x.origin||'').trim()===O)
       ||routes.find(x=>(x.product||'').trim()===P);
  if(r){
    if(r.distance)j.distance=String(r.distance);
    if(r.type)j.type=r.type;
  }
}
function jopt(v,cur,lab){return '<option value="'+esc(v)+'"'+(String(v)===String(cur)?' selected':'')+'>'+esc(lab||v||'(ไม่ระบุ)')+'</option>';}
function jselProduct(j){
  const cur=j.product||'';
  let h='';
  if(cur&&!routes.some(r=>r.product===cur))h+=jopt(cur,cur,cur+' (นอกทะเบียน)');
  JOBTYPES.forEach(t=>{
    const ps=[...new Set(routes.filter(r=>(r.type||'main')===t.k&&r.product).map(r=>r.product))];
    if(ps.length)h+='<optgroup label="'+esc(t.f)+'">'+ps.map(p=>jopt(p,cur)).join('')+'</optgroup>';
  });
  return '<select class="jsel" data-jf="product" data-id="'+j.id+'" title="แก้สินค้า/เส้นทาง">'+h+'</select>';
}
function jselOrigin(j){
  const cur=j.origin||'';
  const os=[...new Set(routes.filter(r=>r.product===j.product).map(r=>r.origin||''))];
  if(os.indexOf(cur)<0)os.unshift(cur);
  return '<select class="jsel" data-jf="origin" data-id="'+j.id+'" title="แก้ต้นทาง">'+os.map(o=>jopt(o,cur)).join('')+'</select>';
}
function jselDest(j){
  const cur=j.dest||'';
  const ds=[...new Set(routes.filter(r=>r.product===j.product&&(r.origin||'')===(j.origin||'')).map(r=>r.dest||''))];
  if(ds.indexOf(cur)<0)ds.unshift(cur);
  return '<select class="jsel" data-jf="dest" data-id="'+j.id+'" title="แก้ปลายทาง">'+ds.map(o=>jopt(o,cur)).join('')+'</select>';
}

function effOrigin(){const s=document.getElementById('j_origin');return s?s.value:'';}
function effDest(){const s=document.getElementById('j_dest');return s?s.value:'';}
/* เลือกสินค้า -> ตัวเลือกต้นทางเฉพาะของสินค้านั้น */
function fillOrigins(keep){
  const p=document.getElementById('j_route').value;
  const os=[...new Set(routes.filter(r=>r.product===p).map(r=>r.origin||''))];
  const sel=document.getElementById('j_origin');
  sel.innerHTML=os.map(o=>`<option value="${esc(o)}">${esc(o||'(ไม่ระบุ)')}</option>`).join('');
  if(keep&&os.indexOf(keep)>=0)sel.value=keep;
  fillDests();
}
/* เลือกต้นทาง -> ตัวเลือกปลายทางเฉพาะคู่นั้น */
function fillDests(keep){
  const p=document.getElementById('j_route').value,o=document.getElementById('j_origin').value;
  const ds=[...new Set(routes.filter(r=>r.product===p&&(r.origin||'')===o).map(r=>r.dest||''))];
  const sel=document.getElementById('j_dest');
  sel.innerHTML=ds.map(x=>`<option value="${esc(x)}">${esc(x||'(ไม่ระบุ)')}</option>`).join('');
  if(keep&&ds.indexOf(keep)>=0)sel.value=keep;
  recalcDist();
}
/* ระยะทาง + ประเภทงาน ล็อกตามทะเบียนหน้า 5 */
function recalcDist(){
  const p=document.getElementById('j_route').value,o=effOrigin(),d=effDest();
  const r=routes.find(x=>x.product===p&&(x.origin||'')===o&&(x.dest||'')===d)
        ||routes.find(x=>x.product===p);
  const di=document.getElementById('j_distance');if(di)di.value=r?(r.distance||''):'';
  const ty=document.getElementById('j_type');if(ty)ty.value=r?(r.type||'main'):'main';
  const tt=document.getElementById('j_typetxt');if(tt)tt.value=jtFull(r?r.type:'main');
}

/* --- กฎเวลาเดินทาง: สายหลัก 3 ชม. / สายรอง หรือ <=100 กม. 1 ชม. --- */
const CHARGER_COUNT = 3;                 /* จำนวนตู้ชาร์จต่อต้นทาง */
function travelMin(j){
  const km = parseFloat(j.distance);
  if(!isNaN(km) && km <= 100) return 60;      /* ระยะไม่เกิน 100 กม. = สายสั้น */
  return jtLong(jobType(j)) ? 180 : 60;           /* ที่เหลือดูจากกลุ่มประเภทงาน */
}
function addMin(hm, mins){
  if(!hm) return null;
  const p = String(hm).split(':'), h = Number(p[0]), m = Number(p[1]);
  if(isNaN(h) || isNaN(m)) return null;
  const t = h*60 + m + mins;
  return { hm: String(Math.floor((t%1440)/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'),
           nextDay: t >= 1440 };
}
function hm2min(hm){
  if(!hm) return null;
  const p = String(hm).split(':'), h = Number(p[0]), m = Number(p[1]);
  return (isNaN(h)||isNaN(m)) ? null : h*60+m;
}
/* สถานะจากเวลาคาดการณ์เทียบเวลาปัจจุบัน */
/* สถานะดูจากช่องเวลาที่ CC กรอกจริงเท่านั้น (ไม่อิงเวลาคาดการณ์) */
function runStatus(j){
  if(j.closed)      return ['closed','b-done','ปิดงานแล้ว'];
  if(j.ret)         return ['back','b-charged','กำลังเดินทางกลับ'];
  if(j.chargeStart) return ['charge','b-charge','กำลังชาร์จ'];
  if(j.depart)      return ['run','b-run','กำลังเดินทาง'];
  return ['wait','b-wait','รอออก'];
}
/* รวมเวลาทำงาน: เวลาออก -> เวลาปิดงาน (ข้ามเที่ยงคืนได้) */
function workHours(j){
  const m = minutesBetween(j.depart, j.closed);
  return (m === null) ? '' : Math.round(m/60*10)/10;
}
/* รวมเวลาทำงานแบบสะสมทีละขั้นตอน: ออก -> ชาร์จ -> กลับ -> ปิดงาน
   บวกช่วงเวลาของแต่ละขั้นที่คีย์ไว้แล้วต่อกันไป (ข้ามเที่ยงคืนได้) */
const STEP_POINTS=[['ออก','depart'],['ชาร์จ','chargeStart'],['กลับ','ret'],['ปิดงาน','closed']];
function workBreakdown(j){
  const out={total:0,parts:[],closed:!!j.closed,started:!!j.depart,upto:''};
  if(!j.depart)return out;
  const pts=STEP_POINTS.filter(p=>j[p[1]]);
  let mins=0;
  for(let i=1;i<pts.length;i++){
    const m=minutesBetween(j[pts[i-1][1]],j[pts[i][1]]);
    if(m===null)continue;
    mins+=m;
    out.parts.push({label:pts[i-1][0]+'→'+pts[i][0],h:Math.round(m/60*10)/10});
  }
  out.total=Math.round(mins/60*10)/10;
  out.upto=pts.length?pts[pts.length-1][0]:'';
  return out;
}
/* ค่าที่ใช้ในไฟล์ Excel: ให้ตรงกับที่แสดงบนหน้าจอ */
function workHoursText(j){
  const b=workBreakdown(j);
  if(!b.started)return 'รอออก';
  if(!b.parts.length)return 'กำลังเดินทาง';
  return b.closed ? b.total : (b.total+' (กำลังเดินทาง)');
}
/* คิวชาร์จ: นับต่อเนื่องภายในต้นทางเดียวกัน วนกลับที่ตู้ 1 เมื่อครบ 3 ตู้ */
function chargerPlan(jobs){
  const used = {}, out = {};
  jobs.forEach(j=>{
    const key = (j.origin||'(ไม่ระบุต้นทาง)').trim();
    used[key] = (used[key]||0) + 1;
    out[j.id] = { no: ((used[key]-1) % CHARGER_COUNT) + 1, seq: used[key], origin: key };
  });
  return out;
}

/* ลำดับเที่ยวของ "เบอร์รถที่วิ่งจริง" ในวันนั้น เรียงตามเวลาออก
   งานที่ยังไม่มีเวลาออกต่อท้าย                                        */
function truckTripSeq(jobs){
  const by={}, out={};
  (jobs||[]).forEach(j=>{const t=String(j.actualTruck||j.mainTruck||j.truck||'-');(by[t]=by[t]||[]).push(j);});
  Object.keys(by).forEach(t=>{
    by[t].slice().sort((a,b)=>{
      const x=hm2min(a.depart), y=hm2min(b.depart);
      if(x===null&&y===null)return String(a.id).localeCompare(String(b.id));
      if(x===null)return 1;
      if(y===null)return -1;
      return x-y||String(a.id).localeCompare(String(b.id));
    }).forEach((j,i)=>{out[j.id]=i+1;});
  });
  return out;
}

/* ---------- TAB 5: summary ---------- */
function minutesBetween(a,b){if(!a||!b)return null;const[ah,am]=a.split(':').map(Number);let[bh,bm]=b.split(':').map(Number);let x=ah*60+am,y=bh*60+bm;if(y<x)y+=1440;return y-x;}
/* ===== ตารางที่ 1: คนมาทำงานเทียบแผน รายชั่วโมง (00:00 -> ชั่วโมงปัจจุบัน +1) ===== */
function hourlyAttend(){
  const b = {};
  const mk = h => (b[h] = b[h] || {plan:0,present:0,ot:0,late:0,absent:0,leave:0,unchecked:0,off:0});
  for(const t of config){
    for(const d of (t.drivers||[])){
      const sm = parseStart(shiftOf(d,curDate));
      const row = mk(sm === null ? -1 : Math.floor(sm/60));   /* ไม่มีเวลากะ -> เก็บไว้แถวพิเศษ ไม่ตกหล่น */
      const v = attOf(t.truckNo)[d.pos] || '';
      if(isOff(t,d,curDate)){ row.off++; if(v==='ot') row.ot++; continue; }
      row.plan++;
      if(v==='present') row.present++;
      else if(v==='late') { row.present++; row.late++; }
      else if(v==='ot') { row.present++; row.ot++; }
      else if(v==='absent') row.absent++;
      else if(v==='leave') row.leave++;
      else row.unchecked++;
    }
  }
  return b;
}
function tableAttend(){
  const b = hourlyAttend();
  const nowH = new Date().getHours();
  const lastH = Math.min(23, nowH + 1);          /* แสดงแผนล่วงหน้า 1 ชม. */
  let cp = 0, ca = 0;
  const list=[];
  const hoursToShow=[];
  if(b[-1])hoursToShow.push(-1);                 /* แถวคนที่ยังไม่ได้ใส่เวลากะ */
  for(let x=0;x<=lastH;x++)hoursToShow.push(x);
  for(const h of hoursToShow){
    const r = b[h] || {plan:0,present:0,ot:0,late:0,absent:0,leave:0,unchecked:0,off:0};
    const ahead = (h>=0) && (h > nowH);
    const actual = r.present;
    if(!ahead){ cp += r.plan; ca += actual; }
    const diff = ca - cp;
    const hl = (h<0) ? 'ไม่ระบุเวลากะ' : (String(h).padStart(2,'0') + ':00');
    const cls = ahead ? 'aheadrow' : (h===nowH ? 'nowrow' : '');
    list.push({h,r,ahead,actual,cp,ca,diff,cls,html:`<tr class="${cls}">
      <td class="mono" style="font-weight:600">${hl}${h===nowH?' <span class="tag">ชม.นี้</span>':''}${ahead?' <span class="tag" style="background:var(--m-bg);color:var(--off)">ล่วงหน้า</span>':''}</td>
      <td class="mono" style="text-align:center">${r.plan||'-'}</td>
      <td class="mono" style="text-align:center">${ahead?'<span class="cno">—</span>':(actual||'-')}${(!ahead&&r.ot)?` <span class="otyes">+${r.ot} OT</span>`:''}</td>
      <td class="mono" style="text-align:center;color:#b57608">${ahead?'':(r.late||'-')}</td>
      <td class="mono" style="text-align:center;color:var(--absent)">${ahead?'':(r.absent||'-')}</td>
      <td class="mono" style="text-align:center;color:var(--leave)">${ahead?'':(r.leave||'-')}</td>
      <td class="mono" style="text-align:center">${ahead?'':(r.unchecked?('<b style="color:var(--accent)">'+r.unchecked+'</b>'):'-')}</td>
      <td class="mono" style="text-align:center">${r.off||'-'}</td>
      <td class="mono" style="text-align:center">${ahead?'':cp}</td>
      <td class="mono" style="text-align:center">${ahead?'':ca}</td>
      <td class="mono" style="text-align:center;font-weight:600;color:${diff<0?'var(--absent)':'var(--present)'}">${ahead?'':(diff>0?'+':'')+diff}</td>
    </tr>`});
  }
  let rows=sortBy('sum1',list,{hour:x=>x.h,plan:x=>x.r.plan,actual:x=>x.actual,late:x=>x.r.late,
    absent:x=>x.r.absent,leave:x=>x.r.leave,unchecked:x=>x.r.unchecked,off:x=>x.r.off,
    cp:x=>x.cp,ca:x=>x.ca,diff:x=>x.diff}).map(x=>x.html).join('');
  /* แถวรวมทั้งวัน — นับทุกชั่วโมงรวมที่ยังไม่ถึงเวลา ให้ตรงกับการ์ดหน้า 1 */
  const T={plan:0,present:0,late:0,absent:0,leave:0,unchecked:0,off:0,ot:0};
  Object.keys(b).forEach(k=>{const r=b[k];['plan','present','late','absent','leave','unchecked','off','ot'].forEach(f=>T[f]+=r[f]||0);});
  const tdif=T.present-T.plan;
  rows+=`<tr style="background:var(--nav);color:#fff">
    <td style="font-weight:600;color:#fff">รวมทั้งวัน <span style="font-size:11px;opacity:.75">(ทุกกะ รวมที่ยังไม่ถึงเวลา)</span></td>
    <td class="mono" style="text-align:center;font-weight:600">${T.plan}</td>
    <td class="mono" style="text-align:center;font-weight:600">${T.present}${T.ot?` <span class="otyes">+${T.ot} OT</span>`:''}</td>
    <td class="mono" style="text-align:center">${T.late||'-'}</td>

/* ===== ตารางที่ 2: งานหลักรายสินค้า / งานรอง เทียบแผนที่ CC กรอก ===== */
let planMigDate='';
/* ย้ายแผนงานเดิมที่เก็บด้วยชื่อสินค้าอย่างเดียว -> คีย์ "กลุ่ม|สินค้า" (ทำครั้งเดียวต่อวัน) */
function migratePlanKeys(){
  if(!day||!isPlain(day.plan))return false;
  let changed=false;
  Object.keys(day.plan).forEach(k=>{
    if(k.indexOf('|')>=0)return;                       /* คีย์ใหม่แล้ว */
    const val=day.plan[k];
    if(val===''||val===undefined||val===null){return;}
    const g=(k==='__vt')?'vt':(()=>{const r=routes.find(x=>x.product===k);return r?(r.type||'main'):'main';})();
    const nk=g+'|'+(k==='__vt'?'':k);
    if(k!=='__vt'&&(day.plan[nk]===undefined||day.plan[nk]===''))setFlat('plan',nk,val);
    setFlat('plan',k,'');                              /* เคลียร์คีย์เก่า (ใช้ '' เพื่อให้ส่งถึงเครื่องอื่นด้วย) */
    changed=true;
  });
  return changed;
}
function tablePlanVsActual(){
  if(planMigDate!==curDate){planMigDate=curDate;if(migratePlanKeys())saveDay();}
  /* นับงานจริงแยกตามกลุ่มและสินค้า */
  const act={}; JOBTYPES.forEach(x=>act[x.k]={});
  for(const j of day.jobs){
    const g=jobType(j);
    const p=j.product||'(ไม่ระบุสินค้า)';
    act[g][p]=(act[g][p]||0)+1;
  }

    /* รายการสินค้าของกลุ่ม = จากทะเบียนหน้า 5 + สินค้าที่วิ่งจริงวันนี้ */

      }

      ${thS('sum2','product','สินค้า / เส้นทาง')}${thS('sum2','plan','แผน (เที่ยว)','center')}${thS('sum2','actual','วิ่งจริง','center')}${thS('sum2','diff','ผลต่าง','center')}${thS('sum2','pct','% ของแผน','center')}

        <td class="mono" style="text-align:center;font-weight:600">${gPlan?Math.round(gAct/gPlan*100)+'%':'-'}</td></tr>

/* ===== ตารางที่ 3: เวลาการทำงานต่อเที่ยว (เกณฑ์ 8 ชม.) ===== */
function tableWorkTime(){
  /* แยกตามเกณฑ์เวลา 3 กลุ่ม: กะ 8 ชม. / งานสายยาว-ขึ้นเอง / สายสั้น 4 ชม. */
  const G={}; WT_GROUPS.forEach(x=>G[x.k]={ok:0,over:0,sum:0,n:0,run:0,list:[]});
  for(const j of day.jobs){
    const b=workBreakdown(j);
    if(!b.started)continue;
    const g=G[workGroup(j)];
    if(!b.closed){g.run++;continue;}
    g.n++; g.sum+=b.total;
    if(b.total>workLimit(j)){g.over++;g.list.push(j);}else g.ok++;
  }
  const T={ok:0,over:0,sum:0,n:0,run:0};
  WT_GROUPS.forEach(x=>{const g=G[x.k];T.ok+=g.ok;T.over+=g.over;T.sum+=g.sum;T.n+=g.n;T.run+=g.run;});
  const pc=(a,b)=>b?Math.round(a/b*100)+'%':'-';
  const bar=(ok,over,tot)=>{
    if(!tot)return '<div style="background:#eef1f5;border-radius:20px;height:9px"></div>';
    return `<div style="display:flex;height:9px;border-radius:20px;overflow:hidden;background:#eef1f5">
      <div style="width:${Math.round(ok/tot*100)}%;background:var(--present)"></div>

      <td class="mono" style="text-align:center;font-weight:600">${g.n}</td>

      <td style="min-width:140px">${bar(g.ok,g.over,g.n)}</td></tr>`;
  };
  const overAll=[];
  WT_GROUPS.forEach(x=>G[x.k].list.forEach(j=>overAll.push({j:j,lim:workLimit(j)})));
  const overList=overAll.length
    ? '<div class="cno" style="margin-top:10px">เที่ยวที่เกินเกณฑ์: '
      + overAll.map(o=>esc((o.j.actualTruck||o.j.mainTruck||o.j.truck)+' '+(o.j.driver||'')
        +' ('+workBreakdown(o.j).total+'/'+o.lim+' ชม.)')).join(' · ') + '</div>'
    : '';
  return `<div class="card"><h2>3 · เวลาการทำงานต่อเที่ยว (แยกตามเกณฑ์)</h2>

      <th style="text-align:center">รวม</th><th style="text-align:center">เฉลี่ย (ชม.)</th><th>กราฟ</th>
    </tr></thead><tbody>
      ${WT_GROUPS.map(row).join('')}

        <td class="mono" style="text-align:center;font-weight:600">${T.n}</td>
        <td class="mono" style="text-align:center">${T.n?(Math.round(T.sum/T.n*10)/10):'-'}</td>
        <td class="cno" style="color:#c9d7ea">ยังวิ่งอยู่ ${T.run} เที่ยว</td></tr>

/* ===== ตารางที่ 4: จำนวนรอบต่อคัน (1 คัน = 3 กะ = เป้า 3 รอบ/วัน) ===== */
const TARGET_ROUNDS = 3;
/* ---- รถที่ถูกใช้วิ่งจริงแต่ไม่อยู่ในทะเบียนกองรถ ----
   คืนค่า: { list:[{truck,trips,closed,avg,origins:{},mains:{}}], trucks, trips }   */
function outsideData(){
  const known={}; config.forEach(t=>known[t.truckNo]=1);
  const map={};
  for(const j of (day.jobs||[])){
    const act=String(j.actualTruck||'').trim();
    if(!act||known[act])continue;
    const o=map[act]=map[act]||{truck:act,trips:0,closed:0,hrs:[],origins:{},mains:{}};
    o.trips++;
    const org=String(j.origin||'(ไม่ระบุต้นทาง)').trim();
    o.origins[org]=(o.origins[org]||0)+1;
    const mn=String(j.mainTruck||j.truck||'-').trim();
    o.mains[mn]=(o.mains[mn]||0)+1;
    const b=workBreakdown(j);
    if(b.closed){o.closed++;o.hrs.push(b.total);}
  }
  const list=Object.keys(map).sort((a,b)=>a.localeCompare(b,'th')).map(k=>{
    const o=map[k];
    o.avg=o.hrs.length?Math.round(o.hrs.reduce((a,b)=>a+b,0)/o.hrs.length*10)/10:null;
    return o;
  });
  return { list:list, trucks:list.length, trips:list.reduce((a,b)=>a+b.trips,0) };
}

function roundsData(){
  const per = {};
  for(const j of day.jobs){
    const no = j.mainTruck || j.truck || '(ไม่ระบุ)';        /* นับรอบตามเบอร์รถหลักที่รับงาน */
    const p = per[no] = per[no] || {main:0,vt:0,oth:0,hrs:[],closed:0};
    p.byType=p.byType||{}; const gk=jobType(j);
    p.byType[gk]=(p.byType[gk]||0)+1;
    if(gk==='vt') p.vt++; else if(gk==='main') p.main++; else p.oth=(p.oth||0)+1;
    const b = workBreakdown(j);
    if(b.closed){ p.closed++; p.hrs.push(b.total); }
  }
  /* ---- เตรียมข้อมูลเป็นแถว ๆ ก่อน เพื่อให้เรียงได้ ---- */
  /* รถที่มีงานแต่ไม่อยู่ในตารางกะ (เช่น อัปตารางกะใหม่แล้วรถหายไป) ต้องไม่ตกหล่น */
  const known={}; config.forEach(t=>known[t.truckNo]=1);
  const ghosts=Object.keys(per).filter(no=>!known[no])
    .map(no=>({truckNo:no,routeGroup:'(ไม่อยู่ในตารางกะ)',drivers:[]}));
  /* รถที่วิ่งจริงแต่ไม่อยู่ในกอง — เพิ่มเข้ามาในรายการด้วย ไม่ให้ตกหล่น */
  const OUT=outsideData();
  const outRows=OUT.list.filter(o=>!per[o.truck]).map(o=>({
    truck:o.truck, route:'(รถนอกกอง)', came:0, crew:0,
    rounds:o.trips, main:0, vt:0, oth:0, target:0, ok:true, outside:true,
    avg:o.avg
  }));
  const data = config.concat(ghosts)
    .filter(t => per[t.truckNo] || (t.drivers||[]).length >= TARGET_ROUNDS)
    .map(t=>{
      const p = per[t.truckNo] || {main:0,vt:0,oth:0,hrs:[],closed:0};
      const crew = (t.drivers||[]).length;
      let came = 0;
      for(const d of (t.drivers||[])){ const v = attOf(t.truckNo)[d.pos]||''; if(v==='present'||v==='ot') came++; }
      const rounds = p.main + p.vt + (p.oth||0);
      const target = Math.min(TARGET_ROUNDS, crew || TARGET_ROUNDS);
      return { truck:t.truckNo, route:t.routeGroup||'', came:came, crew:crew, outside:false,
               rounds:rounds, main:p.main, vt:p.vt, oth:p.oth||0, target:target, ok:rounds>=target,
               avg: p.hrs.length ? Math.round(p.hrs.reduce((a,b)=>a+b,0)/p.hrs.length*10)/10 : null };
    });

  return data.concat(outRows);
}
function tableRounds(){
  const data = roundsData();
  /* ---- สรุปจำนวนคันตามรอบที่ทำได้ ---- */
  const inFleet = data.filter(r=>!r.outside);
  const c0 = inFleet.filter(r=>r.rounds===0).length;
  const c1 = inFleet.filter(r=>r.rounds===1).length;
  const c2 = inFleet.filter(r=>r.rounds===2).length;
  const cLess = inFleet.filter(r=>r.rounds<TARGET_ROUNDS).length;
  const cHit  = inFleet.filter(r=>r.rounds>=TARGET_ROUNDS).length;
  const OUTS = outsideData();

  /* ---- เรียงข้อมูลตามคอลัมน์ที่เลือก ---- */
  const dir = roundSort.dir;
  data.sort((a,b)=>{
    const k = roundSort.key;
    let x = a[k], y = b[k];
    if(k === 'avg'){ if(x===null) return 1; if(y===null) return -1; }
    if(k === 'ok'){ x = x?1:0; y = y?1:0; }
    if(typeof x === 'string') return x.localeCompare(y,'th') * dir || a.truck.localeCompare(b.truck,'th');
    return ((x||0) - (y||0)) * dir || a.truck.localeCompare(b.truck,'th');
  });

/* ================= ระบบแจ้งเตือน Alarm / Alert =================
   Alarm : เตือน CC ให้โทรติดตาม พจส. ล่วงหน้าก่อนเข้ากะ 30 นาที
   Alert : ถึงเวลาเข้ากะแล้วเกิน 10 นาที ยังไม่รายงานตัว -> ขึ้น "ขาด" ให้อัตโนมัติ
   ทั้งสองระบบไม่นับวันหยุดของ พจส.                                     */
const ALARM_LEAD   = 30;      /* แจ้งเตือนล่วงหน้า (นาที) */
const ALERT_GRACE  = 10;      /* ถึงเวลาแล้วเกินกี่นาทีถือว่าไม่รายงานตัว */
const ALERT_WINDOW = 180;     /* ไม่ย้อนแจ้งเตือน/ตีขาด ย้อนหลังเกินกี่นาที */
const WIDGET_MS    = 60000;   /* วิดเจทเด้งค้างไว้ 1 นาที */
const AUTO_CLOSE_SHIFT = true;  /* จบกะแล้วยังไม่มีใครเช็ก ให้ปิดยอดเป็น "ขาด" อัตโนมัติ (false = ให้ CC ใส่เองทั้งหมด) */

let alarmList=[], alertList=[], alarmSeen={}, alertSeen={}, sweptSeen={};
let alarmTimer=null, alertTimer=null, tickTimer=null;

function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
/* วัดความสูงหัวเว็บจริง แล้วให้แถบแท็บตรึงพอดีใต้หัวเว็บ (หัวเว็บสูงไม่เท่ากันบนจอแคบ) */
function fitTabs(){
  const h=document.querySelector('header');
  if(!h)return;
  const px=Math.round(h.getBoundingClientRect().height);
  if(px>20)document.documentElement.style.setProperty('--hh',px+'px');   /* ถ้าวัดไม่ได้ ใช้ค่าสำรอง 56px */
}
if(window.ResizeObserver){
  const ro=new ResizeObserver(fitTabs);
  const hh=document.querySelector('header');
  if(hh)ro.observe(hh);
}
window.addEventListener('resize',fitTabs);
window.addEventListener('orientationchange',fitTabs);
function nKey(kind,what){return 'fleet:'+kind+what+':'+curDate;}
function loadNotify(){
  const rd=(k,dflt)=>{try{return JSON.parse(lsGet(k)||'null')||dflt;}catch(e){return dflt;}};
  alarmSeen=rd(nKey('alarm','seen'),{}); alertSeen=rd(nKey('alert','seen'),{}); sweptSeen=rd(nKey('swept','seen'),{});
  alarmList=rd(nKey('alarm','list'),[]); alertList=rd(nKey('alert','list'),[]);
  updateBells();
}
function saveNotify(){
  lsSet(nKey('alarm','seen'),JSON.stringify(alarmSeen)); lsSet(nKey('alert','seen'),JSON.stringify(alertSeen));
  lsSet(nKey('swept','seen'),JSON.stringify(sweptSeen));
  lsSet(nKey('alarm','list'),JSON.stringify(alarmList)); lsSet(nKey('alert','list'),JSON.stringify(alertList));
}
function driverItem(t,d){
  return {key:t.truckNo+':'+d.pos,truck:t.truckNo,pos:d.pos,name:d.name||'(ไม่ระบุชื่อ)',
          code:d.code||'',phone:d.phone||'',start:startLabel(shiftOf(d,curDate)),route:t.routeGroup||''};
}
function tickAlarms(){
  if(!config||!day)return;
  if(curDate!==todayStr()){updateBells();return;}     /* ดูวันย้อนหลัง ไม่ต้องเตือน */
  const now=nowMin();
  let na=0, nl=0, swept=0, marked=false;
  for(const t of config){
    for(const d of (t.drivers||[])){
      if(isOff(t,d,curDate))continue;                 /* วันหยุดของ พจส. ไม่นับ */
      const sm=parseStart(shiftOf(d,curDate)); if(sm===null)continue;
      const k=t.truckNo+':'+d.pos;
      if(((day.attend[t.truckNo]||{})[d.pos]||'')!=='')continue;   /* เช็กแล้ว ไม่ต้องเตือน */
      const lead=sm-now, over=now-sm;
      if(lead>0 && lead<=ALARM_LEAD && !alarmSeen[k]){
        alarmSeen[k]=1; alarmList.push(driverItem(t,d)); na++;
      }
      /* เลยเวลาเข้ากะ -> เตือนอย่างเดียว ไม่เปลี่ยนสถานะให้ CC เป็นคนใส่เอง */
      if(over>=ALERT_GRACE && over<=ALERT_WINDOW && !alertSeen[k]){
        alertSeen[k]=1; alertList.push(driverItem(t,d)); nl++;
      }
      /* จบกะแล้วยังไม่มีใครเช็ก -> ปิดยอดเป็น "ขาด" เงียบ ๆ ไม่เด้งวิดเจท
         (ใช้ flag คนละตัวกับ Alert เพื่อให้คนที่เคยถูกเตือนแล้วยังถูกปิดยอดตอนจบกะ) */
      const dur=shiftDuration(shiftOf(d,curDate));
      if(AUTO_CLOSE_SHIFT && dur!==null && now>=sm && (now-sm)>=dur && !sweptSeen[k]){
        sweptSeen[k]=1; swept++;
        setCell('attend',t.truckNo,d.pos,'absent');
        setCell('attendBy',t.truckNo,d.pos,'ระบบ (จบกะแล้วไม่มีการเช็ก)');
        marked=true;
      }
    }
  }
  if(marked){saveDay(); if(tab==='roster')renderRoster();}
  if(swept)console.warn('ปิดยอดอัตโนมัติ (จบกะแล้วไม่มีการเช็ก): '+swept+' คน');
  if(na||nl||swept)saveNotify();
  if(na)showAlarm();
  if(nl)showAlert();
  updateBells();
}
function widgetRows(list,kind){
  const show=list.slice(-8).reverse();
  let h=show.map(x=>`<div class="wrow">
    <div class="nm">${esc(x.name)}<span class="wsub">รหัส ${esc(x.code||'-')} · รถ ${esc(x.truck)} กะ${esc(x.pos)}${x.route?(' · '+esc(x.route)):''}</span></div>
    <div><a class="tel" href="tel:${esc((x.phone||'').replace(/[^0-9+]/g,''))}">${esc(x.phone||'-')}</a></div>
    <div class="tm">${esc(x.start)}</div>
    <button class="del wdel" data-wdel="${esc(x.key)}" title="เอาชื่อนี้ออกจากรายการ">✕</button></div>`).join('');
  if(list.length>show.length)h+=`<div class="wrow"><span class="wsub">และอีก ${list.length-show.length} คน (ดูทั้งหมดในหน้า 1)</span></div>`;
  return h;
}
function showAlarm(){
  if(!alarmList.length)return;
  const b=document.getElementById('alarmBox');
  b.innerHTML=`<div class="wtop"><span style="font-size:21px">⏰</span><span class="ttl">ติดตาม พจส.</span><span class="cno">${alarmList.length} คน</span></div>
    <div class="wlist">${widgetRows(alarmList,'alarm')}</div>
    <div class="wfoot"><span>เตือนล่วงหน้า ${ALARM_LEAD} นาที ก่อนเวลาเข้ากะ · กดเบอร์เพื่อโทร</span><button class="wclose" data-wclose="alarm">ปิด</button></div>`;
  b.style.display='block';
  clearTimeout(alarmTimer); alarmTimer=setTimeout(()=>closeWidget('alarm'),WIDGET_MS);
}
function showAlert(){
  if(!alertList.length)return;
  const b=document.getElementById('alertBox');
  b.innerHTML=`<div class="wtop"><span style="font-size:20px">🔔</span><span class="ttl">พจส. ยังไม่รายงานตัว</span><span style="font-size:12px">${alertList.length} คน</span></div>
    <div class="wlist">${widgetRows(alertList,'alert')}</div>
    <div class="wfoot"><span>เกินเวลาเข้ากะ ${ALERT_GRACE} นาที · <b>ยังไม่เปลี่ยนสถานะให้</b> กรุณาเช็กแล้วบันทึก มา / สาย / ขาด / ลา ที่หน้า 1</span><button class="wclose" data-wclose="alert">ปิด</button></div>`;
  b.style.display='block';
  clearTimeout(alertTimer); alertTimer=setTimeout(()=>closeWidget('alert'),WIDGET_MS);
}
function removeNotify(kind,key){
  if(kind==='alarm')alarmList=alarmList.filter(x=>x.key!==key);
  else               alertList=alertList.filter(x=>x.key!==key);
  saveNotify();
  const list=(kind==='alarm')?alarmList:alertList;
  if(!list.length)closeWidget(kind);
  else if(kind==='alarm')showAlarm(); else showAlert();
  updateBells();
}
function closeWidget(kind){
  const b=document.getElementById(kind==='alarm'?'alarmBox':'alertBox');
  if(b)b.style.display='none';
  clearTimeout(kind==='alarm'?alarmTimer:alertTimer);
  updateBells();
}
function updateBells(){
  const set=(btn,cnt,list,box)=>{
    const b=document.getElementById(btn); if(!b)return;
    b.style.display=list.length?'inline-block':'none';
    const c=document.getElementById(cnt); if(c)c.textContent=list.length;
    const open=document.getElementById(box) && document.getElementById(box).style.display==='block';
    b.classList.toggle('ring',!open&&list.length>0);
  };
  set('alarmBtn','alarmCount',alarmList,'alarmBox');
  set('alertBtn','alertCount',alertList,'alertBox');
  fitTabs();
}
function startAlarms(){
  loadNotify(); tickAlarms();
  clearInterval(tickTimer); tickTimer=setInterval(tickAlarms,30000);
}
document.getElementById('alarmBtn').addEventListener('click',()=>showAlarm());
document.getElementById('alertBtn').addEventListener('click',()=>showAlert());
document.getElementById('alarmBox').addEventListener('click',e=>{
  if(e.target.closest('[data-wclose]')){closeWidget('alarm');return;}
  const x=e.target.closest('[data-wdel]');if(x)removeNotify('alarm',x.dataset.wdel);
});
document.getElementById('alertBox').addEventListener('click',e=>{
  if(e.target.closest('[data-wclose]')){closeWidget('alert');return;}
  const x=e.target.closest('[data-wdel]');if(x)removeNotify('alert',x.dataset.wdel);
});

/* ---------- Excel import (monthly roster) ---------- */
let pendingWb=null;
/* อ่านชีตหนึ่ง ๆ ให้เป็นตารางกะ — แก้บั๊ก array มีรู (ช่อง A1 ว่าง) ด้วย Array.from */
function parseSheet(wb,name){
  const ws=wb.Sheets[name];
  if(!ws)return {ok:false,msg:'ไม่พบชีต'};
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
  const aoaRaw=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});   /* ไว้อ่านวันที่แบบ serial */
  const cell=(row,idx)=>{const v=row?row[idx]:undefined;return v==null?'':String(v).trim();};
  let hi=-1;
  for(let r=0;r<Math.min(aoa.length,30);r++){
    const arr=Array.from(aoa[r]||[],c=>String(c==null?'':c));
    if(arr.some(c=>c.indexOf('เบอร์รถ')>=0)&&arr.some(c=>c.indexOf('รายชื่อ')>=0||c.indexOf('ชื่อ')>=0)){hi=r;break;}
  }
  if(hi<0)return {ok:false,msg:'ไม่พบหัวตาราง (ต้องมีคอลัมน์ “เบอร์รถ” และ “รายชื่อ”)'};
  const H=Array.from(aoa[hi]||[],c=>String(c==null?'':c).trim());
  const col=k=>H.findIndex(h=>h.indexOf(k)>=0);
  const cRoute=col('เส้นทาง'),cTruck=col('เบอร์รถ'),cOrder=col('ลำดับ'),cCode=col('รหัส'),
        cName=col('รายชื่อ'),cPhone=col('เบอร์โทร'),cProd=col('สินค้า'),cOff=col('off'),
        cTime=H.findIndex(h=>h.indexOf('1-15')>=0||h.indexOf('ครึ่งเดือนแรก')>=0||(h.indexOf('วันที่')>=0&&h.indexOf('เปลี่ยน')<0));
  const cChg=H.findIndex(h=>h.indexOf('เปลี่ยน')>=0);
  const cTime2=H.findIndex((h,ix)=>ix!==cTime&&(h.indexOf('16-31')>=0||h.indexOf('ครึ่งเดือนหลัง')>=0||(h.indexOf('วันที่')>=0&&h.indexOf('เปลี่ยน')<0&&ix>cTime)));
  if(cTruck<0||cName<0)return {ok:false,msg:'หาคอลัมน์เบอร์รถหรือรายชื่อไม่เจอ'};
  const trucks={},order=[];let skipped=0;
  for(let r=hi+1;r<aoa.length;r++){
    const row=aoa[r];if(!row)continue;
    const truck=cell(row,cTruck);
    if(truck.indexOf('EV')!==0){if(cell(row,cName))skipped++;continue;}
    if(!trucks[truck]){
      const rt=cell(row,cRoute);
      const ty=(truck==='EV1-033'||truck==='EV1-039')?'vt':(rt.indexOf('เปลือกไม้')>=0?'twelve':'model');
      trucks[truck]={truckNo:truck,routeGroup:rt,product:cell(row,cProd)||'เชื้อเพลิงชีวมวล',type:ty,drivers:[]};
      order.push(truck);
    }
    const nm=cell(row,cName);
    if(nm&&nm!=='Vacant'){
      let pos=cell(row,cOrder);pos=pos.indexOf('Head')>=0?'1':(pos[0]||String(trucks[truck].drivers.length+1));
      const rawRow=aoaRaw[r]||[];
      const chg=(cChg>=0)?(xlDate(rawRow[cChg])||xlDate(cell(row,cChg))):'';
      const sh2=(cTime2>=0)?cell(row,cTime2):'';
      const drv={pos,code:cell(row,cCode).replace('.0',''),name:nm,
        phone:cell(row,cPhone),dayOff:cell(row,cOff).replace('อา.','อาทิตย์'),shift:cell(row,cTime)};
      if(sh2&&chg){drv.shift2=sh2;drv.shiftFrom=chg;}
      trucks[truck].drivers.push(drv);
    }
  }
  let roster=order.map(t=>trucks[t]);
  EXTRA.forEach(x=>{if(!roster.find(t=>t.truckNo===x.truckNo))roster.push(x);});
  const drv=roster.reduce((a,t)=>a+(t.drivers||[]).length,0);
  const noShift=roster.reduce((a,t)=>a+(t.drivers||[]).filter(d=>!d.shift).length,0);
  const noOff=roster.reduce((a,t)=>a+(t.drivers||[]).filter(d=>!d.dayOff).length,0);
  const chgN=roster.reduce((a,t)=>a+(t.drivers||[]).filter(d=>d.shiftFrom).length,0);
  const chgDates=[...new Set([].concat.apply([],roster.map(t=>(t.drivers||[]).map(d=>d.shiftFrom).filter(Boolean))))].sort();
  return {ok:roster.length>=5,msg:roster.length<5?('อ่านได้แค่ '+roster.length+' คัน โครงไฟล์อาจต่างจากที่รองรับ'):'',

/* ==================== TAB 6: Dashboard ====================
   ดึงข้อมูลรายวันหลายวันมารวม แล้วสรุปเป็นภาพ · ไม่แตะหน้า 1-5 */
let dashDays=7, dashTab='overview', dashCache={}, dashBusy=false, dashDone=0, dashNeed=0;
let dashPickDay='';
let dashFrom='', dashTo='';        /* ถ้ากรอกครบทั้งคู่ = ใช้ช่วงที่เลือกเอง */
const DASH_MAX_DAYS=92;            /* กันเลือกช่วงยาวเกินจนโหลดหนัก */

function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dashDateList(){
  const out=[];
  if(dashFrom&&dashTo){                                    /* ช่วงที่เลือกเอง */
    let a=new Date(dashFrom+'T00:00:00'), b=new Date(dashTo+'T00:00:00');
    if(isNaN(a.getTime())||isNaN(b.getTime()))return [curDate];
    if(a>b){const t=a;a=b;b=t;}
    let cur=a, guard=0;
    while(cur<=b&&guard++<DASH_MAX_DAYS){out.push(dstr(cur));cur=new Date(cur.getTime()+86400000);}
    return out;
  }
  const end=new Date(curDate+'T00:00:00');
  for(let i=dashDays-1;i>=0;i--)out.push(dstr(new Date(end.getTime()-i*86400000)));
  return out;
}
function dashCustom(){return !!(dashFrom&&dashTo);}
/* โหลดข้อมูลหลายวัน — อ่านของในเครื่องก่อน แล้วดึงที่ขาดทีละชุด */
async function dashLoad(force){
  if(dashBusy)return;
  const dates=dashDateList();
  if(force)dates.forEach(d=>{delete dashCache[d];});
  dates.forEach(ds=>{
    if(dashCache[ds]!==undefined)return;
    const raw=lsGet('fleetdb:fleet:day:'+ds);
    if(raw){try{const o=JSON.parse(raw);if(o&&typeof o==='object'){normDay(o);dashCache[ds]=o;}}catch(e){}}
  });
  const need=dates.filter(ds=>dashCache[ds]===undefined);
  dashNeed=need.length; dashDone=0;
  if(!need.length){renderDash();return;}
  dashBusy=true; renderDash();
  for(let i=0;i<need.length;i+=4){
    const batch=need.slice(i,i+4);
    await Promise.all(batch.map(async ds=>{
      let raw=null;
      try{raw=await dayFetch(ds);}catch(e){}
      if(raw===null||raw===undefined){try{raw=await store.get('fleet:day:'+ds);}catch(e){}}
      let o=null; if(raw){try{o=JSON.parse(raw);}catch(e){}}
      if(o&&typeof o==='object'){normDay(o);dashCache[ds]=o;} else dashCache[ds]=null;
      dashDone++;
    }));
    if(tab==='dash')renderDash();
  }
  dashBusy=false; if(tab==='dash')renderDash();
}

function rosterOn(ds){
  const v=rosterFor(ds);
  return (v&&Array.isArray(v.roster))?v.roster:config;
}
/* ---------- รวมข้อมูลทั้งช่วง ---------- */
function dashAgg(){
  const dates=dashDateList();
  const A={dates:dates,daily:[],haveDays:0,
    att:{sched:0,present:0,late:0,absent:0,leave:0,ot:0,off:0,unchecked:0},
    trips:0,closed:0,plan:0,byType:{},prod:{},origin:{},truck:{},driver:{},
    hours:[],over8:0,hitTrucks:0,trucksSeen:{},wt:{}};
  WT_GROUPS.forEach(x=>A.wt[x.k]={ok:0,over:0,sum:0,n:0});
  JOBTYPES.forEach(t=>A.byType[t.k]=0);
  dates.forEach(ds=>{
    const day2=dashCache[ds];
    const row={ds:ds,trips:0,closed:0,present:0,absent:0,late:0,leave:0,ot:0,off:0,unchecked:0,sched:0,hours:0,hoursN:0,plan:0,types:{},wt:{},noData:false};
    WT_GROUPS.forEach(x=>row.wt[x.k]={ok:0,over:0});
    if(!day2){row.noData=true;A.daily.push(row);return;}
    A.haveDays++;
    /* --- คน --- */
    const rs=rosterOn(ds);
    for(const t of rs)for(const d of (t.drivers||[])){
      const off=isOff(t,d,ds);
      const v=((day2.attend||{})[t.truckNo]||{})[d.pos]||'';
      if(off){A.att.off++; row.off++; if(v==='ot'){A.att.ot++;A.att.present++;row.present++;row.ot++;} continue;}
      A.att.sched++; row.sched++;
      if(v==='present'){A.att.present++;row.present++;}
      else if(v==='late'){A.att.present++;A.att.late++;row.present++;row.late++;}
      else if(v==='ot'){A.att.present++;A.att.ot++;row.present++;row.ot++;}
      else if(v==='absent'){A.att.absent++;row.absent++;}
      else if(v==='leave'){A.att.leave++;row.leave++;}
      else {A.att.unchecked++;row.unchecked++;}
      if(v==='absent'||v==='late'||v==='leave'){
        const nm=d.name||'-';
        A.driver[nm]=A.driver[nm]||{absent:0,late:0,leave:0,name:nm,code:d.code||''};
        if(v==='absent')A.driver[nm].absent++; else if(v==='late')A.driver[nm].late++; else A.driver[nm].leave++;
      }
    }
    /* --- แผนงาน --- */
    Object.keys(day2.plan||{}).forEach(k=>{
      const num=Number(day2.plan[k]);
      if(isFinite(num)&&num>0){A.plan+=num;row.plan+=num;}
    });
    /* --- เที่ยว / เส้นทาง / รถ / เวลา --- */
    const per={};
    (day2.jobs||[]).forEach(j=>{
      A.trips++; row.trips++;
      const gk=JOBTYPES.some(t=>t.k===j.type)?j.type:'main';
      A.byType[gk]=(A.byType[gk]||0)+1;
      row.types[gk]=(row.types[gk]||0)+1;
      const p=(j.product||'(ไม่ระบุ)').trim(); A.prod[p]=(A.prod[p]||0)+1;
      const o=(j.origin||'(ไม่ระบุ)').trim(); A.origin[o]=(A.origin[o]||0)+1;
      const tk=j.mainTruck||j.truck||'-'; A.truck[tk]=(A.truck[tk]||0)+1; per[tk]=(per[tk]||0)+1; A.trucksSeen[tk]=1;
      if(j.closed){
        A.closed++; row.closed++;
        const wb=workBreakdown(j);
        if(wb.total>0){A.hours.push(wb.total);row.hours+=wb.total;row.hoursN++;}
        const wk=workGroup(j), g=A.wt[wk];
        if(wb.total>0){g.n++;g.sum+=wb.total;
          if(wb.total>workLimit(j)){g.over++;A.over8++;row.wt[wk].over++;}else{g.ok++;row.wt[wk].ok++;}}
      }
    });
    Object.keys(per).forEach(tk=>{if(per[tk]>=TARGET_ROUNDS)A.hitTrucks++;});
    A.daily.push(row);
  });
  A.hoursAvg=A.hours.length?(A.hours.reduce((a,b)=>a+b,0)/A.hours.length):0;
  A.attRate=A.att.sched?(A.att.present/A.att.sched*100):0;
  A.tripsPerDay=A.haveDays?(A.trips/A.haveDays):0;
  return A;
}
/* ---------- ชิ้นส่วนกราฟ ---------- */
function dBars(obj,limit,color,unit){
  const all=Object.keys(obj).map(k=>[k,obj[k]]).sort((a,b)=>b[1]-a[1]);
  const arr=all.slice(0,limit||8);
  if(!arr.length)return '<div class="cno">ไม่มีข้อมูล</div>';
  const max=arr[0][1]||1, sum=all.reduce((a,b)=>a+b[1],0);
  const u=unit||'';
  return arr.map(([k,v],i)=>{
    const tip=k+' : '+v+u+(sum?(' ('+Math.round(v/sum*100)+'% ของทั้งหมด '+sum+u+')'):'')+' · อันดับที่ '+(i+1);
    return `<div class="drow" title="${esc(tip)}">
      <div><div style="margin-bottom:3px">${esc(k)}</div>
        <div class="dbar2"><i style="width:${Math.round(v/max*100)}%${color?(';background:'+color):''}"></i></div></div>
      <div class="dnum">${v}</div></div>`;}).join('');
}

function dayDetailText(r){
