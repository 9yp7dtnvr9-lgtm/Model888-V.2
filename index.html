<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>ศูนย์กำกับงานขนส่ง EV — BU4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --nav:#0f2138;--nav2:#1a3050;--line:#e2e7ee;--surface:#f3f6f9;--card:#fff;--ink:#152238;--muted:#65728a;
    --m:#d99a1e;--m-bg:#fbf3da;--a:#2f8f6b;--a-bg:#e6f3ec;--n:#3a4f86;--n-bg:#e8ebf5;
    --present:#1f9d55;--present-bg:#e5f4ea;--absent:#d6483f;--absent-bg:#fbe9e7;--leave:#8b93a4;--leave-bg:#eef0f4;--off:#a6791f;--off-bg:#f6efdc;--ot:#e0a417;--ot-bg:#fbf1d6;
    --go:#1f9d55;--stop:#c9ccd4;--accent:#1f9d55;--accent2:#f6c445;--radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",system-ui,sans-serif;background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased}
  .mono{font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-variant-numeric:tabular-nums}
  h1,h2,h3,.display{font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif}
  header{background:var(--nav);color:#fff;padding:13px 1cm;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px rgba(246,196,69,.25);flex:none}
  .brand h1{font-size:18px;font-weight:600;margin:0;line-height:1.1}
  .brand small{display:block;color:#9fb0c6;font-size:12px;margin-top:2px}
  .topspace{flex:1}
  .datebox{display:flex;align-items:center;gap:8px;background:var(--nav2);padding:7px 12px;border-radius:10px}
  .datebox label{font-size:12px;color:#9fb0c6}
  .datebox input{border:0;background:transparent;color:#fff;font-family:inherit;font-size:14px}
  .datebox input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7;cursor:pointer}
  .saveflag{font-size:12px;color:#7fd6a8;min-width:92px;text-align:right}
  .saveflag.saving{color:#f0c66b}
  .adminchip{display:flex;align-items:center;gap:8px;background:var(--nav2);padding:6px 12px;border-radius:10px;font-size:13px;color:#dfe7f1}
  .adminchip .linkish{background:none;border:0;color:var(--accent2);cursor:pointer;font-family:inherit;font-size:12px;text-decoration:underline}
  .adminchip .loginbtn{background:var(--accent2);color:#20130a;border:0;border-radius:8px;padding:5px 12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  nav.tabs{background:var(--nav2);display:flex;gap:2px;padding:0 1cm;overflow-x:auto;position:sticky;top:var(--hh,56px);z-index:39;box-shadow:0 2px 8px rgba(15,33,56,.18)}
  nav.tabs button{background:transparent;border:0;color:#93a4bc;font-family:inherit;font-size:14px;padding:12px 15px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
  nav.tabs button .num{font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-size:12px;background:rgba(255,255,255,.08);padding:1px 7px;border-radius:20px}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--accent2)}
  main{padding:18px 1cm 12px;max-width:none;margin:0}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;position:relative;overflow:hidden}
  .stat .lab{font-size:12px;color:var(--muted);margin-bottom:4px}
  .stat .val{font-size:25px;font-weight:600;line-height:1}
  .stat .val small{font-size:14px;color:var(--muted);font-weight:400}
  .stat.hero{background:var(--nav);color:#fff;border-color:var(--nav)}
  .stat.hero .lab{color:#9fb0c6}
  .stat .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent2)}
  .stat.go .val{color:var(--present)}.stat.miss .val{color:var(--absent)}.stat.lv .val{color:var(--leave)}.stat.gap .val{color:var(--accent)}.stat.ot .val{color:var(--ot)}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
  .toolbar input[type=search]{flex:1;min-width:170px;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-family:inherit;font-size:14px;background:var(--card)}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 13px;font-family:inherit;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
  .btn:hover{border-color:#bcc4d2}
  .btn.solid{background:var(--nav);color:#fff;border-color:var(--nav)}
  .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary{background:var(--go);color:#fff;border-color:var(--go)}
  .pill{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .pill.active{background:var(--nav);color:#fff;border-color:var(--nav)}
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
  .tablewrap.scroll{max-height:calc(100vh - 320px)}
  .tablewrap.sbox{max-height:340px;overflow:auto}
  .tablewrap.sbox5{max-height:206px;overflow:auto}
  .tablewrap.sbox10{max-height:472px;overflow:auto}
  .tablewrap.sbox10{max-height:472px;overflow:auto}
  tr.aheadrow{background:#fbf3da}
  tr.nowrow{background:#e6f3ec}
  .cardhead{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .cardhead h2{margin:0;flex:1}
  .btn.mini{padding:5px 11px;font-size:13px}
  .roundsum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .rchip{font-size:12.5px;background:#f3f6f9;border:1px solid var(--line);border-radius:20px;padding:5px 12px;color:var(--muted)}
  .rchip b{font-size:15px;color:var(--ink);margin:0 2px}
  .rchip.ok{background:var(--present-bg);border-color:#b8e0c6;color:var(--present)}
  .rchip.ok b{color:var(--present)}
  .rchip.warn{background:var(--m-bg);border-color:#e6cf94;color:var(--off)}
  .rchip.warn b{color:var(--off)}
  .rchip.bad{background:var(--absent-bg);border-color:#f0c2bd;color:var(--absent)}
  .rchip.bad b{color:var(--absent)}
  .rsep{width:1px;height:20px;background:var(--line)}
  /* ชิปที่กดกรองตารางได้ */
  .rchip.pick{cursor:pointer;user-select:none;transition:box-shadow .12s,transform .06s}
  .rchip.pick:hover{box-shadow:0 1px 5px rgba(20,40,70,.16)}
  .rchip.pick:active{transform:translateY(1px)}
  .rchip.pick.on{box-shadow:inset 0 0 0 2px currentColor;font-weight:700}
  .rchip.clearf{cursor:pointer;background:#fff;border-style:dashed;color:var(--muted);font-weight:600}
  .rchip.clearf:hover{background:#f3f6f9}
  th.th-sort{cursor:pointer;user-select:none;white-space:nowrap}
  th.th-sort:hover{background:#eef2f7;color:var(--ink)}
  th.th-sort.on{color:var(--ink)}
  .sortcaret{font-size:9px;margin-left:4px;opacity:.45}
  th.th-sort.on .sortcaret{opacity:1;color:var(--accent)}
  .tablewrap.sbox thead th{box-shadow:0 1px 0 var(--line)}
  .grouphdr td{position:sticky;background:var(--n-bg);color:var(--n);font-weight:600;font-size:12.5px;padding:6px 12px;border-bottom:1px solid var(--line);top:39px;z-index:1}
  .otbtn{border:1px solid var(--ot);background:var(--ot-bg);color:var(--ot);border-radius:7px;padding:3px 9px;font-size:12px;cursor:pointer;font-family:inherit;margin-top:5px}
  .otyes{font-size:11px;color:var(--ot);background:var(--ot-bg);border:1px solid #e6cf94;border-radius:6px;padding:2px 7px;display:inline-block;margin-right:5px}
  .edrow td{padding:7px 10px}
  .edrow input,.edrow select{border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-family:inherit;font-size:13px;background:#fff}
  .edtruck{background:#f7f9fc}
  .edtruck td{font-weight:600;border-top:2px solid var(--line)}
  .miniadd{border:1px dashed #b7c0cf;background:#fff;border-radius:7px;padding:4px 10px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--accent)}
  .arrivein{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-size:13px;background:#fff}
  .arrivein:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
  .planlink{border:1px solid var(--accent);background:var(--present-bg);color:var(--accent);border-radius:8px;padding:6px 11px;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500}
  .planlink:hover{background:var(--accent);color:#fff}
  .planlink.done{border-color:var(--line);background:#f1f4f8;color:var(--muted);font-weight:400;cursor:default}
  .planlink.done:hover{background:#f1f4f8;color:var(--muted);border-color:var(--line)}
  .actualin{border:1px solid var(--accent2);border-radius:7px;padding:4px 7px;font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-size:12px;background:#fffdf3;width:92px}
  .omsbtn{border:0;background:transparent;cursor:pointer;padding:2px;font-family:inherit}
  .omsbtn:hover{opacity:.75}
  .jsel{border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-family:inherit;font-size:12.5px;background:#fff;max-width:168px}
  .jsel:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
  .jsel:hover{border-color:#bcc4d2}
  .noteinp{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-family:inherit;font-size:12px;background:#fff;width:150px}
  .noteinp:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
  .departin{border:1px solid var(--accent2);border-radius:7px;padding:4px 6px;font-family:"Leelawadee UI","Leelawadee","IBM Plex Sans Thai",sans-serif;font-size:12px;background:#fffdf3}
  .departin:focus{outline:2px solid var(--accent2)}
  tr.jrow{cursor:pointer}
  tr.jrow:hover{background:#eef4fb!important}
  .dgrid{display:grid;grid-template-columns:132px 1fr;gap:7px 14px;font-size:13.5px;align-items:baseline}
  .dgrid .lb{color:var(--muted);font-size:12.5px}
  .dsec{margin:14px 0 6px;font-size:12.5px;font-weight:600;color:var(--n);border-bottom:1px solid var(--line);padding-bottom:5px}
  .dbig{font-size:16px;font-weight:600}
  .woin{min-width:130px;min-height:34px;resize:both;overflow:auto;font-size:12.5px;line-height:1.5}
  .tag.tseq{background:#eef4fb;color:#2b6cb0;border-color:#c9dcf0;font-weight:600}
  .rin{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-family:inherit;font-size:13px;background:#fff}
  .rin:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
  /* ---------- Dashboard (หน้า 6) ---------- */
  .dwrap{display:flex;flex-direction:column;gap:14px}
  .dbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .dseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .dseg button{border:0;background:#fff;padding:7px 13px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--ink);border-right:1px solid var(--line)}
  .dseg button:last-child{border-right:0}
  .dseg button.on{background:var(--nav);color:#fff;font-weight:600}
  .dgrid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .dcard .k{font-size:12px;color:var(--muted);letter-spacing:.2px}
  .dcard .v{font-size:26px;font-weight:700;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
  .dcard .s{font-size:12px;color:var(--muted);margin-top:3px}
  .dcard.hero{background:linear-gradient(135deg,var(--nav),#20406b);border-color:var(--nav)}
  .dcard.hero .k,.dcard.hero .s{color:#c9d7ea}
  .dcard.hero .v{color:#fff}
  /* min-width:0 สำคัญมาก — ไม่มีอันนี้ กล่องจะยืดตามความกว้างกราฟ (flex/grid min-width:auto)
     ทำให้กราฟวันมาก ๆ ดันหน้าเว็บทะลุออกข้างทั้งหน้า แทนที่จะเลื่อนอยู่ในกล่องของตัวเอง */
  .dpanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;overflow:hidden}
  .dpanel h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .dpanel h3 .cno{font-weight:400}
  .drow{display:grid;grid-template-columns:1fr 62px;gap:8px;align-items:center;padding:5px 0;font-size:13px}
  .dbar2{height:9px;border-radius:6px;background:#eef1f6;overflow:hidden}
  .dbar2 i{display:block;height:100%;border-radius:6px;background:var(--accent)}
  .dnum{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
  .dtwo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .dthree{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}   /* 1.4 สาย/ลา/ขาด 3 ตาราง (2026-08-19) */
  /* หัวข้อ Section ของหน้า 6 (รวมเป็นหน้าเดียว 2026-08-17) */
  .dsech{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 -2px;
         padding-bottom:8px;border-bottom:2px solid var(--nav2);scroll-margin-top:8px}
  .dsech h2{margin:0;font-size:17px;color:var(--ink);font-weight:700}
  .dsecn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
         border-radius:8px;background:var(--nav2);color:#fff;font-size:14px;font-weight:700;flex:none}
  .dsech:first-child{margin-top:0}
  .dsub{font-size:14px;font-weight:600;color:var(--ink);margin:4px 0 -4px}
  /* รายงาน "รถ 0 เที่ยว" */
  tr.zrow{cursor:pointer}
  tr.zrow:hover td{background:#eef4fb}
  tr.zrow.on td{background:#e4eefb;font-weight:600}
  .zstrip{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
  /* ช่องหมายเหตุในตาราง 2.3 — ให้ดูเป็นช่องพิมพ์ได้ชัด ๆ แต่ไม่แย่งสายตาจากตัวเลข (2026-08-19) */
  input.znote{width:100%;min-width:120px;box-sizing:border-box;font:inherit;font-size:12px;
    padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
  input.znote::placeholder{color:var(--muted);font-style:italic}
  input.znote:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(42,120,214,.15)}
  tr.zrow.on input.znote{background:#fff}

  .ztick{width:12px;height:20px;border-radius:3px;flex:none}
  .dtwo>*,.dthree>*,.dgrid4>*{min-width:0}                 /* กันช่องกริดยืดตามเนื้อหาที่กว้างเกิน */
  .dwrap>*{min-width:0}
  .dsvg{display:block}         /* ไม่ยืด width:100% แล้ว — ใช้ขนาดจริงตาม viewBox เท่านั้น กันจุด/ตัวเลข/เส้นถูกขยายเบลอเวลาข้อมูลน้อยวัน */
  /* กราฟกว้างกว่ากล่อง (วันมาก) = เลื่อนดูข้างได้ ไม่บีบจนอ่านไม่ออก และไม่ดันหน้าเว็บทะลุ */
  .dscroll{overflow-x:auto;overflow-y:hidden;max-width:100%;min-width:0;-webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scrollbar-color:#c3cbd8 transparent;padding-bottom:2px}
  .dscroll::-webkit-scrollbar{height:9px}
  .dscroll::-webkit-scrollbar-thumb{background:#c3cbd8;border-radius:6px}
  .dscroll::-webkit-scrollbar-track{background:transparent}
  /* กราฟที่แคบกว่ากล่อง ให้อยู่กลางกล่อง ไม่กองอยู่ริมซ้าย (2026-08-17)
     ถ้ากราฟกว้างกว่ากล่อง margin:auto ไม่มีผล ยังเลื่อนดูข้างได้เหมือนเดิม */
  .dscroll>svg.dsvg{display:block;margin-left:auto;margin-right:auto}
  .zerohead{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 8px;flex-wrap:wrap}
  .zerohead .cno:first-child{margin-right:auto}   /* ข้อความจำนวนรถชิดซ้าย · ปุ่มเลือกไปอยู่มุมขวา */
  .zerowrap{overflow:auto;-webkit-overflow-scrolling:touch}
  .zerowrap thead th{position:sticky;top:0;z-index:2;background:var(--card,#fff);box-shadow:0 1px 0 #e4e9f0}
  .dpt{cursor:pointer}
  .dpt rect{pointer-events:all}
  .dpt:hover circle{r:5.5}
  .drow[title]{cursor:help}
  .rchip.outbox{cursor:pointer;background:#eef4fb;color:#1f5fa8;border-color:#bcd6f2;font-weight:600}
  .rchip.outbox:hover{background:#dfeaf7}
  .tag.m1212{background:#eaf3ff;color:#1f5fa8;border-color:#bcd6f2;font-weight:600}
  .dpick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:4px 9px;font-size:12.5px;background:#fff}
  .dpick.on{border-color:var(--accent);background:var(--present-bg)}
  .dpick input[type=date]{border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-family:inherit;font-size:12.5px}
  .dchip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);background:#fff}
  /* Section 5 · รายบุคคลย้อนหลัง (2026-08-28) */
  .hcaret{display:inline-block;font-size:11px;color:var(--accent);transition:transform .15s}
  .hcaret.on{transform:rotate(90deg)}
  tr.hdetail{background:#f8fafc}
  tr.hdetail td{border-bottom:1px solid var(--line)}
  .dload{height:4px;border-radius:4px;background:#e8edf4;overflow:hidden}
  .dload i{display:block;height:100%;background:var(--accent);transition:width .25s}
  @media(max-width:1100px){.dthree{grid-template-columns:1fr 1fr}}
  @media(max-width:820px){.dtwo,.dthree{grid-template-columns:1fr}}
  @media(max-width:900px){          /* จอเล็ก/มือถือ: 1 ซม. สองข้างยังกินจอไป */
    main{padding:12px 10px 10px}
    footer{padding:8px 10px 16px}
    header{padding:11px 12px}
    nav.tabs{padding:0 8px}
  }
  @media print{
    header,nav.tabs,footer{display:none!important}
    .dbar .dtabs,.dbar button,.dbar select,.dbar input{display:none!important}   /* ซ่อนปุ่ม/แท็บ แต่คงป้ายช่วงวันที่ไว้บนกระดาษ */
    .dscroll{overflow:visible!important}                                          /* กราฟกว้างต้องไม่ถูกตัด */
    .dscroll svg{max-width:100%!important;height:auto!important}                  /* ย่อให้พอดีหน้ากระดาษ */
    .dcard,.dpanel{break-inside:avoid;border-color:#bbb}
    body{background:#fff}
  }
  .planin{width:74px;text-align:center;border:1px solid var(--accent2);border-radius:7px;padding:5px 6px;font-family:inherit;font-size:13px;background:#fffdf3;font-variant-numeric:tabular-nums}
  .planin:focus{outline:2px solid var(--accent2)}

let routes=[];

function seedRoutes(){
  return ROUTEDATA.map(r=>{
    const def=PROD_DEFAULT[r.product]||[];
    const o=(r.origin&&r.origin.trim())||def[0]||'';
    const d=(r.dest&&r.dest.trim())||def[1]||'';
    let km=r.distance||matchDistanceRule(o,d)||'';
    return {id:ruid(),product:r.product||'',origin:o,dest:d,distance:String(km||''),
            type:(km&&+km<=100)?'vt':(r.type||'main')};
  });

function validRoutes(a){return Array.isArray(a)&&a.every(r=>r&&typeof r==='object'&&'product' in r);}
async function loadRoutes(){

  /* ลำดับ: ชีต -> คีย์เดิมบนระบบกลาง -> สำรองในเครื่อง -> ชุดตัวอย่าง */
  if(backendURL){
    try{
      const r=await fetch(backendURL+'?routes=live&t='+Date.now()+tk());
      const d=await r.json();
      if(d&&Array.isArray(d.list)&&d.list.length){routes=routesStripDeleted(d.list);routesRev=d.rev||'';lsSet('fleetdb:fleet:routes',JSON.stringify(routes));return;}
    }catch(e){}
  }
  let raw=null;
  try{raw=await store.get('fleet:routes');}catch(e){raw=null;}
  if(raw===null||raw===undefined||raw===''){try{raw=lsGet('fleetdb:fleet:routes');}catch(e){}}
  let r=null; if(raw){try{r=JSON.parse(raw);}catch(e){r=null;}}
  if(validRoutes(r)&&r.length){routes=r;return;}
  /* แก้บัคเดียวกับตารางกะ (2026-08-06): เดิมถ้าดึงพลาด/ยังไม่มีข้อมูล จะ seed แล้วบันทึกทับระบบกลางทันที —
     เน็ตสะดุดแวบเดียวตอนใครโหลดหน้าเว็บ ก็ลบทะเบียนเส้นทางจริงของทุกคนได้ ตอนนี้ไม่บันทึกทับจากการโหลดอีกต่อไป
     ถ้ามีของเดิมอยู่ในเครื่องนี้แล้ว (โหลดสำเร็จมาก่อนหน้านี้) ใช้อันนั้นต่อไปก่อน ไม่ต้องทำอะไร */
  if(routes.length)return;
  routes=seedRoutes();      /* ไม่มีอะไรเลยจริง ๆ -> แสดง seed ไปก่อน จะบันทึกจริงตอนผู้ใช้แก้ไข/เพิ่มเส้นทางเอง */
}

async function routesSyncNow(){
  if(!backendURL){await store.set('fleet:routes',JSON.stringify(routes));routesDirty=false;return true;}
  if(routesSyncing){routesDirty=true;return false;}
  routesSyncing=true;
  try{
    const r=await fetch(backendURL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({routesSync:JSON.stringify(routes),routesDel:JSON.stringify(routesDel),by:adminName||'',tk:API_TOKEN})});
    const d=await r.json();
    routesSyncing=false;
    if(!d||d.error||d.ok===false){lastWriteErr=String((d&&(d.error||d.message))||'ซิงก์แผนเส้นทางไม่สำเร็จ');return false;}
    if(Array.isArray(d.list)){routes=d.list;routesRev=d.rev||'';}
    routesDel=[];routesDelSave();          /* เซิร์ฟเวอร์รับคำสั่งลบไปแล้ว ล้างคิวได้ */
    routesDirty=false;
    lsSet('fleetdb:fleet:routes',JSON.stringify(routes));        /* สำรองในเครื่อง เผื่อเน็ตหลุดครั้งต่อไป */
    const bits=[];
    if(d.sheetWiped)bits.push('แท็บในชีตว่าง/ถูกล้าง — เขียนขึ้นใหม่จากหน้าเว็บ '+(d.rows||routes.length)+' เส้นทาง');
    if(d.deleted)bits.push('ลบออกจากชีต '+d.deleted+' เส้นทาง');
    if(d.fromSheet)bits.push('รับจากชีต '+d.fromSheet+' รายการ');
    if(d.conflicts)bits.push('แก้ช่องเดียวกันทั้งสองฝั่ง '+d.conflicts+' ช่อง (ใช้ค่าจากหน้าเว็บ)');
    routesLastMsg=bits.join(' · ');
    return true;
  }catch(e){routesSyncing=false;lastWriteErr='ต่อระบบกลางไม่ได้';return false;}
}
async function saveRoutes(){
  const ok=await routesSyncNow();
  if(!ok){routesDirty=true;try{lsSet('fleetdb:fleet:routes',JSON.stringify(routes));}catch(e){}}
  return ok;
}
let rsT=null,rsRetry=0;
function scheduleRoutesSave(){
  flag('saving');clearTimeout(rsT);
  rsT=setTimeout(async()=>{
    rsT=null;
    const ok=await saveRoutes();
    flag(ok?'ok':'err');
    updatePlanHint();
    if(ok){
      rsRetry=0;
      /* วาดตารางใหม่เฉพาะเมื่อ CC ไม่ได้พิมพ์อยู่ (เซิร์ฟเวอร์อาจรวมค่าจากชีตกลับมาด้วย) */
      if(tab==='plan'&&!planBusyTyping()){renderPlan();}
      else if(tab==='plan'){renderPlanCounts();}
    }
    else{                                        /* ล้มเหลวต้องลองใหม่เอง ไม่ปล่อยค้าง */
      rsRetry=Math.min(rsRetry+1,6);
      if(!rsT)rsT=setTimeout(()=>{rsT=null;scheduleRoutesSave();},Math.min(30000,2000*Math.pow(2,rsRetry-1)));
    }
  },400);
}

async function pullRoutesFromSheet(){

    if(!Array.isArray(d.list)){flag('err');alert('ชีตตอบข้อมูลไม่ถูกรูปแบบ');return;}

/* เช็คเป็นระยะว่ามีคนแก้ในชีตหรือไม่ (ใช้แค่ลายเซ็นสั้น ๆ ไม่ดึงทั้งก้อน) */
async function pollRoutes(){
  if(!backendURL||editMode||routesSyncing||routesDirty)return;
  if(busyTyping())return;      /* เพิ่งพิมพ์ไม่ถึง 8 วิ อย่าไปกวน (ไม่ใช้การเช็คโฟกัส เพราะถ้า CC ทิ้งเคอร์เซอร์ค้างไว้จะไม่ดึงจากชีตเลย) */
  let d=null;
  try{const r=await fetch(backendURL+'?routesrev=1&t='+Date.now()+tk());d=await r.json();}catch(e){return;}
  if(!d||d.ok===false||!d.rev)return;
  if(routesRev&&d.rev===routesRev)return;
  try{
    const r2=await fetch(backendURL+'?routes=live&t='+Date.now()+tk());
    const d2=await r2.json();
    if(d2&&Array.isArray(d2.list)){
      const fresh=routesStripDeleted(d2.list);
      const changed=JSON.stringify(fresh)!==JSON.stringify(routes);
      routes=fresh;routesRev=d2.rev||'';
      lsSet('fleetdb:fleet:routes',JSON.stringify(routes));
      if(changed){
        routesLastMsg='มีการแก้ในชีต — โหลดชุดล่าสุดแล้ว';
        if(tab==='plan'&&!planBusyTyping())renderPlan(); else updatePlanHint();
      }
    }
  }catch(e){}
}

/* ระยะทาง: ดูจากทะเบียนก่อน ถ้าไม่มีค่อยใช้กฎเดิม */
function matchDistance(o,d){
  o=(o||'').trim();d=(d||'').trim();
  const hit=routes.find(r=>(r.origin||'').trim()===o&&(r.dest||'').trim()===d&&r.distance);
  if(hit)return +hit.distance;
  const one=routes.find(r=>(r.origin||'').trim()===o&&r.distance);
  if(one&&!d)return +one.distance;
  return matchDistanceRule(o,d);
}
/* กฎสำรอง (ใช้เมื่อยังไม่มีในทะเบียน) */
function matchDistanceRule(o,d){
  o=o||'';d=d||'';const H=(s,k)=>s.indexOf(k)>=0;
  const plant=H(d,'โรงไฟฟ้า'),jc=H(d,'JC'),ev=H(d,'EV');
  if(H(o,'วังจันทร์')&&plant)return 140;
  if((H(o,'นครหลวง')||H(o,'โชคชัย'))&&plant)return 135;
  if(H(o,'ปักธงชัย')&&plant)return 135;
  if(H(o,'บางปะกง')&&plant)return 110;
  if(jc)return 135;
  if(H(o,'วัฒนานคร')&&ev)return 135;
  if(H(o,'ศาลาลำดวน'))return 60;
  if(H(o,'ปางสีดา'))return 70;
  return '';
}

/* ============ ระบบบันทึกแบบส่งเฉพาะช่องที่แก้ (patch ops) ============
   เดิมส่งข้อมูลทั้งวันขึ้นไปทับ -> ค่าที่ CC คนอื่นเพิ่งแก้ถูกค่าเก่าในเครื่องเราทับ
   ตอนนี้ส่งเฉพาะ "ช่องที่เราแก้จริง" เซิร์ฟเวอร์เอาไปทาบบนข้อมูลล่าสุด
   -> คนละช่อง/คนละคัน/คนละงาน บันทึกพร้อมกันได้ ไม่มีใครหาย            */
let pendingOps=[];
const CELL_SEC={attend:1,arrive:1,attendBy:1,dnote:1,attMeta:1};   /* attMeta: ล็อก 'รหัสพจส.|เวลาเข้ากะ' ที่ใช้ตอนกรอก */
const FLAT_SEC={plan:1,running:1,truckNote:1};   /* truckNote: หมายเหตุรถ 0 เที่ยว ในรายงานหน้า 6 — คีย์ตรง = เบอร์รถ */

/* นำ op ไปใช้กับข้อมูลในเครื่อง (ตรรกะเดียวกับฝั่งเซิร์ฟเวอร์) */
function applyOpLocal(doc,op){
  if(!doc||!op||!op.k)return;
  if(op.k==='cell'&&CELL_SEC[op.s]){
    doc[op.s]=doc[op.s]||{};doc[op.s][op.t]=doc[op.s][op.t]||{};doc[op.s][op.t][op.p]=op.v;
  }else if(op.k==='flat'&&FLAT_SEC[op.s]){
    doc[op.s]=doc[op.s]||{};doc[op.s][op.key]=op.v;
  }else if(op.k==='jobset'){
    const j=(doc.jobs||[]).find(x=>String(x.id)===String(op.id));if(j)j[op.f]=op.v;
  }else if(op.k==='jobadd'){
    doc.jobs=doc.jobs||[];
    if(!doc.jobs.some(x=>String(x.id)===String(op.job.id)))doc.jobs.push(JSON.parse(JSON.stringify(op.job)));
  }else if(op.k==='jobdel'){
    doc.deleted=doc.deleted||[];
    if(doc.deleted.indexOf(String(op.id))<0)doc.deleted.push(String(op.id));
    doc.jobs=(doc.jobs||[]).filter(x=>String(x.id)!==String(op.id));
  }else if(op.k==='omsignore'){
    doc.omsIgnore=doc.omsIgnore||[];
    if(doc.omsIgnore.indexOf(String(op.id))<0)doc.omsIgnore.push(String(op.id));
  }else if(op.k==='omsunignore'){
    doc.omsIgnore=(doc.omsIgnore||[]).filter(x=>String(x)!==String(op.id));
  }else if(op.k==='seq'){doc.seq=Math.max(Number(doc.seq)||0,Number(op.v)||0);}
}
/* ทุก op ต้องจำ "วันที่ที่แก้จริง" ติดไปด้วย (op.ds)
   กันบัค: ถ้า CC สลับวันที่ระหว่างที่คำขอบันทึกยังค้างอยู่ ops ของวันเก่าต้องไม่ไปลงวันใหม่ */
function pushOp(op){pendingOps.push({ds:curDate,op:op});applyOpLocal(day,op);}
/* นำ ops ที่ยังไม่ได้ส่ง (เฉพาะของวันที่กำลังดูอยู่) ทาบกลับลงบนข้อมูลที่เพิ่งโหลดมา */
function reapplyPending(){pendingOps.forEach(it=>{if(it&&it.ds===curDate&&it.op)applyOpLocal(day,it.op);});}

/* ตรวจว่าตารางกะที่โหลดมาใช้งานได้จริง ถ้าไม่ ให้กลับไปใช้ของในไฟล์ */
function validConfig(c){
  if(!Array.isArray(c)||!c.length)return false;
  for(const t of c){
    if(!t||typeof t!=='object')return false;
    if(!t.truckNo)return false;
    if(t.drivers!==undefined&&!Array.isArray(t.drivers))return false;
  }
  return true;
}
function isPlain(o){return o&&typeof o==='object'&&!Array.isArray(o);}
function normDay(d){
  if(!isPlain(d))d={};
  ['attend','running','arrive','attendBy','plan','dnote','truckNote','attMeta'].forEach(k=>{if(!isPlain(d[k]))d[k]={};});
  if(!Array.isArray(d.jobs))d.jobs=[];
  if(!Array.isArray(d.deleted))d.deleted=[];
  if(!Array.isArray(d.omsIgnore))d.omsIgnore=[];   /* เลขเอกสาร OMS ที่ CC สั่งทิ้งจากลิสต์จับคู่ไม่ได้ */
  d.jobs=d.jobs.filter(j=>j&&typeof j==='object'&&j.id!==undefined);
  if(typeof d.seq!=='number'||!isFinite(d.seq))d.seq=0;
  return d;
}

/* ---- เวลาแบบ 24 ชม. ไม่ขึ้นกับภาษาของเบราว์เซอร์ ----
   รับได้ทั้ง 630 / 0630 / 6:30 / 18:5  ->  คืน "06:30" / "18:05"
   คืน ''   = ช่องว่าง        คืน null = รูปแบบไม่ถูกต้อง            */
const LATE_GRACE=10;   /* มาช้ากว่าเวลาเข้ากะเกินกี่นาที ถือว่า "สาย" (ตรงกับเกณฑ์ Alert) */
function isLateArrival(d,arriveHM,shiftStr){
  const sm=parseStart(shiftStr||shiftOf(d,curDate)), am=hm2min(arriveHM);
  if(sm===null||am===null)return false;
  let diff=am-sm;
  if(diff>720)diff-=1440;          /* กะข้ามเที่ยงคืน */
  if(diff<-720)diff+=1440;
  return diff>LATE_GRACE;
}
function normHM(v){
  v=String(v==null?'':v).trim();
  if(!v)return '';
  let d=v.replace(/[^0-9]/g,'');
  if(v.indexOf(':')>0){
    const p=v.split(':');
    d=String(p[0]).replace(/\D/g,'').padStart(2,'0')+String(p[1]||'0').replace(/\D/g,'').padStart(2,'0');
  }else if(d.length===1)d='0'+d+'00';
  else if(d.length===2)d=d+'00';
  else if(d.length===3)d='0'+d;
  if(d.length!==4)return null;
  const h=+d.slice(0,2),m=+d.slice(2);
  if(isNaN(h)||isNaN(m)||h>23||m>59)return null;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

const tsort={};
function thS(tbl,k,lab,al){
  const st=tsort[tbl]||{},on=st.key===k;
  return `<th class="th-sort${on?' on':''}" data-ts="${tbl}" data-tsk="${k}"${al?` style="text-align:${al}"`:''}>${lab}<span class="sortcaret">${on?(st.dir>0?'▲':'▼'):'⇅'}</span></th>`;
}
function sortBy(tbl,arr,getters){
  const st=tsort[tbl];
  if(!st||!st.key||!getters[st.key])return arr;
  const g=getters[st.key],d=st.dir;
  return arr.slice().sort((a,b)=>{
    const x=g(a),y=g(b);
    const nx=(typeof x==='number'),ny=(typeof y==='number');
    if(nx||ny)return (((nx?x:0)||0)-((ny?y:0)||0))*d;
    return String(x==null?'':x).localeCompare(String(y==null?'':y),'th')*d;
  });
}
function sortActive(tbl){const st=tsort[tbl];return !!(st&&st.key);}

/* ===== ล็อก "งานที่จ่ายแล้ว" ไว้กับตัวคน ไม่ใช่แค่ตำแหน่งกะ =====
   ตอนจ่ายงาน ระบบเก็บ job.shift = ตำแหน่งกะ ณ ตอนนั้น และ job.code = รหัส พจส.
   ถ้าดึงตารางกะชุดใหม่แล้วตำแหน่งกะสลับกัน การเทียบด้วยตำแหน่งกะเพียว ๆ จะพลาด 2 ทาง
     1) คนที่ได้รับงานจริง เด้งกลับเป็น "จ่ายแผน →" เหมือนยังไม่จ่าย  (อาการที่ CC เจอ)
     2) คนที่ยังไม่ได้รับงาน กลายเป็น "จ่ายแล้ว" เพราะไปเกาะงานของคนอื่น
   วิธีแก้: ยึด "รหัส พจส." ก่อน · ถอยไปใช้ตำแหน่งกะเฉพาะกรณีงานนั้นไม่มีรหัส
   หรือรหัสนั้นไม่อยู่ในรถคันนี้แล้ว (ข้อมูลเก่า / คนย้ายออก) -> ข้อมูลย้อนหลังทำงานเหมือนเดิม */
let jobIdx={src:null,n:-1,map:null};
function jobsByTruck(){                       /* แยกงานตามเบอร์รถไว้ครั้งเดียว ไม่ต้องวนทั้งวันซ้ำทุกแถว */
  const list=(day&&Array.isArray(day.jobs))?day.jobs:[];
  if(jobIdx.src===list&&jobIdx.n===list.length&&jobIdx.map)return jobIdx.map;
  const map={};
  list.forEach(j=>{if(!j)return;const k=normNo(j.mainTruck||j.truck);(map[k]=map[k]||[]).push(j);});
  jobIdx={src:list,n:list.length,map:map};

}
/* งานทั้งหมดที่จ่ายให้ พจส. คนนี้ บนรถคันนี้ (เรียงตามลำดับที่จ่าย) */
function jobsFor(t,d){
  if(!t||!d)return [];
  const bucket=jobsByTruck()[normNo(t.truckNo)];
  if(!bucket||!bucket.length)return [];
  const code=String(d.code||'').trim();
  const here={};                              /* รหัส พจส. ที่ยังอยู่บนรถคันนี้ตามตารางกะชุดปัจจุบัน */
  (t.drivers||[]).forEach(x=>{const c=String(x&&x.code||'').trim();if(c)here[c]=1;});
  return bucket.filter(j=>{
    const jc=String(j.code||'').trim();
    if(jc&&here[jc])return !!code&&jc===code;  /* คนในงานยังอยู่รถคันนี้ -> ยึดตัวคนเท่านั้น */
    return String(j.shift)===String(d.pos);    /* ไม่มีรหัส / ย้ายออกแล้ว -> ใช้ตำแหน่งกะเหมือนเดิม */
  });
}
/* พจส. เจ้าของงานนี้ตามตารางกะชุดปัจจุบัน (ยึดรหัสก่อน แล้วถอยไปตำแหน่งกะ) */
function driverOfJob(t,j){
  if(!t||!j)return undefined;
  const jc=String(j.code||'').trim();
  if(jc){const hit=(t.drivers||[]).find(x=>x&&String(x.code||'').trim()===jc);if(hit)return hit;}
  return driverAt(t,j.shift);
}

/* บันทึกจริง ณ ตอนนี้ (ใช้จาก debounce ปกติ และตอนบังคับ flush ก่อนสลับวันที่)
   จับ ds/snap ทันทีตอนเริ่มบันทึก ไม่ใช่ค่อยจับตอน timeout ยิง -> ถ้าผู้ใช้สลับวันที่ระหว่างรอ debounce
   จะไม่หยิบ curDate/day ของวันใหม่มาใช้ผิดวัน (กัน race condition ข้อมูลข้ามวันปนกัน) */
async function doSaveNow(){
  if(saveBusy){                                    /* มีคำขอบันทึกค้างอยู่ ห้ามยิงซ้อน — ตั้งให้บันทึกต่อทันทีที่คำขอเดิมจบ */
    if(!st)st=setTimeout(()=>{st=null;doSaveNow();},400);
    return;
  }
  const ds=curDate, gen=editGen, snap=day;
  mem['fleet:day:'+ds]=JSON.stringify(snap);
  try{lsSet('fleetdb:fleet:day:'+ds,mem['fleet:day:'+ds]);}catch(e){}   /* สำรองในเครื่องด้วย ปิดแท็บ/รีเฟรชแล้วของที่ยังไม่ขึ้นไม่หาย */
  if(backendURL){
    if(!pendingOps.length){dirty=false;flag('ok');return;}
    const sending=pendingOps; pendingOps=[];
    /* แยก ops ตามวันที่ที่แก้จริง แล้วส่งแยกทีละวัน — แต่ละ op ลงวันของตัวเองเสมอ
       (เดิมส่งทุก op ไปลง curDate ณ ตอนนั้น ถ้าสลับวันที่ระหว่างรอผล ข้อมูลจะข้ามวันปนกัน) */
    const groups=[],gi={};
    sending.forEach(it=>{
      const d=(it&&it.ds)?it.ds:ds, o=(it&&it.op)?it.op:it;
      if(gi[d]===undefined){gi[d]=groups.length;groups.push({ds:d,ops:[]});}
      groups[gi[d]].ops.push(o);
    });
    saveBusy=true;
    const failed=[];let okAny=false;
    for(const g of groups){
      const merged=await dayPatch(g.ds,g.ops);
      if(merged===null){g.ops.forEach(o=>failed.push({ds:g.ds,op:o}));continue;}
      okAny=true;
      if(g.ds===curDate){                                 /* ผลที่ได้เป็นของวันที่กำลังดูอยู่ จึงเอามาใช้ได้ */
        try{const o=JSON.parse(merged);
          if(o&&typeof o==='object'){
            normDay(o);day=o;dayLoaded=true;              /* เซิร์ฟเวอร์คืนข้อมูลรวมของวันนั้นมา = ของจริง */
            reapplyPending();                             /* ที่พิมพ์ระหว่างรอ ยังอยู่ครบ */
          }
        }catch(e){}
      }
    }
    saveBusy=false;
    if(okAny)lastSyncTxt=nowHM();
    if(failed.length){
      pendingOps=failed.concat(pendingOps);               /* ส่งไม่สำเร็จ เก็บไว้ส่งรอบหน้า พร้อมวันที่เดิม */
      saveRetry=Math.min((saveRetry||0)+1,6);
      /* ต้องนัดลองใหม่เองด้วย ไม่ใช่รอให้ CC เผอิญพิมพ์อะไรอีก (เดิมค้าง dirty=true ตลอด แล้วการซิงก์อัตโนมัติก็หยุดไปเลย) */
      if(!st)st=setTimeout(()=>{st=null;doSaveNow();},Math.min(30000,1500*Math.pow(2,saveRetry-1)));
      flag('err');
    }else{
      saveRetry=0;lastWriteErr='';        /* เขียนสำเร็จแล้ว ล้างสถานะผิดพลาดค้าง ไม่ให้ไปปิดฟีเจอร์อื่นค้างไว้ */
      if(!pendingOps.length)dirty=false;
      flag('ok');
    }
  }else{
    await store.set('fleet:day:'+ds,JSON.stringify(snap));
    if(gen===editGen)dirty=false;
    flag('ok');
  }
}
/* บังคับบันทึกข้อมูลของวันที่กำลังดูอยู่ให้เสร็จก่อน จะสลับไปดูวันอื่น
   (แก้บัค: เดิมสลับวันที่ระหว่างรอ debounce 250ms แล้วข้อมูลวันเก่าไปปนกับวันใหม่/หายไปเงียบๆ) */

     ตอนนี้: (1) กรองทิ้งเฉพาะชุดที่เสียจริง ๆ ไม่ทิ้งชุดที่ดี (2) ไม่มีการบันทึกทับระบบกลางจากแค่การโหลดหน้าเว็บอีก
     ต่อไป — จะบันทึกก็ต่อเมื่อผู้ใช้แก้ไข/อัปโหลดจริงเท่านั้น (saveConfig/applyImport) */
  const good=Array.isArray(vs)?vs.filter(v=>v&&v.from&&validConfig(v.roster)):[];
  good.forEach(v=>normRoster(v.roster));   /* ล้าง pos ให้เป็น string ทุกชุด */
  if(good.length){
    rosterVersions=good;
  }else if(rosterVersions.length){
    /* ดึงจากระบบกลางไม่ได้/ไม่มีชุดที่ใช้ได้เลยตอนนี้ (เช่นเน็ตสะดุด) -> ใช้ของที่มีอยู่ในเครื่องต่อไปก่อน ไม่ทับของเดิม */
  }else{
    /* ไม่มีอะไรเลยจริง ๆ (ครั้งแรกที่ใช้งาน) — สร้างให้ดูไปก่อนเฉย ๆ ยังไม่บันทึก */
    let old=null; try{old=await store.get('fleet:roster');}catch(e){}
    let oc=null; if(old){try{oc=JSON.parse(old);}catch(e){}}
    rosterVersions=[{id:'v0',from:'2000-01-01',name:'ตารางกะเริ่มต้น',
      roster:validConfig(oc)?oc:seed(),savedAt:new Date().toISOString(),by:adminName||''}];
  }
  try{rosterRev=String(await store.get('fleet:rosters:rev')||'');}catch(e){}
  applyRosterForDate();
}
/* ดึงชุดตารางกะล่าสุดจากระบบกลางตรงก่อนบันทึกเสมอ (ไม่ใช่ของที่ค้างอยู่ในเครื่องตัวเองซึ่งอาจเก่ากว่าที่คนอื่น
   เพิ่งบันทึกไปหลังจากเราเปิดหน้าเว็บ) แล้วค่อยแก้ไขบนชุดล่าสุดนั้นก่อนเซฟกลับ — ลดช่วงเวลาที่จะชนกับคนอื่นจาก
   "นานเท่าที่เปิดหน้าเว็บทิ้งไว้" ให้เหลือแค่เสี้ยววินาทีที่ fetch-แก้ไข-save (ยังไม่ใช่ระบบ merge เต็มรูปแบบแบบ
   หน้า 1 แต่ปลอดภัยกว่าของเดิมมาก) */
async function freshRosterVersions(){
  let raw=null; try{raw=await store.get('fleet:rosters');}catch(e){}
  let vs=null; if(raw){try{vs=JSON.parse(raw);}catch(e){}}
  const good=Array.isArray(vs)?vs.filter(v=>v&&v.from&&validConfig(v.roster)):[];
  return good.length?good:rosterVersions;
}
async function saveRosterVersions(mutate){
  const fresh=await freshRosterVersions();
  rosterVersions=mutate(fresh.slice());
  return await saveRosters();
}
function seed(){const r=ROSTER.map(t=>({...t,routeGroup:(t.routeGroup||'').trim()}));EXTRA.forEach(x=>{if(!r.find(t=>t.truckNo===x.truckNo))r.push(x);});return r;}
/* กันผลที่ล้าสมัย: ถ้ากดเปลี่ยนวันรวดเร็วหลายครั้ง คำตอบของวันเก่าอาจกลับมาหลังวันใหม่
   ต้องทิ้งคำตอบที่ไม่ใช่วันที่กำลังดูอยู่ ไม่ให้ day เป็นข้อมูลของอีกวันขณะที่หัวจอบอกอีกวัน */
let loadSeq=0;
/* dayLoaded = ยืนยันได้ว่าข้อมูลของวันที่กำลังดู "โหลดมาจริง" แล้ว
   ถ้าต่อระบบกลางไม่ได้ day จะกลายเป็นวันเปล่า ซึ่งไม่ใช่สถานะจริงของวันนั้น
   ห้ามให้ระบบตัดสินใจอะไรที่เขียนข้อมูลทับ (เช่นปิดยอดเป็น "ขาด") ตอนที่ยังไม่รู้ของจริง */
let dayLoaded=false;
async function loadDay(){
  const ds=curDate, my=++loadSeq;
  let raw=null;
  if(backendURL){try{raw=await dayFetch(ds);}catch(e){raw=null;}if(raw!==null)lastSyncTxt=nowHM();else flag('err');}
  if(raw===null){try{raw=await store.get('fleet:day:'+ds);}catch(e){raw=null;}}
  if(my!==loadSeq||ds!==curDate)return;                  /* มีการโหลดวันอื่นแซงไปแล้ว ทิ้งผลนี้ */
  /* '' = โหลดสำเร็จแต่วันนั้นยังไม่มีข้อมูล (ถือว่ารู้ของจริงแล้ว) · null = โหลดไม่ได้ (ยังไม่รู้ของจริง)
     ถ้าไม่ได้ตั้ง URL ระบบกลาง ข้อมูลในเครื่องคือของจริงอยู่แล้ว */
  dayLoaded = backendURL ? (raw!==null&&raw!==undefined) : true;
  if(raw){try{day=JSON.parse(raw);}catch(e){day=blankDay();}}else day=blankDay();
  if(!isPlain(day))day=blankDay();
  day=normDay(day);dirty=false;
}

/* attendance helpers */
function isOff(t,d,ds){
  if(!d||!d.dayOff)return false;
  const i=dayIdx(d.dayOff);
  return i>=0 && i===new Date(ds+'T00:00:00').getDay();
}
function attOf(no){return day.attend[no]||{};}

/* ===== ล็อกข้อมูลเช็คชื่อไว้กับ "ตัวคน" ไม่ใช่แค่ "ตำแหน่งกะ" =====
   ปัญหาเดิม: attend/arrive เก็บด้วยคีย์ [เบอร์รถ][ตำแหน่งกะ] เฉย ๆ ถ้าตารางกะชุดใหม่
   สลับให้ตำแหน่งกะเดียวกันเป็นคนละคน/คนละเวลา ค่าที่กรอกไว้จะไปโผล่ผิดช่อง
   (เช่น กรอกเวลามา 00:39 ของกะตี 1 แล้วกลายเป็นไปอยู่กะ 07:00)
   วิธีแก้: ตอนกรอก บันทึก "รหัสพจส.|เวลาเข้ากะ" ที่ใช้ตอนนั้นไว้ที่ attMeta ด้วย
   ตอนอ่าน ให้หาช่องที่ 'รหัสพจส.' ตรงกับคนในแถวก่อน ค่อยถอยไปใช้ตำแหน่งกะ
   ข้อมูลเก่าที่ยังไม่มี attMeta จะทำงานเหมือนเดิมทุกอย่าง (ไม่กระทบย้อนหลัง) */
function metaMap(no){const m=day.attMeta&&day.attMeta[no];return isPlain(m)?m:{};}
function metaCode(s){return String(s==null?'':s).split('|')[0]||'';}
function metaShift(s){const a=String(s==null?'':s).split('|');return a.length>1?a.slice(1).join('|'):'';}
/* ตำแหน่งที่ควรอ่านข้อมูลของ พจส. คนนี้ — คืน null ถ้าช่องนี้เป็นข้อมูลของคนอื่น */
function attPos(t,d){
  if(!t||!d)return d?d.pos:null;
  const M=metaMap(t.truckNo), keys=Object.keys(M);
  if(!keys.length)return d.pos;                       /* ข้อมูลเก่า: ใช้ตำแหน่งกะเหมือนเดิม */
  const code=String(d.code||'').trim();
  if(!code){                                          /* ไม่มีรหัส พจส. เทียบตัวคนไม่ได้ */
    const mine=M[d.pos];
    if(mine!==undefined&&metaCode(mine))return null;   /* ช่องนี้ประทับเป็นของคนที่มีรหัส -> ไม่ใช่ของเรา */
    return d.pos;
  }
  if(M[d.pos]!==undefined&&metaCode(M[d.pos])===code)return d.pos;   /* ปกติ: ตรงทั้งตำแหน่งและคน */
  for(const p of keys)if(metaCode(M[p])===code)return p;             /* คนเดิมย้ายตำแหน่งกะ */
  if(M[d.pos]!==undefined&&metaCode(M[d.pos]))return null;           /* ช่องนี้เป็นของคนอื่น */
  return d.pos;
}
/* เวลาเข้ากะที่ถูกใช้ตอนกรอก (ถ้ามี) ไว้เตือนเมื่อไม่ตรงกับตารางกะปัจจุบัน */
function attLockedShift(t,d){const p=attPos(t,d);if(p===null)return '';return metaShift(metaMap(t.truckNo)[p]);}
/* เวลาเข้ากะที่ใช้ 'แสดง/เรียง' ของแถวนั้น: ถ้าช่องนี้กรอกไว้แล้ว ใช้เวลากะที่ล็อกไว้ตอนกรอก
   เพื่อให้สิ่งที่ CC เห็นตรงกับตอนที่กรอกจริง ไม่ถูกตารางกะชุดใหม่เปลี่ยนย้อนหลัง */
function rowShift(t,d){return attLockedShift(t,d)||shiftOf(d,curDate);}
function shiftMoved(t,d){const L=attLockedShift(t,d);return !!(L&&L!==shiftOf(d,curDate));}
function attStat(t,d){const p=attPos(t,d);return p===null?'':((day.attend[t.truckNo]||{})[p]||'');}
function attArr(t,d){const p=attPos(t,d);return p===null?'':((day.arrive[t.truckNo]||{})[p]||'');}
function attBy(t,d){const p=attPos(t,d);return p===null?'':((day.attendBy[t.truckNo]||{})[p]||'');}
/* ตอนบันทึก ประทับรหัสพจส.+เวลาเข้ากะที่ใช้ตอนนั้นติดไปด้วย */
function stampMeta(no,p){
  const t=truckByNo(no),d=driverAt(t,p);
  if(!t||!d)return;
  setCell('attMeta',no,p,String(d.code||'').trim()+'|'+(shiftOf(d,curDate)||''));
}
/* บันทึกเวลามาจริง แล้วให้ระบบเลือกสถานะ มา / สาย / OT ให้เอง */
function setArrive(no,p,v){
  setCell('arrive',no,p,v);
  setCell('attendBy',no,p,adminName);
  stampMeta(no,p);
  if(v){
    const t=truckByNo(no),d=driverAt(t,p),off=isOff(t,d,curDate);
    const cur=(t&&d)?attStat(t,d):((day.attend[no]||{})[p]||'');
    if(off){ if(cur!=='ot')setCell('attend',no,p,'ot'); }
    else if(cur===''||cur==='absent'||cur==='present'||cur==='late'){
      /* คิด สาย/มา เทียบกับเวลากะที่ล็อกไว้ของช่องนั้น (ถ้ามี) ให้ตรงกับเวลาที่ CC เห็นบนแถว */
      setCell('attend',no,p,isLateArrival(d,v,(t&&d)?rowShift(t,d):'')?'late':'present');
    }
  }
  saveDay();renderRoster();
}
function isRunning(no){return !!day.running[no];}

/* ============================================================================
   ดึง "งานที่จ่ายไปแล้ว" กลับมาจาก OMS แล้วเติมเวลาจริงให้เอง (2026-08-14)
   API: GetWorkAppBU4?dateSend=YYYY-MM-DD  เรียกผ่าน Apps Script เป็นตัวกลาง
        (เรียกตรงจากเบราว์เซอร์ไม่ได้ เพราะปลายทางเป็น http:// และไม่มี CORS)

   กติกาที่ตกลงกับผู้ใช้ไว้
   1) ดึงอัตโนมัติทุก 5 นาที (วันนี้ + วันวาน กันกะข้ามเที่ยงคืน) และ CC กดปุ่มดึงเองได้
   2) จับคู่ยึด omsDoc = woheader_docid ก่อน · ไม่เจอใช้ (เบอร์รถ+รหัส พจส.) · ไม่เจอใช้ (เบอร์รถ+ชื่อ พจส.)
   3) เติม "เฉพาะช่องที่ยังว่าง" ช่องที่ CC กรอกเองแล้วไม่แตะ
        work_open_at   -> เวลาออก (depart)
        work_source_at -> เวลากลับ (ret)
        work_close_at  -> เวลาปิดงาน (closed)
   4) driver_report_at -> เวลามาจริงหน้า 1 ของ "วันตามค่าจริง" แล้วให้ระบบตั้ง มา/สาย/OT ด้วยกฎเดิม
      ถ้าไม่มีค่าเวลาไม่ทำอะไรเลย
   5) เอกสารใบเดียวมีหลายรายการย่อย -> เรียงตาม woitem_docid จับกับเที่ยว 1,2,3 ตามลำดับ
      ตอนถอยไปใช้รถ+รหัส/ชื่อ และคนนั้นวิ่งหลายเที่ยว -> เรียงตาม work_plan_at จับกับเที่ยว 1,2,3
   6) แถวที่จับคู่ไม่ได้ไปรวมที่ปุ่มเอกสารในหัวเว็บ · กดถังขยะแล้วจำถาวร (day.omsIgnore) ไม่ให้กลับมา
   ============================================================================ */
const OMS_WORK_EVERY = 300000;               /* 5 นาที */
let omsWorkRows = {};                        /* { 'YYYY-MM-DD': [row,...] } ดิบจาก OMS */
let omsWorkByJob = {};                       /* { jobId: row } ผลจับคู่รอบล่าสุด — ใช้เปิดหน้าต่างข้อมูล */
let omsWorkOrphans = [];                     /* [{ds,row}] จับคู่ไม่ได้ และยังไม่ถูกสั่งทิ้ง */
let omsWorkTimer = null, omsWorkBusy = false, omsWorkAt = '', omsWorkMsg = '', omsWorkFix = '';
let omsOrphanQ = '';                         /* คำค้นในลิสต์ "จับคู่ไม่ได้" — จำไว้ตอนกลับเข้าหน้าต่างซ้ำ */
let omsPairQ = '';                           /* คำค้นในหน้า "จับคู่ใบงานเอง" — ล้างใหม่ทุกครั้งที่เปิดรายการใหม่ */

function omsHM(iso){const m=String(iso||'').match(/T(\d{2}):(\d{2})/);return m?(m[1]+':'+m[2]):'';}
function omsDay(iso){const m=String(iso||'').match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:'';}
/* ชื่อจาก OMS มีเว้นวรรคซ้อน เช่น "ออมสิน  ศรีเจริญ" ต้องยุบก่อนเทียบ */
function normName(v){return String(v||'').replace(/\s+/g,' ').trim();}
function omsRowKey(r){return String(r&&r.woheader_docid||'')+':'+String(r&&r.woitem_docid||'');}
function prevDayStr(ds){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ---- จับคู่แถวจาก OMS กับใบงานของวันนั้น ---- */
function omsMatch(rows,jobs){
  const pairs=[], usedJob={}, usedRow={};
  const byPlan=(a,b)=>String(a.work_plan_at||'').localeCompare(String(b.work_plan_at||''));
  const byItem=(a,b)=>String(a.woitem_docid||'').localeCompare(String(b.woitem_docid||''));
  const byTrip=(a,b)=>((+a.trip||0)-(+b.trip||0));
  /* จับเป็นกลุ่ม: คีย์เดียวกันมีหลายแถว/หลายใบ ให้เรียงแล้วจับตามลำดับ */
  const zip=(rowKey,jobKey,rowSort)=>{
    const R={},J={};
    rows.forEach((r,i)=>{if(usedRow[i])return;const k=rowKey(r);if(!k)return;(R[k]=R[k]||[]).push({r:r,i:i});});
    jobs.forEach(j=>{if(usedJob[j.id])return;const k=jobKey(j);if(!k)return;(J[k]=J[k]||[]).push(j);});
    Object.keys(R).forEach(k=>{
      if(!J[k])return;
      const rs=R[k].slice().sort((x,y)=>rowSort(x.r,y.r));
      const js=J[k].slice().sort(byTrip);
      for(let n=0;n<Math.min(rs.length,js.length);n++){
        pairs.push({row:rs[n].r,job:js[n]});usedRow[rs[n].i]=1;usedJob[js[n].id]=1;
      }
    });
  };
  /* ชั้น 1 — เลขที่เอกสาร OMS (แม่นที่สุด) */
  zip(r=>String(r.woheader_docid||'').trim(), j=>String(j.omsDoc||'').trim(), byItem);
  /* ชั้น 2 — เบอร์รถ + รหัส พจส. */
  zip(r=>{const t=normNo(r.truck_id),c=String(r.driver_id||'').trim();return (t&&c)?(t+'|'+c):'';},
      j=>{const t=normNo(j.mainTruck||j.truck),c=String(j.code||'').trim();return (t&&c)?(t+'|'+c):'';}, byPlan);
  /* ชั้น 3 — เบอร์รถ + ชื่อ พจส. */
  zip(r=>{const t=normNo(r.truck_id),n=normName(r.driver_name);return (t&&n)?(t+'|'+n):'';},
      j=>{const t=normNo(j.mainTruck||j.truck),n=normName(j.driver);return (t&&n)?(t+'|'+n):'';}, byPlan);
  const orphans=rows.filter((r,i)=>!usedRow[i]);
  return {pairs:pairs,orphans:orphans};
}

/* ---- คำนวณว่าจะเติมช่องไหนของใบงาน (เฉพาะช่องว่าง) ---- */
function omsJobFills(j,row){
  const out=[];
  const blank=v=>!String(v===undefined||v===null?'':v).trim();
  const put=(f,v)=>{if(v&&blank(j[f]))out.push([f,v]);};
  put('depart', omsHM(row.work_open_at));
  put('ret',    omsHM(row.work_source_at));
  put('closed', omsHM(row.work_close_at));
  /* จับคู่ติดด้วยชั้น 2/3 -> เขียนเลขเอกสารลงใบงาน รอบหน้าจะจับคู่ชั้น 1 ได้ทันที */
  put('omsDoc', String(row.woheader_docid||''));
  return out;
}

/* ---- เวลามาจริง + สถานะ (มา/สาย/OT) สำหรับวันใดก็ได้ ----
   คืนชุด ops ที่ต้องเขียน หรือ [] ถ้าไม่ต้องทำอะไร (ไม่มีเวลา หรือช่องมีค่าอยู่แล้ว) */
/* ตัวจริงที่ตัดสินใจ — คืน {ops, why} เพื่อให้หน้า "ตรวจการเชื่อมต่อ" รายงานเหตุผลตรงกับที่เขียนจริง
   ห้ามมีตรรกะซ้ำที่อื่น ไม่งั้นหน้าตรวจจะบอกคนละเรื่องกับที่ระบบทำ */
function omsArriveCheck(ds,row,dayDoc,cfg){
  const no=(w,x)=>({ops:[],why:w,detail:x||''});
  const hm=omsHM(row.driver_report_at);
  if(!hm)return no('noTime');                            /* OMS ไม่ได้ส่งเวลารายงานตัวมา */
  const tno=normNo(row.truck_id);
  if(!tno)return no('noTruckId');
  const t=(cfg||[]).find(x=>normNo(x.truckNo)===tno);
  if(!t)return no('truckNotInRoster',String(row.truck_id||''));   /* เบอร์รถนี้ไม่มีในตารางกะของวันนั้น */
  const code=String(row.driver_id||'').trim(), nm=normName(row.driver_name);
  const d=(t.drivers||[]).find(x=>code&&String(x.code||'').trim()===code)
        ||(t.drivers||[]).find(x=>nm&&normName(x.name)===nm);
  if(!d)return no('driverNotInTruck',code+' / '+nm);      /* คนนี้ไม่ได้อยู่ในคันนี้ตามตารางกะ */
  const cur=((dayDoc.arrive||{})[t.truckNo]||{})[d.pos]||'';
  if(String(cur).trim())return no('already',String(cur)); /* CC กรอกไว้แล้ว ไม่แตะ */
  return {ops:omsArriveOpsFor(ds,row,t,d,hm,dayDoc),why:'write',detail:hm};
}
function omsArriveOps(ds,row,dayDoc,cfg){ return omsArriveCheck(ds,row,dayDoc,cfg).ops; }
function omsArriveOpsFor(ds,row,t,d,hm,dayDoc){
  const ops=[{k:'cell',s:'arrive',t:String(t.truckNo),p:String(d.pos),v:hm},
             {k:'cell',s:'attendBy',t:String(t.truckNo),p:String(d.pos),v:'OMS'},
             {k:'cell',s:'attMeta',t:String(t.truckNo),p:String(d.pos),v:String(d.code||'').trim()+'|'+(shiftOf(d,ds)||'')}];
  /* ตั้งสถานะด้วยกฎเดิมของระบบ: วันหยุด -> OT · ไม่ใช่วันหยุดเทียบเวลาเข้ากะ สายเกิน LATE_GRACE -> สาย
     คนที่ถูกตั้งเป็น "ลา" ไว้ ไม่แตะ (ตรงกับ setArrive) */
  const st=((dayDoc.attend||{})[t.truckNo]||{})[d.pos]||'';
  if(isOff(t,d,ds)){ if(st!=='ot')ops.push({k:'cell',s:'attend',t:String(t.truckNo),p:String(d.pos),v:'ot'}); }
  else if(st===''||st==='absent'||st==='present'||st==='late'){
    ops.push({k:'cell',s:'attend',t:String(t.truckNo),p:String(d.pos),v:
      isLateArrival(d,hm,shiftOf(d,ds))?'late':'present'});
  }
  return ops;
}

/* ---- อ่านคำตอบของระบบกลางว่า "พังตรงไหน" ----
   ก่อนหน้านี้ถ้าสคริปต์ระบบกลางยังเป็นตัวเก่า (ไม่รู้จัก omswork) หรือโทเคนไม่ตรง
   ระบบจะเงียบสนิท ขึ้นแค่ "เติมข้อมูลให้ 0 ช่อง" ซึ่งดูไม่ออกว่าเสียหรือแค่ไม่มีงาน
   คืน {msg, fix} — msg ว่าง = ไม่มีปัญหา */
function omsReplyProblem(d){
  if(!d||typeof d!=='object')return {msg:'ระบบกลางตอบข้อมูลที่อ่านไม่ออก',fix:''};
  if(d.error==='unauthorized')return {msg:'รหัสเชื่อมระบบกลาง (โทเคน) ไม่ตรงกัน',
    fix:'ค่า <b>TOKEN</b> ในสคริปต์ Apps Script ต้องตรงกับ <b>API_TOKEN</b> ในไฟล์เว็บนี้เป๊ะ ๆ'};
  if(d.error==='missing key'||(!('rows' in d)&&!('ok' in d)))
    return {msg:'สคริปต์ระบบกลางยังเป็นตัวเก่า ยังไม่รู้จักคำสั่งดึงงานจาก OMS',
      fix:'ต้องเอาโค้ด <b>Code.gs เวอร์ชันที่มี omsWorkFetch_</b> ไปวางใน Apps Script แล้วสั่ง '+
          '<b>Deploy → Manage deployments → แก้ไข → New version → Deploy</b> ถ้าไม่ Deploy ใหม่ ตัวเก่าจะยังทำงานอยู่'};
  if(d.error)return {msg:'ระบบกลางแจ้งว่า: '+String(d.error),fix:''};
  if(d.ok===false)return {msg:String(d.message||'ระบบกลางดึงจาก OMS ไม่สำเร็จ'),
    fix:'ระบบกลางต่อไปที่ OMS ไม่ได้ ลองใหม่อีกรอบ ถ้ายังไม่ได้ให้แจ้งฝ่าย IT ว่า GetWorkAppBU4 เรียกไม่ติด'};
  if(!Array.isArray(d.rows))return {msg:'ระบบกลางตอบมาโดยไม่มีรายการงาน',fix:''};
  return {msg:'',fix:''};
}

/* ---- ดึง 1 วันจากระบบกลาง ---- */
async function omsWorkFetchDay(ds){
  if(!backendURL)return {ok:false,ds:ds,rows:[],message:'ยังไม่ได้ตั้ง URL ระบบกลาง',
    _fix:'กดรูปเฟือง ⚙ บนหัวเว็บ แล้วใส่ URL ของ Apps Script'};
  try{
    const r=await fetch(backendURL+'?omswork='+encodeURIComponent(ds)+'&t='+Date.now()+tk());
    const d=await r.json();
    if(!d||typeof d!=='object')return {ok:false,ds:ds,rows:[],message:'คำตอบจากระบบกลางไม่ถูกต้อง'};
    const p=omsReplyProblem(d);
    if(p.msg){ d.ok=false; d.message=p.msg; d._fix=p.fix; if(!Array.isArray(d.rows))d.rows=[]; }
    return d;
  }catch(e){return {ok:false,ds:ds,rows:[],message:'ต่อระบบกลางไม่ได้ (เน็ตหลุด หรือ URL ผิด)',
    _fix:'เช็กอินเทอร์เน็ต แล้วเช็ก URL ระบบกลางที่รูปเฟือง ⚙'};}
}

/* ---- ดึง "เวลารายงานตัว พจส." จาก endpoint เฉพาะ (ใหม่ 2026-08-26) ----
   ของเดิมเวลารายงานตัวติดมากับ "แถวใบงาน" ของ GetWorkAppBU4 เท่านั้น
   คนที่วันนั้นไม่มีใบงาน จึงไม่มีเวลารายงานตัวมาให้เลย · ตัวนี้เป็นรายชื่อ พจส. ตรง ๆ จึงครบกว่า
   ฝั่ง .gs normalize ชื่อฟิลด์มาให้แล้ว (truck_id · driver_id · driver_name · driver_report_at)
   จึงส่งเข้า omsArriveCheck() ตัวเดิมได้ทันที ไม่มีตรรกะเวลา/สถานะชุดที่สอง */
async function omsDrvFetchDay(ds){
  if(!backendURL)return {ok:false,ds:ds,rows:[],message:'ยังไม่ได้ตั้ง URL ระบบกลาง'};
  try{
    const r=await fetch(backendURL+'?driverreport='+encodeURIComponent(ds)+'&t='+Date.now()+tk());
    const d=await r.json();
    if(!d||typeof d!=='object')return {ok:false,ds:ds,rows:[],message:'คำตอบจากระบบกลางไม่ถูกต้อง'};
    if(!Array.isArray(d.rows))d.rows=[];
    /* สคริปต์ระบบกลางตัวเก่ายังไม่รู้จักคำสั่งนี้ ต้องบอกให้รู้ ไม่ใช่เงียบแล้วเข้าใจว่าไม่มีข้อมูล */
    if(d.error)return {ok:false,ds:ds,rows:[],_old:true,
      message:'ระบบกลางยังไม่รู้จักคำสั่งดึงเวลารายงานตัว (อัปไฟล์ .gs ตัวใหม่แล้ว Deploy → New version)'};
    return d;
  }catch(e){return {ok:false,ds:ds,rows:[],message:'ต่อระบบกลางไม่ได้'};}
}
/* ---- รอบดึงหลัก: วันนี้ + วันวาน ---- */
async function omsWorkPull(manual){
  if(omsWorkBusy)return;
  /* ดึงอัตโนมัติ: ข้ามถ้า CC กำลังพิมพ์ / มีของค้างรอบันทึก / แท็บถูกซ่อน (เกณฑ์เดียวกับ pollDay) */
  if(!manual&&(document.hidden||editMode||dirty||saveBusy||busyTyping()))return;
  if(!backendURL){if(manual)alert('ยังไม่ได้ตั้ง URL ระบบกลาง');return;}
  omsWorkBusy=true;
  try{
    const today=curDate, yst=prevDayStr(curDate);
    const dates=[today,yst];
    const got=await Promise.all(dates.map(ds=>omsWorkFetchDay(ds)));
    const gotDrv=await Promise.all(dates.map(ds=>omsDrvFetchDay(ds)));   /* เวลารายงานตัวจาก endpoint เฉพาะ */
    const bad=got.filter(x=>x&&x.ok===false&&x.message)[0];
    omsWorkMsg=bad?String(bad.message):'';
    omsWorkFix=bad?String(bad._fix||''):'';
    /* บันทึกไว้ให้หน้าตรวจอ่าน — จำนวนแถวที่ได้จริงของแต่ละวัน */
    const diag={at:nowHM(),dates:dates.slice(),msg:omsWorkMsg,fix:omsWorkFix,
                rowsPerDate:{},arrive:[],whyCount:{}};
    dates.forEach((ds,i)=>{diag.rowsPerDate[ds]=Array.isArray((got[i]||{}).rows)?got[i].rows.length:0;});

    /* เอกสาร+ตารางกะของแต่ละวัน โหลดครั้งเดียวแล้วใช้ซ้ำทั้งรอบ */
    const docs={}, cfgs={}, opsByDate={};
    const needDoc=async ds=>{
      if(docs[ds])return;
      if(ds===curDate){docs[ds]=day;cfgs[ds]=config;return;}
      const raw=await dayFetch(ds);
      try{ docs[ds]=normDay(raw?JSON.parse(raw):{}); }catch(e){ docs[ds]=normDay({}); }
      const rv=rosterFor(ds); cfgs[ds]=(rv&&validConfig(rv.roster))?normRoster(rv.roster):config;
    };
    /* เขียน op: วันที่เปิดอยู่เข้าคิวปกติ · วันอื่นสะสมไว้ส่ง dayPatch ทีเดียว
       และทาบลงเอกสารในมือด้วย เพื่อให้แถวถัดไปเห็นว่าช่องนั้นมีค่าแล้ว (กันเขียนซ้ำ/เขียนทับ) */
    const addOp=(ds,op)=>{
      if(ds===curDate)pushOp(op);
      else {(opsByDate[ds]=opsByDate[ds]||[]).push(op); applyOpLocal(docs[ds],op);}
    };

    const orphans=[]; let filled=0;

    /* ---------- 1) เติมเวลาใบงาน — จับคู่ตามชุดข้อมูลของวันนั้น ---------- */
    for(let n=0;n<dates.length;n++){
      const ds=dates[n], res=got[n]||{};
      const rows=Array.isArray(res.rows)?res.rows:[];
      omsWorkRows[ds]=rows;
      if(!rows.length)continue;
      await needDoc(ds);
      const doc=docs[ds];
      const ign={}; (doc.omsIgnore||[]).forEach(x=>ign[String(x)]=1);
      const m=omsMatch(rows,doc.jobs||[]);
      m.pairs.forEach(({row,job})=>{
        if(ds===curDate)omsWorkByJob[String(job.id)]=row;
        omsJobFills(job,row).forEach(([f,v])=>{ filled++; addOp(ds,{k:'jobset',id:String(job.id),f:f,v:v}); });
      });
      m.orphans.forEach(row=>{ if(!ign[omsRowKey(row)])orphans.push({ds:ds,row:row}); });
    }

    /* ---------- 2) เวลามาจริง — จัดตาม "วันของค่าจริง" ไม่ใช่วันที่ดึง ----------
       สำคัญมาก: กะดึก (เข้ากะ 00:00) รายงานตัวคืนก่อน เช่น 2026-08-13T23:37
       ค่านั้นจะมาอยู่ใน "ชุดของวันที่ 08-14" ถ้าไปเทียบว่าต้องเท่ากับวันที่ดึงเท่านั้น
       แถวพวกนี้จะตกหล่นทั้งกะ (บักที่ผู้ใช้เจอ 2026-08-14 — แก้แล้ว)
       จึงรวมแถวจากทุกชุดมากองรวมกัน ตัดตัวซ้ำ แล้วแยกเขียนเข้าวันของมันเอง */
    const seen={}, byDate={};
    /* คีย์ตัดซ้ำ: แถวจาก endpoint เวลารายงานตัวไม่มีเลขใบงาน จึงใช้ รถ|รหัส|เวลา แทน
       และต้องตัดข้ามสองแหล่งด้วย ไม่งั้นคนที่มีทั้งใบงานและแถวรายงานตัวจะถูกนับสองรอบ */
    const arrKey=row=>String(row.truck_id||'')+'|'+String(row.driver_id||'')+'|'+String(row.driver_report_at||'');
    const feed=(res)=>{ ((res&&res.rows)||[]).forEach(row=>{
      const rds=omsDay(row.driver_report_at); if(!rds)return;
      const k=arrKey(row);
      if(seen[k])return; seen[k]=1;
      (byDate[rds]=byDate[rds]||[]).push(row);
    });};
    /* *** 2026-08-26 (รอบสอง) ผู้ใช้สั่ง: เลิกใช้เวลารายงานตัวที่ห้อยมากับแถวใบงาน ***
       เวลามาจริงมาจาก endpoint GetDriverReportAppBU4 แหล่งเดียวเท่านั้น
       (แถวใบงานจาก GetWorkAppBU4 ยังใช้เติมเวลาออก/กลับ/ปิดงาน และจับคู่ใบงานตามเดิม
        แต่ฟิลด์ driver_report_at ของมันไม่ถูกนำมาลงเวลามาจริงอีกแล้ว) */
    gotDrv.forEach(feed);
    /* สรุปผลของแหล่งใหม่ไว้รายงาน — ถ้าอ่านแถวได้แต่จับฟิลด์เวลาไม่ได้ ต้องเห็น ไม่ใช่เงียบ */
    const drvBad=gotDrv.filter(x=>x&&x.ok===false&&x.message)[0]||null;
    const drvCount=gotDrv.reduce((a,x)=>a+((x&&+x.count)||0),0);
    const drvMapped=gotDrv.reduce((a,x)=>a+((x&&+x.mapped)||0),0);
    const drvKeys=(gotDrv.find(x=>x&&x.keys&&x.keys.length)||{}).keys||[];
    diag.drv={count:drvCount,mapped:drvMapped,keys:drvKeys,msg:drvBad?String(drvBad.message):''};
    if(drvBad&&!omsWorkMsg){omsWorkMsg=String(drvBad.message);omsWorkFix=drvBad._old
      ? 'อัปไฟล์ .gs ตัวใหม่ แล้ว Deploy → Manage deployments → Edit → New version'
      : 'เปิด <URL ระบบกลาง>?driverreport='+curDate+'&raw=1&tk=… เพื่อดูคำตอบดิบจาก OMS';}
    /* "ได้แถวมาแต่ทุกแถวไม่มีเวลา" มีสองความหมาย แยกจากกันไม่ได้จากข้อมูลที่มี
         (ก) ตัวอ่านจับชื่อฟิลด์เวลาไม่ตรง   (ข) OMS ยังไม่มีเวลาให้ในตอนนี้จริง ๆ (เช้าวันนั้น)
       จึง **ไม่** ถือเป็นความล้มเหลว (ไม่เขียนลง omsWorkMsg ซึ่งจะกลบกล่องสรุปทั้งใบ)
       แต่แนบเป็นบรรทัดใบ้ในกล่องสรุป พร้อมชื่อคีย์จริง เพื่อเอามาปรับตัวอ่านได้ถ้าเป็นกรณี (ก) */
    if(!drvBad&&drvCount&&!drvMapped)
      diag.drv.hint='ทุกแถวไม่มีเวลา — ถ้าที่จริง OMS ส่งเวลามาแล้ว แปลว่าตัวอ่านจับชื่อฟิลด์ไม่ตรง'
        +(drvKeys.length?(' (คีย์ที่เจอ: '+drvKeys.join(', ')+')'):'');
    const arriveDates=Object.keys(byDate).sort();
    for(const rds of arriveDates){
      await needDoc(rds);
      byDate[rds].forEach(row=>{
        const c=omsArriveCheck(rds,row,docs[rds],cfgs[rds]);
        diag.whyCount[c.why]=(diag.whyCount[c.why]||0)+1;
        diag.arrive.push({ds:rds,truck:String(row.truck_id||''),code:String(row.driver_id||''),
          name:normName(row.driver_name),at:omsHM(row.driver_report_at),why:c.why,detail:c.detail});
        c.ops.forEach(op=>{ filled++; addOp(rds,op); });
      });
    }
    /* แถวที่ OMS ไม่ได้ส่งเวลารายงานตัวมาเลย จะไม่เข้าลูปข้างบน นับแยกไว้ให้เห็นด้วย */
    const totalRows=got.reduce((a,x)=>a+(Array.isArray(x&&x.rows)?x.rows.length:0),0);
    /* "ยังไม่ส่งเวลามา" ต้องนับจากแหล่งเวลามาจริง (รายชื่อรายงานตัว) ไม่ใช่จากจำนวนแถวใบงานอีกแล้ว */
    diag.totalRows=totalRows; diag.noTimeRows=Math.max(0,drvCount-drvMapped); diag.filled=filled;

    /* ---------- 3) ส่งของวันอื่นขึ้นระบบกลาง ---------- */
    for(const ds of Object.keys(opsByDate)){
      if(opsByDate[ds].length)await dayPatch(ds,opsByDate[ds]);
    }

    omsWorkOrphans=orphans;
    omsWorkAt=nowHM();
    if(filled)saveDay();
    updateOmsDocBtn();
    if(!document.hidden)render();
    if(manual){
      /* หน้า "ตรวจการดึงเวลารายงานตัว" ถูกถอดออก 2026-08-18 ตามที่ผู้ใช้สั่ง
         แต่ยังต้องบอกสาเหตุเสมอ ห้ามกลับไปเงียบแบบก่อน 2026-08-17 (ขึ้นแค่ "เติม 0 ช่อง")
         จึงยกข้อความ + วิธีแก้ มาใส่ในกล่องแจ้งเตือนแทน */
      if(omsWorkMsg){
        alert('ดึงข้อมูลจาก OMS ไม่สำเร็จ\n\n'+omsWorkMsg
          +(omsWorkFix?('\n\nวิธีแก้: '+String(omsWorkFix).replace(/<[^>]+>/g,'')):''));
      } else {
        const n=omsWorkOrphans.length, W=diag.whyCount||{};
        const why=[];
        if(W.already)         why.push('มีเวลาอยู่แล้ว ไม่ทับของ CC '+W.already+' คน');
        if(W.truckNotInRoster)why.push('เบอร์รถไม่มีในตารางกะ '+W.truckNotInRoster+' รายการ');
        if(W.driverNotInTruck)why.push('ไม่พบ พจส. ในรถคันนั้น '+W.driverNotInTruck+' รายการ');
        if(diag.noTimeRows)   why.push('รายชื่อรายงานตัวที่ยังไม่มีเวลา '+diag.noTimeRows+' แถว');
        if((diag.drv||{}).hint)why.push(diag.drv.hint);
        const DV=diag.drv||{};
        alert('ดึงข้อมูลจาก OMS แล้ว\n\nได้รายการงานมา '+diag.totalRows+' รายการ'+
          '\nรายชื่อรายงานตัวจาก OMS '+(DV.count||0)+' แถว (มีเวลา '+(DV.mapped||0)+' แถว)'+
          '\nเติมข้อมูลให้ '+filled+' ช่อง'+
          '\nเวลารายงานตัวที่ลงให้ใหม่ '+(W.write||0)+' คน'+
          (why.length?('\n\nรายการที่ไม่ได้ลงเวลา\n· '+why.join('\n· ')):'')+
          (n?('\n\nมี '+n+' รายการที่จับคู่ใบงานไม่ได้ ดูที่ปุ่ม 📄 บนหัวเว็บ'):''));
      }
    }
  }finally{ omsWorkBusy=false; }
}
function startOmsWork(){
  clearInterval(omsWorkTimer);
  if(!backendURL)return;
  omsWorkTimer=setInterval(()=>omsWorkPull(false),OMS_WORK_EVERY);
  setTimeout(()=>omsWorkPull(false),3000);      /* เปิดหน้ามาดึงรอบแรกหลังหน้าวาดเสร็จ */
}

/* ---------- หน้าจอฝั่ง OMS: ปุ่มเอกสาร · ลิสต์จับคู่ไม่ได้ · จับคู่เอง · ถังขยะ ---------- */
function updateOmsDocBtn(){
  const b=document.getElementById('omsDocBtn'), c=document.getElementById('omsDocCount');
  if(!b||!c)return;
  const n=omsWorkOrphans.length;
  c.textContent=String(n);
  b.style.display=n?'':'none';
  b.title='งานจาก OMS ที่จับคู่ใบงานไม่ได้ '+n+' รายการ'+(omsWorkAt?(' · ดึงล่าสุด '+omsWorkAt):'');
}

/* ค่าที่โชว์ในหน้าต่างข้อมูล — ป้ายไทยเรียงตามลำดับที่อ่านง่าย */
const OMS_FIELDS=[
  ['work_plan_at','เวลาจ่ายงาน (OMS)'],['woheader_docid','เลขที่เอกสาร'],['woitem_docid','รายการย่อย'],
  ['woheader_status','สถานะเอกสาร'],['truck_id','เบอร์รถ'],['tail_id','เบอร์หาง'],
  ['driver_id','รหัส พจส.'],['driver_name','ชื่อ พจส.'],
  ['driver_report_at','เวลารายงานตัว'],['work_open_at','เวลาเปิดงาน / ออก'],
  ['work_source_at','ถึงต้นทาง'],['work_close_at','เวลาปิดงาน'],
  ['pro_name','สินค้า'],['pro_id','รหัสสินค้า'],
  ['source_name','ต้นทาง'],['source_id','รหัสต้นทาง'],
  ['dest_name','ปลายทาง'],['dest_id','รหัสปลายทาง']
];
function omsRowTable(row){
  return '<div class="dgrid">'+OMS_FIELDS.map(([k,lab])=>{
    const v=row[k];
    return '<div class="lb">'+esc(lab)+'</div><div>'+(v===null||v===undefined||v===''?'<span class="cno">—</span>':'<span class="mono">'+esc(String(v))+'</span>')+'</div>';
  }).join('')+'</div>';
}
/* หน้าต่างข้อมูล OMS ของใบงานหนึ่งใบ (กดจากช่องชื่อ พจส. หน้า 3) */

    +(row?('<div class="hint" style="margin-bottom:10px">ใบงานของ <b>'+esc(j?(j.driver||''):'')+'</b> เบอร์รถ <b>'+esc(j?(j.mainTruck||j.truck||''):'')+'</b> เที่ยว <b>'+esc(j?(j.trip||''):'')+'</b><br>'
        +'ชื่อสินค้า/ต้นทาง/ปลายทางฝั่ง OMS อาจไม่ตรงกับทะเบียนเส้นทางหน้า 5 แต่<b>เลขที่เอกสารตรงกันแน่นอน</b></div>'
        +omsRowTable(row))
       :('<div class="hint" style="color:var(--absent)">ยังไม่มีข้อมูลจาก OMS สำหรับใบงานนี้<br>'

/* ลิสต์รายการที่จับคู่ไม่ได้ */
/* ข้อความที่ช่องค้นหาจะเทียบ — ชื่อ พจส. · เบอร์รถ · รหัส พจส. · เลขที่ใบงาน เท่านั้น
   (รหัส พจส. ไม่ได้โชว์เป็นคอลัมน์ในตาราง แต่ค้นหาได้ เพราะ CC มักถือรหัสมาค้น) */
function omsOrphanHay(r){
  return [normName(r.driver_name), r.truck_id, r.driver_id,
          String(r.woheader_docid||'')+(r.woitem_docid?(':'+r.woitem_docid):'')]
    .map(v=>String(v==null?'':v)).join(' ').toLowerCase();
}
/* กรองในที่ ไม่วาดหน้าต่างใหม่ — ช่องค้นหาจึงไม่เสียโฟกัส/เคอร์เซอร์ (แบบเดียวกับหน้า 1 และหน้า 5)
   และ index ของปุ่มแต่ละแถวยังอ้าง omsWorkOrphans ตัวเดิม จับคู่/ทิ้ง จึงไม่หยิบผิดรายการ */
function omsOrphanFilter(){
  const inp=document.getElementById('omsOrphanSearch');
  if(inp)omsOrphanQ=inp.value||'';
  const terms=omsOrphanQ.toLowerCase().split(/\s+/).filter(x=>x.length);
  let shown=0, total=0;
  document.querySelectorAll('#omsOrphanBody tr[data-omsq]').forEach(tr=>{
    total++;
    const hay=tr.dataset.omsq||'';
    const hit=terms.every(t=>hay.indexOf(t)>=0);
    tr.style.display=hit?'':'none';
    if(hit)shown++;
  });
  const none=document.getElementById('omsOrphanNone');
  if(none)none.style.display=(total&&!shown)?'':'none';
  const cnt=document.getElementById('omsOrphanCount');
  if(cnt)cnt.textContent='แสดง '+shown+' จาก '+total+' รายการ';
  const cl=document.getElementById('omsOrphanClear');
  if(cl)cl.style.display=omsOrphanQ?'':'none';
}

/* ยืนยันการจับคู่ที่ CC เลือกเอง */
function omsPairPick(jobId,idx){
  const x=omsWorkOrphans[idx]; if(!x)return;
  const j=(day.jobs||[]).find(y=>String(y.id)===String(jobId)); if(!j)return;
  const r=x.row;
  setJobField(j,'omsDoc',String(r.woheader_docid||''));
  omsJobFills(j,r).forEach(([f,v])=>setJobField(j,f,v));
  omsWorkByJob[String(j.id)]=r;
  omsWorkOrphans.splice(idx,1);
  saveDay();updateOmsDocBtn();render();
  openOmsOrphans();
}
/* ถังขยะ — ถามยืนยันก่อน แล้วจำถาวรไม่ให้กลับมาโผล่รอบถัดไป */
function omsDrop(idx){
  const x=omsWorkOrphans[idx]; if(!x)return;
  const r=x.row;
  const msg='ทิ้งรายการนี้ออกจากลิสต์?\n\n'
    +'เลขที่เอกสาร: '+String(r.woheader_docid||'')+(r.woitem_docid?(':'+r.woitem_docid):'')+'\n'
    +'เบอร์รถ: '+String(r.truck_id||'')+' · พจส.: '+normName(r.driver_name)+'\n'
    +'สินค้า: '+String(r.pro_name||'')+'\n\n'
    +'ระบบจะจำไว้ว่าไม่ต้องแสดงรายการนี้อีก และจะไม่ลบอะไรในระบบ OMS';
  if(!confirm(msg))return;
  const key=omsRowKey(r);
  if(x.ds===curDate){ pushOp({k:'omsignore',id:key}); saveDay(); }
  else dayPatch(x.ds,[{k:'omsignore',id:key}]);
  omsWorkOrphans.splice(idx,1);
  updateOmsDocBtn();
  openOmsOrphans();
}

/* ---------- KPIs ---------- */
/* ใครอยู่ใน "ฐานการจ่ายงาน" ของวันนี้ = คนที่มาทำงานจริง (มา / มาสาย / มาทำ OT วันหยุด)
   และมีรถให้วิ่งจริง (ไม่ใช่ trainee ที่ยังรอเบอร์รถ) · ต้องใช้เกณฑ์เดียวกันทั้ง kpis และ dispatchState */
function inDispatchBase(t,d){
  if(!t||!d||t.type==='trainee')return false;
  const v=attStat(t,d);
  return v==='present'||v==='late'||v==='ot';
}
function kpis(){
  let running=0,present=0,absent=0,leave=0,off=0,ot=0,late=0,unchecked=0,total=0;
  let dispatched=0,pendingDispatch=0;    /* คนในฐาน: จ่ายเที่ยวแรกไปแล้วกี่คน / เหลืออีกกี่คน */
  let baseHead=0;                        /* จำนวนคนในฐานการจ่ายงาน (ตัวหารของการ์ด "จ่ายงานแล้ว") */
  let disp2=0,disp3=0;                   /* จ่ายถึงเที่ยวที่ 2 / 3 แล้วกี่คน (เก็บไว้ให้ของเดิมใช้ได้) */
  const inBaseIds=new Set();             /* id ใบงานที่มีเจ้าของอยู่ในฐาน — ใช้ Set กันนับซ้ำ */
  for(const t of config){
    if(isRunning(t.truckNo))running++;
    for(const d of (t.drivers||[])){
      total++;
      const v=attStat(t,d);            /* ต้องผ่านตัวจับคู่ตามรหัส พจส. ให้ตรงกับตารางหน้า 1 */
      if(isOff(t,d,curDate)){ off++; if(v==='ot')ot++; }               // วันหยุด fix ตามตารางกะ ไม่หัก OT
      else if(v==='present')present++; else if(v==='late')late++;
      else if(v==='absent')absent++; else if(v==='leave')leave++;
      else if(v==='ot')ot++; else unchecked++;
      /* วันหยุดที่กด "มาทำ OT" ก็คือคนมาทำงานและรับงานได้จริง จึงต้องอยู่ในฐานด้วย
         (ก่อน 2026-08-13 ถูก continue ข้ามไป ทำให้งานของเขาหลุดจากยอดการ์ดหน้า 1) */
      if(inDispatchBase(t,d)){
        baseHead++;
        const arr=jobsFor(t,d);            /* จับคู่งานด้วยรหัส พจส. ให้ตรงกับปุ่มในตารางหน้า 1 */
        const nDone=arr.length;
        if(nDone)dispatched++; else pendingDispatch++;
        if(nDone>=2)disp2++;
        if(nDone>=3)disp3++;
        arr.forEach(j=>{if(j&&j.id!==undefined)inBaseIds.add(j.id);});
      }
    }
  }
  const scheduled=total-off;      // ต้องมาทำงานวันนี้ (ตามตารางกะ)
  const actual=present+late+ot;   // มาทำงานจริงทั้งหมด (รวมสาย + OT)
  /* ---- การกระทบยอดใบงานให้ตรงกับหน้า 3 ----
     jobsTotal = firstTrips + extraTrips + jobsOutside  (ปิดยอดพอดีทุกกรณีโดยโครงสร้าง)
     firstTrips = dispatched (คนในฐานที่มีงาน นับคนละ 1 ใบแรก)
     extraTrips = ใบที่เกินเที่ยวแรกของคนในฐาน (รวมเที่ยว 3, 4, … ไม่ต้องพึ่ง disp2/disp3)
     jobsOutside = ใบงานที่เจ้าของไม่อยู่ในฐาน หรือหาแถวเจ้าของไม่เจอ */
  const jobsTotal=(day&&Array.isArray(day.jobs))?day.jobs.length:0;
  const jobsInBase=inBaseIds.size;
  const extraTrips=Math.max(0,jobsInBase-dispatched);
  const jobsOutside=Math.max(0,jobsTotal-jobsInBase);
  return {running,present,absent,leave,off,ot,late,unchecked,total,scheduled,actual,
          dispatched,pendingDispatch,disp2,disp3,
          baseHead,jobsTotal,jobsInBase,extraTrips,jobsOutside};
}
/* ใบงานที่ไม่อยู่ในฐาน + เหตุผล — ใช้ทั้งในหน้าต่างรายละเอียดและการกระทบยอด */
function outsideJobs(){
  const jobs=(day&&Array.isArray(day.jobs))?day.jobs:[];
  const inBase=new Set();
  (config||[]).forEach(t=>(t.drivers||[]).forEach(d=>{
    if(inDispatchBase(t,d))jobsFor(t,d).forEach(j=>{if(j&&j.id!==undefined)inBase.add(j.id);});
  }));
  return jobs.filter(j=>j&&!inBase.has(j.id)).map(j=>{
    const t=truckByNo(j.mainTruck||j.truck);
    let why;
    if(!t)why='เบอร์รถ "'+(j.mainTruck||j.truck||'(ว่าง)')+'" ไม่มีอยู่ในตารางกะของวันนี้';
    else if(t.type==='trainee')why='อยู่บนรถ trainee (พจส. ใหม่ / รอเบอร์รถ)';
    else{
      const d=(t.drivers||[]).find(x=>jobsFor(t,x).some(y=>y.id===j.id));
      if(!d)why='ไม่มีแถวไหนในหน้า 1 จับคู่ใบงานนี้ได้ (รหัส พจส. "'+(j.code||'(ว่าง)')+'" ไม่อยู่บนรถคันนี้ และไม่มีคนอยู่กะ '+j.shift+')';
      else{
        const v=attStat(t,d);
        if(isOff(t,d,curDate))
          why='พจส. '+(d.name||'')+' วันนี้เป็นวันหยุดตามตารางกะ และยังไม่ได้กด "＋ มาทำ OT"';
        else{
          const th={absent:'ขาด',leave:'ลา','':'ยังไม่เช็กสถานะการมาทำงาน'}[v]||v;
          why='พจส. '+(d.name||'')+' สถานะวันนี้คือ "'+th+'" จึงไม่อยู่ในฐานคนที่มาทำงาน';
        }
      }
    }
    return {j:j,why:why};
  });
}

/* ตัวกรองสถานะการจ่ายงานของหน้า 1 (มา/สายแล้ว -> จ่ายแผนงานเที่ยวแรกไปแล้วหรือยัง) */

/* คนนี้เข้าเกณฑ์การ์ด "จ่ายงานแล้ว"/"เหลือรอจ่ายงาน" หรือไม่ (ต้องตรงกับวิธีนับใน kpis) */
function dispatchState(t,d){

}

function parseStart(shift){if(!shift)return null;const m=String(shift).match(/(\d{1,2}):(\d{2})/);if(!m)return null;return ((+m[1])%24)*60+(+m[2]);}
/* ---- เวลากะที่ใช้จริงของ พจส. ในวันหนึ่ง ----
   ไฟล์ตารางกะมี 2 ชุดเวลา + วันที่ให้เปลี่ยนของแต่ละคัน (รอให้ถึงรอบวันหยุดก่อน)
   ถ้าวันที่ดู >= วันเปลี่ยน -> ใช้เวลาชุดใหม่ ไม่งั้นใช้ชุดเดิม            */
function shiftOf(d,ds){
  if(!d)return '';
  ds=ds||curDate;
  if(d.shift2&&d.shiftFrom&&String(ds)>=String(d.shiftFrom))return d.shift2;
  return d.shift||'';
}
/* พจส. คนนี้มีคิวเปลี่ยนเวลากะที่ยังไม่ถึงหรือไม่ */
function shiftPending(d,ds){
  ds=ds||curDate;
  return !!(d&&d.shift2&&d.shiftFrom&&String(ds)<String(d.shiftFrom)&&d.shift2!==d.shift);
}
/* แปลงค่าวันที่จาก Excel: รับได้ทั้งเลข serial, "19 Jul 26", "19/07/2026", "2026-07-19" */
const MON3={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function xlDate(v){
  if(v===null||v===undefined||v==='')return '';
  if(typeof v==='number'&&isFinite(v)&&v>20000){
    const d=new Date(Date.UTC(1899,11,30)+v*86400000);
    return d.toISOString().slice(0,10);
  }
  const t=String(v).trim();
  let m=t.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=t.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{2,4})/);
  if(m){const mo=MON3[m[2].toLowerCase()];let y=+m[3];if(y<100)y+=2000;
    if(mo)return y+'-'+String(mo).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');}
  m=t.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;if(y>2400)y-=543;
    return y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');}
  const dt=new Date(t);
  return isNaN(dt.getTime())?'':dt.toISOString().slice(0,10);
}
function parseEnd(shift){
  if(!shift)return null;
  const m=String(shift).match(/(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/);
  if(!m)return null;
  return ((+m[3])%24)*60+(+m[4]);
}
function shiftDuration(shift){
  const a=parseStart(shift), b=parseEnd(shift);
  if(a===null||b===null)return null;
  let dur=b-a; if(dur<=0)dur+=1440;      /* กะข้ามเที่ยงคืน */
  return dur;
}
function startLabel(shift){if(!shift)return '-';const m=String(shift).match(/(\d{1,2}:\d{2})/);return m?m[1]:'-';}
function shiftCls(pos){return pos==='1'?'m':pos==='2'?'a':'n';}

function fitTableHeight(){
  const boxes=document.querySelectorAll('#view .tablewrap.fitv');
  if(!boxes.length)return;
  const sy=window.scrollY||window.pageYOffset||0;
  const reserve=74;                 /* เผื่อท้ายหน้า + ระยะล่าง 1 ซม. */
  boxes.forEach(b=>{
    const docTop=b.getBoundingClientRect().top+sy;
    const h=window.innerHeight-docTop-reserve;
    b.style.maxHeight=Math.max(260,Math.round(h))+'px';
  });
}
window.addEventListener('resize',()=>{clearTimeout(window.__fitT);window.__fitT=setTimeout(fitTableHeight,120);});
function keepScroll(){
  const y=window.scrollY||window.pageYOffset||0;

}

function scrollToCurrentHour(){

function rollCallTable(){
  let list=[];
  for(const t of config)for(const d of (t.drivers||[]))list.push({t,d,startMin:parseStart(rowShift(t,d))});
  list=list.filter(r=>{
    const off=isOff(r.t,r.d,curDate);
    if(filter==='work'&&off)return false;
    if(filter==='off'&&!off)return false;
    if(filter==='incomplete'){const cur=attStat(r.t,r.d);if(off||cur)return false;}
    if(STATUS_FILTERS[filter]){const cur=attStat(r.t,r.d);if(cur!==filter)return false;}

    return true;
  });
  list.sort((a,b)=>{const x=a.startMin==null?99999:a.startMin,y=b.startMin==null?99999:b.startMin;return x-y||a.t.truckNo.localeCompare(b.t.truckNo);});
  let body='';

/* ==================== เชื่อมต่อระบบ OMS (ส่งแผนงาน) ====================
   เบราว์เซอร์เรียก http:// จากหน้า https:// ไม่ได้ และปลายทางไม่เปิด CORS
   จึงส่งผ่าน Apps Script เป็นตัวกลาง                                       */
let omsAuto = true;                  /* กดจ่ายงาน = ส่งเข้า OMS ทันที (ปิดได้ที่ ⚙ ตั้งค่า) */
/* หมายเหตุ: เดิมมีตัวเลือก "ค่าหลังเลขที่ใบงาน" — เอาออกแล้ว
   เพราะเลขหลัง : เป็นส่วนหนึ่งของเลขที่ใบงาน ต้องกรอกที่หน้า 5 ให้ครบ */

async function loadOmsCfg(){

    const a=await store.get('fleet:oms:auto');
    if(a!==null&&a!==undefined&&String(a)!=='')omsAuto=(String(a)==='1');   /* ไม่เคยตั้ง = เปิดไว้ */
  }catch(e){}
}
async function saveOmsCfg(){
  await store.set('fleet:oms:auto', omsAuto?'1':'0');
}
/* ---- หมายเหตุประจำตัวรถ สำหรับตาราง 2.3 "รถ 0 รอบ" หน้า 6 (2026-08-19) ----
   *** เก็บแยกคนละที่กับหมายเหตุของแหล่งที่มา *** ตามที่ผู้ใช้สั่ง
     day.dnote      = หมายเหตุต่อกะ ที่ CC พิมพ์ในหน้า 1  -> ห้ามแตะ
     day.truckNote  = หมายเหตุรถรายวัน ของรุ่นก่อน        -> ห้ามแตะ
     truckNotes     = ที่เก็บใหม่ 1 คัน 1 ข้อความ ไม่ผูกกับวัน เปลี่ยนช่วงวันแล้วยังเห็นข้อความเดิม
   เก็บเป็นคีย์เดียวทั้งกอง (`fleet:trucknote`) เพราะเป็นข้อมูลของ "ตัวรถ" ไม่ใช่ของวัน */
let truckNotes={};
async function loadTruckNotes(){
  try{
    const raw=await store.get('fleet:trucknote');
    const o=raw?JSON.parse(raw):null;
    truckNotes=isPlain(o)?o:{};
  }catch(e){ truckNotes={}; }
}
let truckNoteTimer=null;
function saveTruckNotesSoon(){
  clearTimeout(truckNoteTimer);
  truckNoteTimer=setTimeout(async()=>{
    flag('saving');
    const ok=await store.set('fleet:trucknote',JSON.stringify(truckNotes));
    flag(ok?'ok':'err');
  },700);                     /* หน่วงไว้ให้พิมพ์จบก่อน ไม่ยิงทุกตัวอักษร */
}
function truckNoteOf(no){const v=truckNotes[String(no)];return (v===undefined||v===null)?'':String(v);}
/* เลขที่ใบงานของงานหนึ่ง ๆ — ดึงจากทะเบียนหน้า 5 ตามสินค้า+ต้นทาง+ปลายทาง */
function woOf(j){
  const P=(j.product||'').trim(), O=(j.origin||'').trim(), D=(j.dest||'').trim();
  const r=routes.find(x=>(x.product||'').trim()===P&&(x.origin||'').trim()===O&&(x.dest||'').trim()===D)
       || routes.find(x=>(x.product||'').trim()===P&&(x.origin||'').trim()===O)
       || routes.find(x=>(x.product||'').trim()===P);
  return r ? String(r.wo||'').trim() : '';
}
/* ประกอบข้อมูลที่จะส่ง */
/* จัดรูปเลขที่ใบงานให้เป็น workList ตามที่ OMS ต้องการ
   ** ส่งตรงตามที่กรอกในหน้า 5 ทุกตัวอักษร ห้ามแตะเลขห้อยท้ายหลัง : **
   รองรับหลายใบงาน: พิมพ์คนละบรรทัด หรือคั่นด้วยจุลภาค                    */
function normWorkList(raw){
  return String(raw||'')
    .replace(/[\r\n;|]+/g,',')      /* ขึ้นบรรทัดใหม่ = คั่นรายการ */
    .split(',')
    .map(x=>x.replace(/\s+/g,'').trim())
    .filter(x=>x.length)
    .join(',');
}
function omsPayload(j){
  const t=truckByNo(j.mainTruck||j.truck), d=driverOfJob(t,j);
  /* ต้องยึด "รหัสที่บันทึกไว้ตอนจ่ายงาน" ก่อนเสมอ — ถ้าไปหยิบจากตารางกะตามตำแหน่งกะ
     แล้วตารางกะชุดใหม่สลับตำแหน่ง จะส่งรหัส พจส. ของคนอื่นไป OMS (บัคที่พบ 2026-08-13) */
  const empId=String(j.code||(d&&d.code)||'').trim();
  /* เบอร์รถที่ส่งไป OMS = "เบอร์รถที่วิ่งจริง" ที่ CC กรอกไว้เสมอ ไม่ใช่รถประจำตัว/ประจำกะ
     เพราะวันที่สับรถ รถที่วิ่งงานจริงคือคันที่ CC กรอก · CC กรอกเบอร์ไหน ส่งเบอร์นั้นไปตรง ๆ
     ถอยไปใช้รถประจำตัวเฉพาะกรณีช่องวิ่งจริงว่าง (ข้อมูลเก่าก่อนมีช่องนี้) */
  const truckId=String(j.actualTruck||j.mainTruck||j.truck||'').trim();
  const wo=woOf(j);
  const workList=normWorkList(wo);
  const miss=[], warn=[];
  if(!empId)  miss.push('รหัส พจส.');
  if(!truckId)miss.push('เบอร์รถที่วิ่งจริง');
  if(!workList)miss.push('เลขที่ใบงาน (ตั้งที่หน้า 5)');
  /* เตือนถ้าไม่มีเลขห้อยท้าย — OMS ต้องมี เช่น WOO5000000:11 */
  const noSuffix=workList.split(',').filter(x=>x&&x.indexOf(':')<0);
  if(noSuffix.length)warn.push('ไม่มีเลขห้อยท้ายหลัง : → '+noSuffix.join(' , '));
  return { empId, truckId, wo, workList, jobId:String(j.id), miss, warn };
}
/* แปลงคำตอบให้เป็นรูปแบบเดียว {ok,message,doc,url}
   Apps Script บางเส้นทาง (เช่น dryRun) ตอบเป็น {ok,message,doc,url} อยู่แล้ว
   แต่เส้นทางส่งจริงจะ forward คำตอบดิบจากระบบ OMS (MIB) มาตรงๆ ซึ่งใช้ชื่อฟิลด์ต่างกัน
   คือ {result:'SUCCESS'/'FAIL'/…, resultMessage, woHeaderDocId} — ต้อง map เอง ไม่งั้น
   ฝั่งหน้าเว็บจะไม่เห็นทั้งข้อความและเลขที่เอกสารแม้ OMS ตอบสำเร็จจริง */
function omsInterpret(d){
  if(!d)return {ok:false,message:'ไม่มีคำตอบจากระบบกลาง',doc:''};
  if(typeof d.ok==='boolean')
    return {ok:d.ok,message:String(d.message||d.resultMessage||''),doc:String(d.doc||d.woHeaderDocId||''),url:d.url};
  if(d.result!==undefined){
    const okResult=['SUCCESS','PASS','OK','TRUE','1'].includes(String(d.result).toUpperCase());
    return {ok:okResult,message:String(d.resultMessage||(okResult?'':'ระบบ OMS ปฏิเสธ (ไม่ระบุสาเหตุ)')),doc:String(d.woHeaderDocId||'')};
  }
  return {ok:false,message:'รูปแบบคำตอบจากระบบกลางไม่ถูกต้อง',doc:''};
}
/* ยิงจริง (หรือทดลอง) ผ่าน Apps Script */
async function omsSend(j,dry){
  if(!backendURL)return {ok:false,message:'ยังไม่ได้ตั้ง URL ระบบกลาง'};
  const p=omsPayload(j);
  if(p.miss.length)return {ok:false,message:'ข้อมูลไม่ครบ: '+p.miss.join(' · ')};
  try{
    const r=await fetch(backendURL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({omsplan:1,tk:API_TOKEN,dryRun:dry?1:0,
        empId:p.empId,truckId:p.truckId,workList:p.workList,jobId:p.jobId})});
    const d=await r.json();
    return omsInterpret(d);
  }catch(e){return {ok:false,message:'ต่อระบบกลางไม่ได้'};}
}
/* ส่งแล้วบันทึกผลกลับไปที่งาน */
async function omsSendAndSave(j,force){
  if(!j)return;
  if(j.omsDoc&&!force)return;                      /* ส่งสำเร็จแล้ว ไม่ส่งซ้ำเอง */
  setJobField(j,'omsState','sending');saveDay();renderDispatch();
  const r=await omsSend(j,false);
  setJobField(j,'omsState', r.ok?'ok':'err');
  setJobField(j,'omsMsg',  String(r.message||'').slice(0,200));
  setJobField(j,'omsAt',   nowHM());
  if(r.ok&&r.doc)setJobField(j,'omsDoc',String(r.doc));
  saveDay();renderDispatch();
  return r;
}
