/* ---- แก้รายละเอียดงานที่จ่ายไปแล้ว (สินค้า/ต้นทาง/ปลายทาง) ----
   ตัวเลือกมาจากทะเบียนหน้า 5 เท่านั้น · แก้แล้วระยะทางกับประเภทงานตามให้เอง
   ซึ่งทำให้ เวลาถึงต้นทาง หน้า 3 · การจัดกลุ่มหน้า 4 · ไฟล์ Excel เปลี่ยนตามทั้งหมด */
function applyRouteToJob(j){
  const P=(j.product||'').trim(),O=(j.origin||'').trim(),D=(j.dest||'').trim();
  const r=routes.find(x=>(x.product||'').trim()===P&&(x.origin||'').trim()===O&&(x.dest||'').trim()===D)
       ||routes.find(x=>(x.product||'').trim()===P&&(x.origin||'').trim()===O)
       ||routes.find(x=>(x.product||'').trim()===P);
  if(r){
    if(r.distance)j.distance=String(r.distance);
    if(r.type)j.type=r.type;
  }
}
function jopt(v,cur,lab){return '<option value="'+esc(v)+'"'+(String(v)===String(cur)?' selected':'')+'>'+esc(lab||v||'(ไม่ระบุ)')+'</option>';}
function jselProduct(j){
  const cur=j.product||'';
  let h='';
  if(cur&&!routes.some(r=>r.product===cur))h+=jopt(cur,cur,cur+' (นอกทะเบียน)');
  JOBTYPES.forEach(t=>{
    const ps=[...new Set(routes.filter(r=>(r.type||'main')===t.k&&r.product).map(r=>r.product))];
    if(ps.length)h+='<optgroup label="'+esc(t.f)+'">'+ps.map(p=>jopt(p,cur)).join('')+'</optgroup>';
  });
  return '<select class="jsel" data-jf="product" data-id="'+j.id+'" title="แก้สินค้า/เส้นทาง">'+h+'</select>';
}
function jselOrigin(j){
  const cur=j.origin||'';
  const os=[...new Set(routes.filter(r=>r.product===j.product).map(r=>r.origin||''))];
  if(os.indexOf(cur)<0)os.unshift(cur);
  return '<select class="jsel" data-jf="origin" data-id="'+j.id+'" title="แก้ต้นทาง">'+os.map(o=>jopt(o,cur)).join('')+'</select>';
}
function jselDest(j){
  const cur=j.dest||'';
  const ds=[...new Set(routes.filter(r=>r.product===j.product&&(r.origin||'')===(j.origin||'')).map(r=>r.dest||''))];
  if(ds.indexOf(cur)<0)ds.unshift(cur);
  return '<select class="jsel" data-jf="dest" data-id="'+j.id+'" title="แก้ปลายทาง">'+ds.map(o=>jopt(o,cur)).join('')+'</select>';
}
/* คีย์เรียงคอลัมน์ของหน้า 2 — แชร์กันระหว่างตารางบนหน้าจอกับไฟล์ส่งออก
   เพื่อให้ไฟล์ Excel เรียงเหมือนที่ CC เห็นตรงหน้าเป๊ะ ๆ ไม่ใช่ลำดับดิบ */
const DISPATCH_SORTKEYS={
  date:x=>x.j.date||curDate, seq:x=>x.i+1, product:x=>x.j.product||'',
  origin:x=>x.j.origin||'', dest:x=>x.j.dest||'', code:x=>x.j.code||'',
  driver:x=>x.j.driver||'', mtruck:x=>x.j.mainTruck||x.j.truck||'',
  atruck:x=>x.j.actualTruck||'', trip:x=>+x.j.trip||0, type:x=>jtFull(jobType(x.j)),
  arrive:x=>jobArrive(x.j)||'~', depart:x=>x.j.depart||'~', by:x=>x.j.by||'',
  oms:x=>x.j.omsDoc?'1':(x.j.omsState==='err'?'2':'3')
};
/* แถวของหน้า 2 ตามลำดับที่แสดงอยู่จริง — ใช้ทั้งวาดตารางและส่งออก Excel */

function omsText(j){
  if(j.omsDoc)return 'ส่งแล้ว'+(j.omsAt?(' '+j.omsAt):'');
  if(j.omsState==='sending')return 'กำลังส่ง…';
  if(j.omsState==='err')return 'ไม่สำเร็จ'+(j.omsMsg?(' — '+j.omsMsg):'');
  return 'ยังไม่ได้ส่ง';
}

function effOrigin(){const s=document.getElementById('j_origin');return s?s.value:'';}
function effDest(){const s=document.getElementById('j_dest');return s?s.value:'';}
/* เลือกสินค้า -> ตัวเลือกต้นทางเฉพาะของสินค้านั้น */
function fillOrigins(keep){
  const p=document.getElementById('j_route').value;
  const os=[...new Set(routes.filter(r=>r.product===p).map(r=>r.origin||''))];
  const sel=document.getElementById('j_origin');
  sel.innerHTML=os.map(o=>`<option value="${esc(o)}">${esc(o||'(ไม่ระบุ)')}</option>`).join('');
  if(keep&&os.indexOf(keep)>=0)sel.value=keep;
  fillDests();
}
/* เลือกต้นทาง -> ตัวเลือกปลายทางเฉพาะคู่นั้น */
function fillDests(keep){
  const p=document.getElementById('j_route').value,o=document.getElementById('j_origin').value;
  const ds=[...new Set(routes.filter(r=>r.product===p&&(r.origin||'')===o).map(r=>r.dest||''))];
  const sel=document.getElementById('j_dest');
  sel.innerHTML=ds.map(x=>`<option value="${esc(x)}">${esc(x||'(ไม่ระบุ)')}</option>`).join('');
  if(keep&&ds.indexOf(keep)>=0)sel.value=keep;
  recalcDist();
}
/* ระยะทาง + ประเภทงาน ล็อกตามทะเบียนหน้า 5 */
function recalcDist(){
  const p=document.getElementById('j_route').value,o=effOrigin(),d=effDest();
  const r=routes.find(x=>x.product===p&&(x.origin||'')===o&&(x.dest||'')===d)
        ||routes.find(x=>x.product===p);
  const di=document.getElementById('j_distance');if(di)di.value=r?(r.distance||''):'';
  const ty=document.getElementById('j_type');if(ty)ty.value=r?(r.type||'main'):'main';
  const tt=document.getElementById('j_typetxt');if(tt)tt.value=jtFull(r?r.type:'main');
}

/* --- กฎเวลาเดินทาง: สายหลัก 3 ชม. / สายรอง หรือ <=100 กม. 1 ชม. --- */
const CHARGER_COUNT = 3;                 /* จำนวนตู้ชาร์จต่อต้นทาง */
function travelMin(j){
  const km = parseFloat(j.distance);
  if(!isNaN(km) && km <= 100) return 60;      /* ระยะไม่เกิน 100 กม. = สายสั้น */
  return jtLong(jobType(j)) ? 180 : 60;           /* ที่เหลือดูจากกลุ่มประเภทงาน */
}
function addMin(hm, mins){
  if(!hm) return null;
  const p = String(hm).split(':'), h = Number(p[0]), m = Number(p[1]);
  if(isNaN(h) || isNaN(m)) return null;
  const t = h*60 + m + mins;
  return { hm: String(Math.floor((t%1440)/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'),
           nextDay: t >= 1440 };
}
function hm2min(hm){
  if(!hm) return null;
  const p = String(hm).split(':'), h = Number(p[0]), m = Number(p[1]);
  return (isNaN(h)||isNaN(m)) ? null : h*60+m;
}
/* สถานะจากเวลาคาดการณ์เทียบเวลาปัจจุบัน */
/* สถานะดูจากช่องเวลาที่ CC กรอกจริงเท่านั้น (ไม่อิงเวลาคาดการณ์) */
function runStatus(j){
  if(j.closed)      return ['closed','b-done','ปิดงานแล้ว'];
  if(j.ret)         return ['back','b-charged','กำลังเดินทางกลับ'];
  if(j.chargeStart) return ['charge','b-charge','กำลังชาร์จ'];
  if(j.depart)      return ['run','b-run','กำลังเดินทาง'];
  return ['wait','b-wait','รอออก'];
}
/* รวมเวลาทำงาน: เวลาออก -> เวลาปิดงาน (ข้ามเที่ยงคืนได้) */
function workHours(j){
  const m = minutesBetween(j.depart, j.closed);
  return (m === null) ? '' : Math.round(m/60*10)/10;
}
/* รวมเวลาทำงานแบบสะสมทีละขั้นตอน: ออก -> ชาร์จ -> กลับ -> ปิดงาน
   บวกช่วงเวลาของแต่ละขั้นที่คีย์ไว้แล้วต่อกันไป (ข้ามเที่ยงคืนได้) */
const STEP_POINTS=[['ออก','depart'],['ชาร์จ','chargeStart'],['กลับ','ret'],['ปิดงาน','closed']];
function workBreakdown(j){
  const out={total:0,parts:[],closed:!!j.closed,started:!!j.depart,upto:''};
  if(!j.depart)return out;
  const pts=STEP_POINTS.filter(p=>j[p[1]]);
  let mins=0;
  for(let i=1;i<pts.length;i++){
    const m=minutesBetween(j[pts[i-1][1]],j[pts[i][1]]);
    if(m===null)continue;
    mins+=m;
    out.parts.push({label:pts[i-1][0]+'→'+pts[i][0],h:Math.round(m/60*10)/10});
  }
  out.total=Math.round(mins/60*10)/10;
  out.upto=pts.length?pts[pts.length-1][0]:'';
  return out;
}
/* ค่าที่ใช้ในไฟล์ Excel: ให้ตรงกับที่แสดงบนหน้าจอ */
function workHoursText(j){
  const b=workBreakdown(j);
  if(!b.started)return 'รอออก';
  if(!b.parts.length)return 'กำลังเดินทาง';
  return b.closed ? b.total : (b.total+' (กำลังเดินทาง)');
}
/* คิวชาร์จ: นับต่อเนื่องภายในต้นทางเดียวกัน วนกลับที่ตู้ 1 เมื่อครบ 3 ตู้ */
function chargerPlan(jobs){
  const used = {}, out = {};
  jobs.forEach(j=>{
    const key = (j.origin||'(ไม่ระบุต้นทาง)').trim();
    used[key] = (used[key]||0) + 1;
    out[j.id] = { no: ((used[key]-1) % CHARGER_COUNT) + 1, seq: used[key], origin: key };
  });
  return out;
}

/* ลำดับเที่ยวของ "เบอร์รถที่วิ่งจริง" ในวันนั้น เรียงตามเวลาออก
   งานที่ยังไม่มีเวลาออกต่อท้าย                                        */
function truckTripSeq(jobs){
  const by={}, out={};
  (jobs||[]).forEach(j=>{const t=String(j.actualTruck||j.mainTruck||j.truck||'-');(by[t]=by[t]||[]).push(j);});
  Object.keys(by).forEach(t=>{
    by[t].slice().sort((a,b)=>{
      const x=hm2min(a.depart), y=hm2min(b.depart);
      if(x===null&&y===null)return String(a.id).localeCompare(String(b.id));
      if(x===null)return 1;
      if(y===null)return -1;
      return x-y||String(a.id).localeCompare(String(b.id));
    }).forEach((j,i)=>{out[j.id]=i+1;});
  });
  return out;
}
/* อัปเดตแค่ตาราง ไม่ล้างทั้งหน้า เพื่อให้ช่องค้นหาไม่เสียโฟกัสระหว่างพิมพ์ (แบบเดียวกับหน้า 1) */

let routeSort={key:'seq',dir:1};      /* หน้า 5: ค่าเริ่มต้น = เรียงตามลำดับที่เพิ่ม (ไม่ใช่ตามประเภทงาน) */
let planFilter='all';                 /* หน้า 5: กรองตามประเภทงาน — ผูกกับการ์ดสรุปและปุ่มกรอง */
/* กรอง+เรียงเส้นทาง ใช้ร่วมกันทั้งตารางและการส่งออก Excel เพื่อให้ได้ผลตรงกันเสมอ
   ติด seq (ลำดับที่เพิ่มจริง) ไปกับแต่ละแถว เลขลำดับจึงคงที่ไม่เปลี่ยนตามการเรียง/กรอง */
function planData(){
  const q=(routeSearch||'').toLowerCase(), k=routeSort.key, dir=routeSort.dir;
  const data=routes.map((r,i)=>({r:r,seq:i+1}))
    .filter(o=>planFilter==='all'||(o.r.type||'main')===planFilter)
    .filter(o=>!q||((o.r.product||'')+' '+(o.r.origin||'')+' '+(o.r.dest||'')+' '+(o.r.wo||'')).toLowerCase().indexOf(q)>=0);
  data.sort((A,B)=>{
    if(k==='seq')return (A.seq-B.seq)*dir;
    let x=A.r[k],y=B.r[k];
    if(k==='distance'){x=+x||0;y=+y||0;return (x-y)*dir||(A.seq-B.seq);}
    return String(x||'').localeCompare(String(y||''),'th')*dir||(A.seq-B.seq);
  });
  return data;
}
/* ส่งออกทะเบียนเส้นทางเป็น Excel — ตามรายการที่แสดงอยู่ (ถ้ามีคำค้นจะได้เฉพาะที่กรอง) */

}

function minutesBetween(a,b){if(!a||!b)return null;const[ah,am]=a.split(':').map(Number);let[bh,bm]=b.split(':').map(Number);let x=ah*60+am,y=bh*60+bm;if(y<x)y+=1440;return y-x;}
/* ===== ตารางที่ 1: คนมาทำงานเทียบแผน รายชั่วโมง (00:00 -> ชั่วโมงปัจจุบัน +1) ===== */
function hourlyAttend(){
  const b = {};
  const mk = h => (b[h] = b[h] || {plan:0,present:0,ot:0,late:0,absent:0,leave:0,unchecked:0,off:0});
  for(const t of config){
    for(const d of (t.drivers||[])){
      const sm = parseStart(rowShift(t,d));                   /* ใช้เวลากะเดียวกับที่หน้า 1 จัดกลุ่ม/เรียง ไม่ให้คนละชั่วโมงกัน */
      const row = mk(sm === null ? -1 : Math.floor(sm/60));   /* ไม่มีเวลากะ -> เก็บไว้แถวพิเศษ ไม่ตกหล่น */
      const v = attStat(t,d);
      if(isOff(t,d,curDate)){ row.off++; if(v==='ot') row.ot++; continue; }
      row.plan++;
      if(v==='present') row.present++;
      else if(v==='late') { row.present++; row.late++; }
      else if(v==='ot') { row.present++; row.ot++; }
      else if(v==='absent') row.absent++;
      else if(v==='leave') row.leave++;
      else row.unchecked++;
    }
  }
  return b;
}
function tableAttend(){
  const b = hourlyAttend();
  /* "ล่วงหน้า"/"ชม.นี้" มีความหมายเฉพาะเมื่อกำลังดูข้อมูลของวันนี้ ถ้าเปิดดูวันอื่น (เช่นเมื่อวาน)
     ทุกชั่วโมงถือว่าจบวันแล้ว ต้องนับรวมยอดขาด/สาย/ลาให้ครบ ไม่ซ่อนไว้ตามนาฬิกาจริง (แก้บัค: เดิมใช้เวลานาฬิกาจริง
     ไม่ผูกกับ curDate ทำให้เปิดดูสรุปวันก่อนแล้วชั่วโมงหลังๆของวันนั้นถูกซ่อนยอดไปเงียบๆ) */
  const isToday = curDate===todayStr();
  const nowH = isToday ? new Date().getHours() : 24;
  const lastH = isToday ? Math.min(23, nowH + 1) : 23;          /* แสดงแผนล่วงหน้า 1 ชม. เฉพาะวันนี้ */
  let cp = 0, ca = 0;
  const list=[];
  const hoursToShow=[];
  if(b[-1])hoursToShow.push(-1);                 /* แถวคนที่ยังไม่ได้ใส่เวลากะ */
  for(let x=0;x<=lastH;x++)hoursToShow.push(x);
  for(const h of hoursToShow){
    const r = b[h] || {plan:0,present:0,ot:0,late:0,absent:0,leave:0,unchecked:0,off:0};
    const ahead = isToday && (h>=0) && (h > nowH);
    const actual = r.present;
    if(!ahead){ cp += r.plan; ca += actual; }
    const diff = ca - cp;
    const hl = (h<0) ? 'ไม่ระบุเวลากะ' : (String(h).padStart(2,'0') + ':00');
    const cls = ahead ? 'aheadrow' : (isToday && h===nowH ? 'nowrow' : '');
    list.push({h,r,ahead,actual,cp,ca,diff,cls,html:`<tr class="${cls}">
      <td class="mono" style="font-weight:600">${hl}${h===nowH?' <span class="tag">ชม.นี้</span>':''}${ahead?' <span class="tag" style="background:var(--m-bg);color:var(--off)">ล่วงหน้า</span>':''}</td>
      <td class="mono" style="text-align:center">${r.plan||'-'}</td>
      <td class="mono" style="text-align:center">${ahead?'<span class="cno">—</span>':(actual||'-')}${(!ahead&&r.ot)?` <span class="otyes">+${r.ot} OT</span>`:''}</td>
      <td class="mono" style="text-align:center;color:#b57608">${ahead?'':(r.late||'-')}</td>
      <td class="mono" style="text-align:center;color:var(--absent)">${ahead?'':(r.absent||'-')}</td>
      <td class="mono" style="text-align:center;color:var(--leave)">${ahead?'':(r.leave||'-')}</td>
      <td class="mono" style="text-align:center">${ahead?'':(r.unchecked?('<b style="color:var(--accent)">'+r.unchecked+'</b>'):'-')}</td>
      <td class="mono" style="text-align:center">${r.off||'-'}</td>
      <td class="mono" style="text-align:center">${ahead?'':cp}</td>
      <td class="mono" style="text-align:center">${ahead?'':ca}</td>
      <td class="mono" style="text-align:center;font-weight:600;color:${diff<0?'var(--absent)':'var(--present)'}">${ahead?'':(diff>0?'+':'')+diff}</td>
    </tr>`});
  }
  let rows=sortBy('sum1',list,{hour:x=>x.h,plan:x=>x.r.plan,actual:x=>x.actual,late:x=>x.r.late,
    absent:x=>x.r.absent,leave:x=>x.r.leave,unchecked:x=>x.r.unchecked,off:x=>x.r.off,
    cp:x=>x.cp,ca:x=>x.ca,diff:x=>x.diff}).map(x=>x.html).join('');
  /* แถวรวมทั้งวัน — นับทุกชั่วโมงรวมที่ยังไม่ถึงเวลา ให้ตรงกับการ์ดหน้า 1 */
  const T={plan:0,present:0,late:0,absent:0,leave:0,unchecked:0,off:0,ot:0};
  Object.keys(b).forEach(k=>{const r=b[k];['plan','present','late','absent','leave','unchecked','off','ot'].forEach(f=>T[f]+=r[f]||0);});
  const tdif=T.present-T.plan;
  rows+=`<tr style="background:var(--nav);color:#fff">

/* ===== ตารางที่ 2: งานหลักรายสินค้า / งานรอง เทียบแผนที่ CC กรอก ===== */
let planMigDate='';
/* ย้ายแผนงานเดิมที่เก็บด้วยชื่อสินค้าอย่างเดียว -> คีย์ "กลุ่ม|สินค้า" (ทำครั้งเดียวต่อวัน) */
function migratePlanKeys(){
  if(!day||!isPlain(day.plan))return false;
  let changed=false;
  Object.keys(day.plan).forEach(k=>{
    if(k.indexOf('|')>=0)return;                       /* คีย์ใหม่แล้ว */
    const val=day.plan[k];
    if(val===''||val===undefined||val===null){return;}
    const g=(k==='__vt')?'vt':(()=>{const r=routes.find(x=>x.product===k);return r?(r.type||'main'):'main';})();
    const nk=g+'|'+(k==='__vt'?'':k);
    if(k!=='__vt'&&(day.plan[nk]===undefined||day.plan[nk]===''))setFlat('plan',nk,val);
    setFlat('plan',k,'');                              /* เคลียร์คีย์เก่า (ใช้ '' เพื่อให้ส่งถึงเครื่องอื่นด้วย) */
    changed=true;
  });
  return changed;
}
function tablePlanVsActual(){
  if(planMigDate!==curDate){planMigDate=curDate;if(migratePlanKeys())saveDay();}
  /* นับงานจริงแยกตามกลุ่มและสินค้า */
  const act={}; JOBTYPES.forEach(x=>act[x.k]={});
  for(const j of day.jobs){
    const g=jobType(j);
    const p=j.product||'(ไม่ระบุสินค้า)';
    act[g][p]=(act[g][p]||0)+1;
  }
  const pk=(g,p)=>g+'|'+p;                       /* คีย์ใหม่: แยกตามกลุ่ม */
  const pv=(g,p)=>{const v=day.plan[pk(g,p)];return (v===undefined||v===null||v==='')?'':v;};
  const GRP=JOBTYPES.map(x=>[x.k,x.f,x.k]);
  let gPlan=0,gAct=0,html='';

  GRP.forEach(([g,lab,cls])=>{
    /* รายการสินค้าของกลุ่ม = จากทะเบียนหน้า 5 + สินค้าที่วิ่งจริงวันนี้ */
    const prods=routeProducts(g).slice();
    Object.keys(act[g]).forEach(p=>{if(prods.indexOf(p)<0)prods.push(p);});
    let sp=0,sa=0,rows='';
    const sortedP=sortBy('sum2',prods.map(p=>({p,plan:Number(pv(g,p))||0,a:act[g][p]||0})),
      {product:x=>x.p,plan:x=>x.plan,actual:x=>x.a,diff:x=>x.a-x.plan,pct:x=>x.plan?x.a/x.plan:0}).map(x=>x.p);
    const is1212=p=>String(p).indexOf('รับตรง')>=0;
    const ordered=(g==='main')?sortedP.filter(p=>!is1212(p)).concat(sortedP.filter(is1212)):sortedP;
    let sepDone=false;
    ordered.forEach(p=>{
      if(g==='main'&&is1212(p)&&!sepDone&&sumProdOpen[g]){
        sepDone=true;
        rows+=`<tr><td colspan="5" style="padding:6px 12px 4px 22px;background:#f4f8fd">
          <span class="tag m1212">งานสายยาว-ขึ้นเอง</span> <span class="cno">รถวิ่งงานยาว ขึ้นของเองจากต้นทาง · เกณฑ์ 12 ชม.</span></td></tr>`;
      }
      const plan=Number(pv(g,p))||0, a=act[g][p]||0;
      sp+=plan; sa+=a;
      if(!sumProdOpen[g])return;
      const diff=a-plan, pct=plan?Math.round(a/plan*100):null;
      const inReg=routes.some(r=>r.product===p&&r.type===g);
      rows+=`<tr>
        <td style="padding-left:22px">${esc(p)}${inReg?'':' <span class="tag" title="ยังไม่มีในทะเบียนหน้า 5">นอกทะเบียน</span>'}
          ${inReg?`<button class="del" data-delprod="${esc(p)}" data-grp2="${g}" title="ลบรายการนี้ออกจากกลุ่ม" style="float:right">✕</button>`:''}</td>
        <td style="text-align:center"><input class="planin mono" inputmode="numeric" data-planprod="${esc(pk(g,p))}" value="${esc(pv(g,p))}" placeholder="-"></td>
        <td class="mono" style="text-align:center;font-weight:600">${a}</td>
        <td class="mono" style="text-align:center;color:${diff<0?'var(--absent)':'var(--present)'}">${(plan||a)?((diff>0?'+':'')+diff):'-'}</td>
        <td class="mono" style="text-align:center">${pct!==null?(pct+'%'):'<span class="cno">-</span>'}</td></tr>`;
    });
    gPlan+=sp; gAct+=sa;
    const open=sumProdOpen[g];
    const gdif=sa-sp;
    html+=`<tr class="grouphdr" style="position:static">
        <td style="padding:8px 12px">
          <button class="btn mini" data-grp="${g}" style="margin-right:8px">${open?'▲ ยุบ':'▼ ขยาย'}</button>
          <span class="jtype ${cls}">${lab}</span> <span class="cno">${prods.length} รายการ</span></td>
        <td class="mono" style="text-align:center;font-weight:600">${sp||'-'}</td>
        <td class="mono" style="text-align:center;font-weight:600">${sa}</td>
        <td class="mono" style="text-align:center;font-weight:600;color:${gdif<0?'var(--absent)':'var(--present)'}">${(sp||sa)?((gdif>0?'+':'')+gdif):'-'}</td>
        <td class="mono" style="text-align:center;font-weight:600">${sp?Math.round(sa/sp*100)+'%':'-'}</td>
      </tr>${rows}`;
    if(open)html+=`<tr><td colspan="5" style="padding:8px 12px 12px 22px">
        <input id="newprod_${g}" class="rin" style="width:230px;display:inline-block" placeholder="ชื่อสินค้า/เส้นทางใหม่ในกลุ่ม${lab}">
        <button class="miniadd" data-addgrp="${g}">＋ เพิ่มเข้ากลุ่มนี้</button>
        <span class="cno" style="margin-left:6px">เพิ่มแล้วไปใส่ต้นทาง/ปลายทาง/ระยะทางต่อที่หน้า 5</span></td></tr>`;
  });

  const gd=gAct-gPlan;
  return `<div class="card">
    <div class="cardhead"><h2>2 · ปริมาณงานเทียบแผน (แยกตามประเภทงาน 4 กลุ่ม)</h2></div>
    <div class="tablewrap sbox"><table style="min-width:660px"><thead><tr>
      ${thS('sum2','product','สินค้า / เส้นทาง')}${thS('sum2','plan','แผน (เที่ยว)','center')}${thS('sum2','actual','วิ่งจริง','center')}${thS('sum2','diff','ผลต่าง','center')}${thS('sum2','pct','% ของแผน','center')}
    </tr></thead><tbody>${html}
      <tr style="background:var(--nav);color:#fff">
        <td style="font-weight:600;color:#fff">รวมทั้งหมด (ทุกประเภทงาน)</td>
        <td class="mono" style="text-align:center;font-weight:600">${gPlan||'-'}</td>
        <td class="mono" style="text-align:center;font-weight:600;font-size:15px">${gAct}</td>
        <td class="mono" style="text-align:center;font-weight:600;color:${gd<0?'#ffb3aa':'#7fd6a8'}">${(gd>0?'+':'')+gd}</td>
        <td class="mono" style="text-align:center;font-weight:600">${gPlan?Math.round(gAct/gPlan*100)+'%':'-'}</td></tr>
    </tbody></table></div></div>`;
}

/* ===== ตารางที่ 3: เวลาการทำงานต่อเที่ยว (เกณฑ์ 8 ชม.) ===== */
function tableWorkTime(){
  /* แยกตามเกณฑ์เวลา 3 กลุ่ม: กะ 8 ชม. / งานสายยาว-ขึ้นเอง / สายสั้น 4 ชม. */
  const G={}; WT_GROUPS.forEach(x=>G[x.k]={ok:0,over:0,sum:0,n:0,run:0,list:[]});
  for(const j of day.jobs){
    const b=workBreakdown(j);
    if(!b.started)continue;
    const g=G[workGroup(j)];
    if(!b.closed){g.run++;continue;}
    g.n++; g.sum+=b.total;
    if(b.total>workLimit(j)){g.over++;g.list.push(j);}else g.ok++;
  }
  const T={ok:0,over:0,sum:0,n:0,run:0};
  WT_GROUPS.forEach(x=>{const g=G[x.k];T.ok+=g.ok;T.over+=g.over;T.sum+=g.sum;T.n+=g.n;T.run+=g.run;});
  const pc=(a,b)=>b?Math.round(a/b*100)+'%':'-';
  const bar=(ok,over,tot)=>{
    if(!tot)return '<div style="background:#eef1f5;border-radius:20px;height:9px"></div>';
    return `<div style="display:flex;height:9px;border-radius:20px;overflow:hidden;background:#eef1f5">
      <div style="width:${Math.round(ok/tot*100)}%;background:var(--present)"></div>
      <div style="width:${Math.round(over/tot*100)}%;background:var(--absent)"></div></div>`;
  };
  const row=x=>{
    const g=G[x.k];
    return `<tr>
      <td><b>${esc(x.name)}</b><div class="cno">${esc(x.who)}</div></td>
      <td class="mono" style="text-align:center;font-weight:600;color:var(--present)">${g.ok}</td>
      <td class="mono" style="text-align:center;color:var(--present)">${pc(g.ok,g.n)}</td>
      <td class="mono" style="text-align:center;font-weight:600;color:var(--absent)">${g.over}</td>
      <td class="mono" style="text-align:center;color:var(--absent)">${pc(g.over,g.n)}</td>
      <td class="mono" style="text-align:center;font-weight:600">${g.n}</td>
      <td class="mono" style="text-align:center">${g.n?(Math.round(g.sum/g.n*10)/10):'-'}</td>
      <td style="min-width:140px">${bar(g.ok,g.over,g.n)}</td></tr>`;
  };
  const overAll=[];
  WT_GROUPS.forEach(x=>G[x.k].list.forEach(j=>overAll.push({j:j,lim:workLimit(j)})));
  const overList=overAll.length
    ? '<div class="cno" style="margin-top:10px">เที่ยวที่เกินเกณฑ์: '
      + overAll.map(o=>esc((o.j.actualTruck||o.j.mainTruck||o.j.truck)+' '+(o.j.driver||'')
        +' ('+workBreakdown(o.j).total+'/'+o.lim+' ชม.)')).join(' · ') + '</div>'
    : '';
  return `<div class="card"><h2>3 · เวลาการทำงานต่อเที่ยว (แยกตามเกณฑ์)</h2>
    <div class="tablewrap sbox"><table style="min-width:820px"><thead><tr>
      <th>เกณฑ์ / ประเภทงานที่นับ</th>
      <th style="text-align:center">ไม่เกิน</th><th style="text-align:center">สัดส่วน</th>
      <th style="text-align:center">เกิน</th><th style="text-align:center">สัดส่วน</th>
      <th style="text-align:center">รวม</th><th style="text-align:center">เฉลี่ย (ชม.)</th><th>กราฟ</th>
    </tr></thead><tbody>
      ${WT_GROUPS.map(row).join('')}
      <tr style="background:var(--nav);color:#fff">
        <td style="font-weight:600;color:#fff">รวมทั้งหมด <span style="font-size:11px;opacity:.75">(เที่ยวที่ปิดงานแล้ว)</span></td>
        <td class="mono" style="text-align:center;font-weight:600">${T.ok}</td>
        <td class="mono" style="text-align:center">${pc(T.ok,T.n)}</td>
        <td class="mono" style="text-align:center;font-weight:600">${T.over}</td>
        <td class="mono" style="text-align:center">${pc(T.over,T.n)}</td>
        <td class="mono" style="text-align:center;font-weight:600">${T.n}</td>
        <td class="mono" style="text-align:center">${T.n?(Math.round(T.sum/T.n*10)/10):'-'}</td>
        <td class="cno" style="color:#c9d7ea">ยังวิ่งอยู่ ${T.run} เที่ยว</td></tr>
    </tbody></table></div>${overList}</div>`;
}

/* ===== ตารางที่ 4: จำนวนรอบต่อคัน (1 คัน = 3 กะ = เป้า 3 รอบ/วัน) ===== */
const TARGET_ROUNDS = 3;
/* ---- รถที่ถูกใช้วิ่งจริงแต่ไม่อยู่ในทะเบียนกองรถ ----
   คืนค่า: { list:[{truck,trips,closed,avg,origins:{},mains:{}}], trucks, trips }   */
function outsideData(){
  const known={}; config.forEach(t=>known[t.truckNo]=1);
  const map={};
  for(const j of (day.jobs||[])){
    const act=roundTruckOf(j);                    /* ใช้เกณฑ์เดียวกับตารางที่ 4 ตัวเลขจะได้ตรงกัน */
    if(!act||known[act])continue;
    const o=map[act]=map[act]||{truck:act,trips:0,closed:0,hrs:[],origins:{},mains:{}};
    o.trips++;
    const org=String(j.origin||'(ไม่ระบุต้นทาง)').trim();
    o.origins[org]=(o.origins[org]||0)+1;
    const mn=String(j.mainTruck||j.truck||'-').trim();
    o.mains[mn]=(o.mains[mn]||0)+1;
    const b=workBreakdown(j);
    if(b.closed){o.closed++;o.hrs.push(b.total);}
  }
  const list=Object.keys(map).sort((a,b)=>a.localeCompare(b,'th')).map(k=>{
    const o=map[k];
    o.avg=o.hrs.length?Math.round(o.hrs.reduce((a,b)=>a+b,0)/o.hrs.length*10)/10:null;
    return o;
  });
  return { list:list, trucks:list.length, trips:list.reduce((a,b)=>a+b.trips,0) };
}

/* เบอร์รถที่ใช้ "นับรอบ" ของใบงานหนึ่งใบ
   ยึดเลขรถที่วิ่งจริงเป็นหลัก ถ้า CC ยังไม่ได้กรอก จึงถอยไปใช้รถหลัก/รถประจำกะแทน */
function roundTruckOf(j){
  return String(j&&j.actualTruck||'').trim()
      || String(j&&j.mainTruck||'').trim()
      || String(j&&j.truck||'').trim()
      || '(ไม่ระบุ)';
}
function roundsData(){
  const per = {};
  for(const j of day.jobs){
    const no = roundTruckOf(j);                              /* นับรอบตามเบอร์รถที่วิ่งจริง */
    const p = per[no] = per[no] || {main:0,vt:0,oth:0,hrs:[],closed:0};
    p.byType=p.byType||{}; const gk=jobType(j);
    p.byType[gk]=(p.byType[gk]||0)+1;
    if(gk==='vt') p.vt++; else if(gk==='main') p.main++; else p.oth=(p.oth||0)+1;
    const b = workBreakdown(j);
    if(b.closed){ p.closed++; p.hrs.push(b.total); }
  }
  /* ---- เตรียมข้อมูลเป็นแถว ๆ ก่อน เพื่อให้เรียงได้ ---- */
  const known={}; config.forEach(t=>known[t.truckNo]=1);
  /* รถที่วิ่งงานจริงแต่ไม่อยู่ในทะเบียนกองรถ (รวมรถที่หลุดจากตารางกะไปแล้ว) ต้องไม่ตกหล่น
     ตอนนี้ตัดตามเลขรถวิ่งจริงชุดเดียวกับข้างบน จึงไม่นับซ้ำกับรถหลักอีกต่อไป */
  const outRows=Object.keys(per).filter(no=>!known[no])
    .sort((a,b)=>a.localeCompare(b,'th'))
    .map(no=>{
      const p=per[no];
      return { truck:no, route:'(รถนอกกอง)', came:0, crew:0, outside:true,
               rounds:p.main+p.vt+(p.oth||0), main:p.main, vt:p.vt, oth:p.oth||0,
               target:0, ok:true,
               avg: p.hrs.length ? Math.round(p.hrs.reduce((a,b)=>a+b,0)/p.hrs.length*10)/10 : null };
    });
  const data = config
    .filter(t => per[t.truckNo] || (t.drivers||[]).length >= TARGET_ROUNDS)
    .map(t=>{
      const p = per[t.truckNo] || {main:0,vt:0,oth:0,hrs:[],closed:0};
      const crew = (t.drivers||[]).length;
      let came = 0;
      for(const d of (t.drivers||[])){ const v = attStat(t,d); if(v==='present'||v==='ot') came++; }
      const rounds = p.main + p.vt + (p.oth||0);
      const target = Math.min(TARGET_ROUNDS, crew || TARGET_ROUNDS);
      return { truck:t.truckNo, route:t.routeGroup||'', came:came, crew:crew, outside:false,
               rounds:rounds, main:p.main, vt:p.vt, oth:p.oth||0, target:target, ok:rounds>=target,
               avg: p.hrs.length ? Math.round(p.hrs.reduce((a,b)=>a+b,0)/p.hrs.length*10)/10 : null };
    });

  return data.concat(outRows);
}
/* ตารางที่ 4: เงื่อนไขของชิปแต่ละอัน — ต้องให้จำนวนแถวหลังกรอง = ตัวเลขบนชิปเป๊ะ ๆ */
const ROUND_FILTERS = {
  hit : r=>!r.outside && r.rounds>=TARGET_ROUNDS,
  less: r=>!r.outside && r.rounds< TARGET_ROUNDS,
  r2  : r=>!r.outside && r.rounds===2,
  r1  : r=>!r.outside && r.rounds===1,
  r0  : r=>!r.outside && r.rounds===0
};
const ROUND_FILTER_LABELS = {
  hit:'ครบ '+TARGET_ROUNDS+' รอบขึ้นไป', less:'น้อยกว่า '+TARGET_ROUNDS+' รอบ',
  r2:'ได้ 2 รอบ', r1:'ได้ 1 รอบ', r0:'ยังไม่ได้วิ่ง (0 รอบ)'
};
function tableRounds(){
  const all = roundsData();
  /* ---- สรุปจำนวนคันตามรอบที่ทำได้ (นับจากชุดเต็มเสมอ ไม่ลดตามตัวกรอง) ---- */
  const inFleet = all.filter(r=>!r.outside);
  const c0 = inFleet.filter(r=>r.rounds===0).length;
  const c1 = inFleet.filter(r=>r.rounds===1).length;
  const c2 = inFleet.filter(r=>r.rounds===2).length;
  const cLess = inFleet.filter(r=>r.rounds<TARGET_ROUNDS).length;
  const cHit  = inFleet.filter(r=>r.rounds>=TARGET_ROUNDS).length;
  const OUTS = outsideData();

  /* ---- กรองตามชิปที่ CC กด (นับเฉพาะรถในกอง ให้ตรงกับตัวเลขบนชิป) ---- */
  const fn = ROUND_FILTERS[roundFilter];
  const data = fn ? all.filter(fn) : all.slice();

  /* ---- เรียงข้อมูลตามคอลัมน์ที่เลือก ---- */
  const dir = roundSort.dir;
  data.sort((a,b)=>{
    const k = roundSort.key;
    let x = a[k], y = b[k];
    if(k === 'avg'){ if(x===null) return 1; if(y===null) return -1; }
    if(k === 'ok'){ x = x?1:0; y = y?1:0; }
    if(typeof x === 'string') return x.localeCompare(y,'th') * dir || a.truck.localeCompare(b.truck,'th');
    return ((x||0) - (y||0)) * dir || a.truck.localeCompare(b.truck,'th');
  });

  const rows = data.map(r=>`<tr${r.outside?' style="background:#f4f8fd"':(r.ok?'':' style="background:#fdf6f5"')}>
      <td class="plate">${esc(r.truck)}${r.outside?' <span class="tag m1212">นอกกอง</span>':''}</td>
      <td class="cno">${esc(r.route||'-')}</td>
      <td class="mono" style="text-align:center">${r.outside?'<span class="cno">-</span>':(r.came+'/'+(r.crew||'-'))}</td>
      <td class="mono" style="text-align:center;font-size:15px;font-weight:600">${r.rounds}</td>
      <td class="mono" style="text-align:center">${r.main}</td>
      <td class="mono" style="text-align:center">${r.vt||'-'}</td>
      <td class="mono" style="text-align:center">${r.oth||'-'}</td>
      <td class="mono" style="text-align:center">${r.outside?'<span class="cno">-</span>':r.target}</td>
      <td class="mono" style="text-align:center">${r.avg!==null?r.avg+' ชม.':'<span class="cno">-</span>'}</td>
      <td style="text-align:center">${r.outside?'<span class="badge b-charge">นอกกอง</span>'
        :(r.ok?'<span class="badge b-done">ครบ</span>':`<span class="badge b-wait">ขาด ${r.target-r.rounds} รอบ</span>`)}</td>
    </tr>`).join('');

  /* ---- หัวตารางกดเรียงได้ ---- */
  const TH = [['truck','เบอร์รถ','left'],['route','ต้นทาง','left'],['came','คนขับมา','center'],
              ['rounds','รอบที่วิ่งได้','center'],['main','หลัก_BU4','center'],['vt','VT_BU4','center'],['oth','BU อื่น','center'],
              ['target','เป้า','center'],['avg','เฉลี่ย/รอบ','center'],['ok','สถานะ','center']];
  const head = TH.map(([k,lab,al])=>{
    const on = roundSort.key===k;
    return `<th class="th-sort${on?' on':''}" data-rsort="${k}" style="text-align:${al}" title="กดเพื่อเรียงข้อมูล">${lab}<span class="sortcaret">${on?(dir>0?'▲':'▼'):'⇅'}</span></th>`;
  }).join('');

  /* ---- ชิปสรุป กดเพื่อกรองตาราง กดซ้ำอันเดิมเพื่อยกเลิก ---- */
  const chip=(key,lab,val,cls)=>{
    const on = roundFilter===key;
    return `<span class="rchip pick ${cls||''}${on?' on':''}" data-rfilter="${key}"
      role="button" tabindex="0" aria-pressed="${on}"
      title="${on?'กดอีกครั้งเพื่อแสดงทุกคัน':'กดเพื่อดูเฉพาะรถกลุ่มนี้'}">${lab} <b>${val}</b> คัน</span>`;
  };
  const filtBar = roundFilter
    ? `<div class="roundsum" style="margin:-4px 0 10px">
         <span class="cno">กำลังกรอง: <b style="color:var(--ink)">${esc(ROUND_FILTER_LABELS[roundFilter]||'')}</b>
           — แสดง ${data.length} คัน จากทั้งหมด ${all.length} คัน</span>
         <span class="rchip clearf" id="clearRoundFilter" role="button" tabindex="0"
           title="ล้างตัวกรอง แสดงทุกคัน">✕ แสดงทุกคัน</span>
       </div>` : '';
  const emptyMsg = roundFilter ? 'ไม่มีรถในกลุ่มนี้' : 'ยังไม่มีข้อมูล';
  return `<div class="card">
    <div class="cardhead"><h2>4 · จำนวนรอบต่อคัน (1 คัน = 3 กะ = เป้า ${TARGET_ROUNDS} รอบ/วัน)</h2></div>
    <div class="roundsum">
      ${chip('hit','ครบ '+TARGET_ROUNDS+' รอบขึ้นไป',cHit,'ok')}
      ${chip('less','น้อยกว่า '+TARGET_ROUNDS+' รอบ',cLess,'warn')}
      <span class="rsep"></span>
      ${chip('r2','ได้ 2 รอบ',c2)}
      ${chip('r1','ได้ 1 รอบ',c1)}
      ${chip('r0','ยังไม่ได้วิ่ง (0 รอบ)',c0,'bad')}
      <span class="rchip outbox" id="outBox" title="กดดูรายละเอียดรถที่ไม่อยู่ในกอง">
        รถนอกกอง <b>${OUTS.trucks}</b> คัน · <b>${OUTS.trips}</b> เที่ยว ▸</span>
      <span class="cno" style="margin-left:auto">ในกอง ${inFleet.length} คัน</span>
    </div>
    ${filtBar}
    <div class="tablewrap sbox5"><table style="min-width:800px"><thead><tr>${head}</tr></thead>
    <tbody>${rows||`<tr><td colspan="10" class="empty-note">${emptyMsg}</td></tr>`}</tbody></table></div></div>`;
}

      <div class="stat ot"><div class="lab">กำลังวิ่งงาน (คัน)</div><div class="val mono">${runningTrucks}</div></div>

  if(sumFirst){scrollSumToNow();sumFirst=false;}else restore();

/* ================= ระบบแจ้งเตือน Alarm / Alert =================
   Alarm : เตือน CC ให้โทรติดตาม พจส. ล่วงหน้าก่อนเข้ากะ 30 นาที
   Alert : ถึงเวลาเข้ากะแล้วเกิน 10 นาที ยังไม่รายงานตัว -> ขึ้น "ขาด" ให้อัตโนมัติ
   ทั้งสองระบบไม่นับวันหยุดของ พจส.                                     */
const ALARM_LEAD   = 30;      /* แจ้งเตือนล่วงหน้า (นาที) */
const ALERT_GRACE  = 10;      /* ถึงเวลาแล้วเกินกี่นาทีถือว่าไม่รายงานตัว */
const ALERT_WINDOW = 180;     /* ไม่ย้อนแจ้งเตือน/ตีขาด ย้อนหลังเกินกี่นาที */
const WIDGET_MS    = 60000;   /* วิดเจทเด้งค้างไว้ 1 นาที */
/* ปิดฟีเจอร์ "ปิดยอดเป็นขาดอัตโนมัติเมื่อจบกะ" ตามที่ผู้ใช้สั่ง (2026-08-10)
   เหตุผล: ตัวนี้เคยเขียน "ขาด" ทับคนที่ CC บันทึกว่ามาแล้วจริง (ตอนโหลดข้อมูลของวันไม่สำเร็จ
   day กลายเป็นวันเปล่า ระบบจึงเข้าใจว่าไม่มีใครเช็ก) — ตอนนี้ให้ CC เป็นคนใส่สถานะเองทั้งหมด
   ระบบจะไม่เขียนข้อมูลเช็คชื่อของหน้า 1 เองอีกเลย เหลือแค่ "แจ้งเตือน" ซึ่งไม่แตะข้อมูล
   (ถ้าจะเปิดกลับ เปลี่ยนเป็น true — เงื่อนไขกันเขียนทับใน tickAlarms ยังอยู่ครบ) */
const AUTO_CLOSE_SHIFT = false;

let alarmList=[], alertList=[], alarmSeen={}, alertSeen={}, sweptSeen={};
let alarmTimer=null, alertTimer=null, tickTimer=null;

function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
/* วัดความสูงหัวเว็บจริง แล้วให้แถบแท็บตรึงพอดีใต้หัวเว็บ (หัวเว็บสูงไม่เท่ากันบนจอแคบ) */
function fitTabs(){
  const h=document.querySelector('header');
  if(!h)return;
  const px=Math.round(h.getBoundingClientRect().height);
  if(px>20)document.documentElement.style.setProperty('--hh',px+'px');   /* ถ้าวัดไม่ได้ ใช้ค่าสำรอง 56px */
}
if(window.ResizeObserver){
  const ro=new ResizeObserver(fitTabs);
  const hh=document.querySelector('header');
  if(hh)ro.observe(hh);
}
window.addEventListener('resize',fitTabs);
window.addEventListener('orientationchange',fitTabs);
function nKey(kind,what){return 'fleet:'+kind+what+':'+curDate;}
function loadNotify(){
  const rd=(k,dflt)=>{try{return JSON.parse(lsGet(k)||'null')||dflt;}catch(e){return dflt;}};
  alarmSeen=rd(nKey('alarm','seen'),{}); alertSeen=rd(nKey('alert','seen'),{}); sweptSeen=rd(nKey('swept','seen'),{});
  alarmList=rd(nKey('alarm','list'),[]); alertList=rd(nKey('alert','list'),[]);
  updateBells();
}
function saveNotify(){
  lsSet(nKey('alarm','seen'),JSON.stringify(alarmSeen)); lsSet(nKey('alert','seen'),JSON.stringify(alertSeen));
  lsSet(nKey('swept','seen'),JSON.stringify(sweptSeen));
  lsSet(nKey('alarm','list'),JSON.stringify(alarmList)); lsSet(nKey('alert','list'),JSON.stringify(alertList));
}
function driverItem(t,d){
  return {key:t.truckNo+':'+d.pos,truck:t.truckNo,pos:d.pos,name:d.name||'(ไม่ระบุชื่อ)',
          code:d.code||'',phone:d.phone||'',start:startLabel(shiftOf(d,curDate)),route:t.routeGroup||''};
}
function tickAlarms(){
  if(!config||!day)return;
  if(curDate!==todayStr()){updateBells();return;}     /* ดูวันย้อนหลัง ไม่ต้องเตือน */
  const now=nowMin();
  /* ปิดยอดอัตโนมัติได้ ต่อเมื่อมั่นใจว่ารู้สถานะจริงของวันนี้แล้วเท่านั้น
     (เดิม: ถ้าโหลดข้อมูลของวันไม่สำเร็จ day จะเป็นวันเปล่า แล้วระบบจะเขียน "ขาด"
      ทับคนที่ CC บันทึกว่ามาแล้ว — เห็นเวลามาจริงอยู่แต่สถานะเป็นขาด) */
  /* ตอนนี้ AUTO_CLOSE_SHIFT = false จึงเป็น false เสมอ = ระบบไม่เขียนข้อมูลหน้า 1 เองเลย
     เงื่อนไขที่เหลือคงไว้ เผื่อวันหน้าจะเปิดฟีเจอร์นี้กลับ จะได้ปลอดภัยตั้งแต่ต้น */
  const canSweep = AUTO_CLOSE_SHIFT && dayLoaded && !dirty && !saveBusy && !pendingOps.length && !lastWriteErr;
  let na=0, nl=0, swept=0, marked=false;
  for(const t of config){
    for(const d of (t.drivers||[])){
      if(isOff(t,d,curDate))continue;                 /* วันหยุดของ พจส. ไม่นับ */
      const sm=parseStart(shiftOf(d,curDate)); if(sm===null)continue;
      const k=t.truckNo+':'+d.pos;
      if(attStat(t,d)!=='')continue;                  /* เช็กแล้ว ไม่ต้องเตือน (ต้องผ่านตัวจับคู่ให้ตรงกับที่แสดงบนจอ) */
      const lead=sm-now, over=now-sm;
      if(lead>0 && lead<=ALARM_LEAD && !alarmSeen[k]){
        alarmSeen[k]=1; alarmList.push(driverItem(t,d)); na++;
      }
      /* เลยเวลาเข้ากะ -> เตือนอย่างเดียว ไม่เปลี่ยนสถานะให้ CC เป็นคนใส่เอง */
      if(over>=ALERT_GRACE && over<=ALERT_WINDOW && !alertSeen[k]){
        alertSeen[k]=1; alertList.push(driverItem(t,d)); nl++;
      }
      /* จบกะแล้วยังไม่มีใครเช็ก -> ปิดยอดเป็น "ขาด" เงียบ ๆ ไม่เด้งวิดเจท
         (ใช้ flag คนละตัวกับ Alert เพื่อให้คนที่เคยถูกเตือนแล้วยังถูกปิดยอดตอนจบกะ) */
      const dur=shiftDuration(shiftOf(d,curDate));
      if(canSweep && dur!==null && now>=sm && (now-sm)>=dur && !sweptSeen[k]){
        /* มีหลักฐานว่ามาทำงาน ห้ามปิดยอดเป็น "ขาด" เด็ดขาด
           - มีเวลามาจริงในช่อง = CC คีย์ไว้แล้ว
           - จ่ายแผนงานให้คนนี้ไปแล้ว = มาแน่นอน */
        if(attArr(t,d)){ sweptSeen[k]=1; continue; }
        if(jobsFor(t,d).length){ sweptSeen[k]=1; continue; }
        sweptSeen[k]=1; swept++;
        setAttend(t.truckNo,d.pos,'absent');                       /* ใช้ setAttend เพื่อประทับเจ้าของช่อง (attMeta) ด้วย */
        setCell('attendBy',t.truckNo,d.pos,'ระบบ (จบกะแล้วไม่มีการเช็ก)');
        marked=true;
      }
    }
  }
  if(marked){saveDay(); if(tab==='roster')renderRoster();}
  if(swept)console.warn('ปิดยอดอัตโนมัติ (จบกะแล้วไม่มีการเช็ก): '+swept+' คน');
  if(na||nl||swept)saveNotify();
  if(na)showAlarm();
  if(nl)showAlert();
  updateBells();
}

  let h=show.map(x=>`<div class="wrow">
    <div class="nm">${esc(x.name)}<span class="wsub">รหัส ${esc(x.code||'-')} · รถ ${esc(x.truck)} กะ${esc(x.pos)}${x.route?(' · '+esc(x.route)):''}</span></div>
    <div><a class="tel" href="tel:${esc((x.phone||'').replace(/[^0-9+]/g,''))}">${esc(x.phone||'-')}</a></div>
    <div class="tm">${esc(x.start)}</div>
    <button class="del wdel" data-wdel="${esc(x.key)}" title="เอาชื่อนี้ออกจากรายการ">✕</button></div>`).join('');
  if(list.length>show.length)h+=`<div class="wrow"><span class="wsub">และอีก ${list.length-show.length} คน (ดูทั้งหมดในหน้า 1)</span></div>`;
  return h;
}
function showAlarm(){
  if(!alarmList.length)return;
  const b=document.getElementById('alarmBox');
  b.innerHTML=`<div class="wtop"><span style="font-size:21px">⏰</span><span class="ttl">ติดตาม พจส.</span><span class="cno">${alarmList.length} คน</span></div>
    <div class="wlist">${widgetRows(alarmList,'alarm')}</div>
    <div class="wfoot"><span>เตือนล่วงหน้า ${ALARM_LEAD} นาที ก่อนเวลาเข้ากะ · กดเบอร์เพื่อโทร</span><button class="wclose" data-wclose="alarm">ปิด</button></div>`;
  b.style.display='block';
  clearTimeout(alarmTimer); alarmTimer=setTimeout(()=>closeWidget('alarm'),WIDGET_MS);

function showAlert(){
  if(!alertList.length)return;
  const b=document.getElementById('alertBox');
  b.innerHTML=`<div class="wtop"><span style="font-size:20px">🔔</span><span class="ttl">พจส. ยังไม่รายงานตัว</span><span style="font-size:12px">${alertList.length} คน</span></div>
    <div class="wlist">${widgetRows(alertList,'alert')}</div>
    <div class="wfoot"><span>เกินเวลาเข้ากะ ${ALERT_GRACE} นาที · <b>ยังไม่เปลี่ยนสถานะให้</b> กรุณาเช็กแล้วบันทึก มา / สาย / ขาด / ลา ที่หน้า 1</span><button class="wclose" data-wclose="alert">ปิด</button></div>`;
  b.style.display='block';
  clearTimeout(alertTimer); alertTimer=setTimeout(()=>closeWidget('alert'),WIDGET_MS);
}
function removeNotify(kind,key){
  if(kind==='alarm')alarmList=alarmList.filter(x=>x.key!==key);
  else               alertList=alertList.filter(x=>x.key!==key);
  saveNotify();
  const list=(kind==='alarm')?alarmList:alertList;
  if(!list.length)closeWidget(kind);
  else if(kind==='alarm')showAlarm(); else showAlert();
  updateBells();

function closeWidget(kind){
  const b=document.getElementById(kind==='alarm'?'alarmBox':'alertBox');
  if(b)b.style.display='none';
  clearTimeout(kind==='alarm'?alarmTimer:alertTimer);
  updateBells();
}
function updateBells(){
  const set=(btn,cnt,list,box)=>{
    const b=document.getElementById(btn); if(!b)return;
    b.style.display=list.length?'inline-block':'none';
    const c=document.getElementById(cnt); if(c)c.textContent=list.length;
    const open=document.getElementById(box) && document.getElementById(box).style.display==='block';
    b.classList.toggle('ring',!open&&list.length>0);
  };
  set('alarmBtn','alarmCount',alarmList,'alarmBox');
  set('alertBtn','alertCount',alertList,'alertBox');
  fitTabs();
}
function startAlarms(){
  loadNotify(); tickAlarms();
  clearInterval(tickTimer); tickTimer=setInterval(tickAlarms,30000);
}

document.getElementById('view').addEventListener('input',e=>{

    return;
  }
  if(e.target.dataset&&e.target.dataset.planprod!==undefined){
    const key=e.target.dataset.planprod,raw=String(e.target.value).replace(/[^0-9]/g,'');
    e.target.value=raw;
    setFlat('plan',key,(raw==='')?'':Number(raw));   /* ใช้ '' ไม่ใช่ delete เพื่อให้การล้างค่าส่งถึงเครื่องอื่นด้วย */
    saveDay();return;
  }
  if(e.target.id==='routeSearch'){routeSearch=e.target.value;updatePlanArea();return;}   /* เก็บค่าดิบ (ตัดช่องว่างตอนใช้ใน planData) และอัปเดตแค่ตาราง โฟกัส/เคอร์เซอร์จึงไม่หลุด */
  if(e.target.dataset&&e.target.dataset.rt!==undefined){
    const r=routes.find(x=>x.id===e.target.dataset.id);if(!r)return;
    const f=e.target.dataset.rt;

      if(f==='distance')e.target.value=r.distance;

        renderPlanCounts();                /* เลขบนการ์ด/ปุ่มกรองต้องตามด้วย ไม่ให้ค้างเลขเก่า */
      }

  if(e.target.dataset&&e.target.dataset.dnote!==undefined){

  await withBusy('กำลังดึงข้อมูลจาก Google Sheet…',async()=>{await loadConfig();await loadRoutes();await loadOmsCfg();await loadTruckNotes();await loadDay();});
  flag('ok');render();if(tab==='roster')scrollToCurrentHour();});
document.getElementById('modal').addEventListener('input',e=>{
  if(e.target.id==='omsOrphanSearch'){omsOrphanFilter();return;}
  if(e.target.id==='omsPairSearch'){omsPairFilter();return;}
  if(e.target.id==='j_truck'){fillShift();preselectRoute();fillOrigins();syncActual();syncDriverInfo();syncTrip();return;}
  if(e.target.id==='j_shift'){syncDriverInfo();return;}
  if(e.target.id==='j_route'){fillOrigins();return;}
  if(e.target.id==='j_origin'){fillDests();return;}
  if(e.target.id==='j_dest'){recalcDist();return;}
  if(e.target.id==='j_actual'||e.target.id==='j_trip'){e.target.dataset.touched='1';return;}
});
document.getElementById('modal').addEventListener('change',e=>{
  if(e.target.id==='imp_sheet'){
    const kf=(document.getElementById('imp_from')||{}).value||'';
    openImportDialog(e.target.value,kf);return;}      /* คงวันเริ่มมีผลที่ตั้งไว้ ไม่ให้เด้งกลับเป็นพรุ่งนี้เงียบ ๆ */
  if(e.target.dataset&&e.target.dataset.verfrom){
    const verId=e.target.dataset.verfrom, newFrom=e.target.value;
    if(newFrom){
      saveRosterVersions(list=>{const v=list.find(x=>x.id===verId);if(v)v.from=newFrom;return list;})
        .then(()=>{applyRosterForDate();openVersionDialog();render();});
    }
    return;}
  if(e.target.id==='j_truck'){fillShift();preselectRoute();fillOrigins();syncActual();syncDriverInfo();syncTrip();return;}
  if(e.target.id==='j_shift'){syncDriverInfo();return;}
  if(e.target.id==='j_route'){fillOrigins();return;}
  if(e.target.id==='j_origin'){fillDests();return;}
  if(e.target.id==='j_dest'){recalcDist();return;}
});
document.getElementById('view').addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.jf){
    const j=day.jobs.find(x=>String(x.id)===String(e.target.dataset.id));
    if(!j)return;
    const f=e.target.dataset.jf;
    j[f]=e.target.value;
    if(f==='product'){                       /* เปลี่ยนสินค้า -> ตั้งต้นทาง/ปลายทางของเส้นทางนั้นให้ */
      const r=routes.find(x=>x.product===j.product);
      if(r){j.origin=r.origin||'';j.dest=r.dest||'';}
    }else if(f==='origin'){                  /* เปลี่ยนต้นทาง -> เลือกปลายทางที่คู่กัน */
      const r=routes.find(x=>x.product===j.product&&(x.origin||'')===(j.origin||''));
      if(r)j.dest=r.dest||'';
    }
    applyRouteToJob(j);
    ['product','origin','dest','distance','type'].forEach(f=>pendingOps.push({ds:curDate,op:{k:'jobset',id:String(j.id),f:f,v:j[f]}}));
    saveDay();renderDispatch();
    return;
  }
  if(e.target.dataset&&e.target.dataset.planprod!==undefined){renderSummary();return;}
  if(e.target.dataset&&e.target.dataset.depart!==undefined){
    const j=day.jobs.find(x=>String(x.id)===e.target.dataset.depart);
    const nv=normHM(e.target.value);
    if(nv===null){badHM(e.target,j?j.depart:'');return;}
    if(j){setJobField(j,'depart',nv);saveDay();renderDispatch();}
    return;
  }
  if(e.target.id==='fileInput'&&e.target.files[0])importFile(e.target.files[0]);
  if(e.target.dataset&&e.target.dataset.rt!==undefined){
    const r=routes.find(x=>x.id===e.target.dataset.id);
    if(r){
      const f=e.target.dataset.rt;
      r[f]=(f==='distance')?String(e.target.value).replace(/[^0-9]/g,''):e.target.value;
      scheduleRoutesSave();
      if(f==='type'||f==='distance'){      /* เปลี่ยนประเภทงานแล้วแถวอาจหลุดตัวกรอง -> รีเฟรชตาราง+ตัวนับทันที ไม่ให้ค้างผิดกลุ่ม */
        renderPlanCounts();
        if(planFilter!=='all')updatePlanArea();
      }
    }
    return;
  }
  if(e.target.dataset&&e.target.dataset.arrive!==undefined){
    const no=e.target.dataset.arrive,p=e.target.dataset.pos;
    const nv=normHM(e.target.value);
    if(nv===null){badHM(e.target,(day.arrive[no]||{})[p]||'');return;}
    setArrive(no,p,nv);return;
  }
  if(e.target.dataset&&e.target.dataset.edit==='shiftfrom'){
    const ti=+e.target.dataset.ti,di=+e.target.dataset.di;const buf=editBuf||config;
    buf[ti].drivers[di].shiftFrom=e.target.value;return;}
  if(e.target.dataset&&e.target.dataset.edit==='dayoff'){const ti=+e.target.dataset.ti,di=+e.target.dataset.di;const buf=editBuf||config;buf[ti].drivers[di].dayOff=e.target.value==='—'?'':e.target.value;}
  if(e.target.dataset&&e.target.dataset.job){
    const j=day.jobs.find(x=>String(x.id)===e.target.dataset.job),f=e.target.dataset.field;
    const nv=normHM(e.target.value);
    if(nv===null){badHM(e.target,j?j[f]:'');return;}
    if(j){setJobField(j,f,nv);saveDay();renderBoard();}
    return;
  }
});

/* ---------- Excel export ----------
   ชีต "จ่ายงาน" = ข้อมูลหน้า 2 (รายละเอียดงาน) ครบทุกคอลัมน์ที่ CC เห็น รวม "ส่ง OMS" และเรียงตามที่แสดงอยู่
   ชีต "เช็กคนขับ" = ข้อมูลหน้า 1
   ลำดับชีตขึ้นกับว่ากดปุ่มจากหน้าไหน — กดจากหน้า 2 ชีตจ่ายงานต้องมาก่อน ไม่ใช่เปิดไฟล์แล้วเจอหน้า 1
   (แก้ 2026-08-13 ตามที่ผู้ใช้แจ้งว่ากดในหน้า 2 แต่ได้ข้อมูลหน้า 1) */
function sheetAttend(){
  const att=[['เบอร์รถ','ต้นทาง','กะ','คนขับ','สถานะ','เวลามาจริง','ผู้บันทึก','วันหยุด','เวลากะที่ใช้','เปลี่ยนเป็น','หมายเหตุ']];
  const ST={present:'มา',late:'สาย',absent:'ขาด',leave:'ลา',ot:'มา OT (วันหยุด)','':''};
  for(const t of config)for(const d of (t.drivers||[])){const off=isOff(t,d,curDate);const cur=attStat(t,d);const status=cur==='ot'?'มา OT (วันหยุด)':(off?'วันหยุด':ST[cur]);const av=attArr(t,d);const by=attBy(t,d);att.push([t.truckNo,t.routeGroup,d.pos,d.name,status,av,by,dayOffLabel(d)||d.dayOff,rowShift(t,d),d.shift2?(d.shift2+' ตั้งแต่ '+(d.shiftFrom||'-')):'',(day.dnote[t.truckNo]||{})[d.pos]||'']);}
  return att;
}
function sheetDispatch(){

  dispatchRows().forEach(({j,i})=>jb.push([j.date||curDate,i+1,j.product,j.origin,j.dest,j.code||'',j.driver,
    j.mainTruck||j.truck,j.actualTruck||j.mainTruck||j.truck,j.trip||'',jtFull(jobType(j)),jobArrive(j),j.depart,
    j.note||'',omsText(j),j.omsDoc||'',j.by||'',
    j.chargeStart,j.chargeEnd,j.ret,j.closed||'',workHoursText(j),j.overNote||'']));

}
function exportExcel(){
  const wb=XLSX.utils.book_new();
  const add=(name,aoa)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),name);
  const fromDispatch=(tab==='dispatch');
  if(fromDispatch){ add('จ่ายงาน',sheetDispatch()); add('เช็กคนขับ',sheetAttend()); }
  else{ add('เช็กคนขับ',sheetAttend()); add('จ่ายงาน',sheetDispatch()); }
  XLSX.writeFile(wb,(fromDispatch?'จ่ายงาน-':'รายงานงานขนส่ง-')+curDate+'.xlsx');
}

/* ---------- Excel import (monthly roster) ---------- */
let pendingWb=null;
/* อ่านชีตหนึ่ง ๆ ให้เป็นตารางกะ — แก้บั๊ก array มีรู (ช่อง A1 ว่าง) ด้วย Array.from */
function parseSheet(wb,name){
  const ws=wb.Sheets[name];
  if(!ws)return {ok:false,msg:'ไม่พบชีต'};
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
  const aoaRaw=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});   /* ไว้อ่านวันที่แบบ serial */
  const cell=(row,idx)=>{const v=row?row[idx]:undefined;return v==null?'':String(v).trim();};
  let hi=-1;
  for(let r=0;r<Math.min(aoa.length,30);r++){
    const arr=Array.from(aoa[r]||[],c=>String(c==null?'':c));
    if(arr.some(c=>c.indexOf('เบอร์รถ')>=0)&&arr.some(c=>c.indexOf('รายชื่อ')>=0||c.indexOf('ชื่อ')>=0)){hi=r;break;}
  }
  if(hi<0)return {ok:false,msg:'ไม่พบหัวตาราง (ต้องมีคอลัมน์ “เบอร์รถ” และ “รายชื่อ”)'};
  const H=Array.from(aoa[hi]||[],c=>String(c==null?'':c).trim());
  const col=k=>H.findIndex(h=>h.indexOf(k)>=0);
  const cRoute=col('เส้นทาง'),cTruck=col('เบอร์รถ'),cOrder=col('ลำดับ'),cCode=col('รหัส'),
        cName=col('รายชื่อ'),cPhone=col('เบอร์โทร'),cProd=col('สินค้า'),cOff=col('off'),
        cTime=H.findIndex(h=>h.indexOf('1-15')>=0||h.indexOf('ครึ่งเดือนแรก')>=0||(h.indexOf('วันที่')>=0&&h.indexOf('เปลี่ยน')<0));
  const cChg=H.findIndex(h=>h.indexOf('เปลี่ยน')>=0);
  const cTime2=H.findIndex((h,ix)=>ix!==cTime&&(h.indexOf('16-31')>=0||h.indexOf('ครึ่งเดือนหลัง')>=0||(h.indexOf('วันที่')>=0&&h.indexOf('เปลี่ยน')<0&&ix>cTime)));
  if(cTruck<0||cName<0)return {ok:false,msg:'หาคอลัมน์เบอร์รถหรือรายชื่อไม่เจอ'};
  const trucks={},order=[];let skipped=0,trainee=0;
  for(let r=hi+1;r<aoa.length;r++){
    const row=aoa[r];if(!row)continue;
    let truck=cell(row,cTruck);
    const nmRaw=cell(row,cName);
    if(truck.indexOf('EV')!==0){
      /* ไม่มีเบอร์รถ — ถ้ามีชื่อจริง (เช่น พจส.ใหม่/ยังฝึกงาน) เก็บไว้ใต้เบอร์รถชั่วคราว ไม่ทิ้งแถวไป */
      if(nmRaw&&nmRaw!=='Vacant'){truck=TRAINEE_TRUCK;trainee++;}
      else{if(nmRaw)skipped++;continue;}
    }
    if(!trucks[truck]){
      const rt=cell(row,cRoute);
      const ty=(truck===TRAINEE_TRUCK)?'trainee':(truck==='EV1-033'||truck==='EV1-039')?'vt':(rt.indexOf('เปลือกไม้')>=0?'twelve':'model');
      trucks[truck]={truckNo:truck,routeGroup:truck===TRAINEE_TRUCK?'พจส.ใหม่ / รอมอบหมายเบอร์รถ':rt,product:cell(row,cProd)||'เชื้อเพลิงชีวมวล',type:ty,drivers:[]};
      order.push(truck);
    }
    const nm=nmRaw;
    if(nm&&nm!=='Vacant'){
      let pos=cell(row,cOrder);pos=pos.indexOf('Head')>=0?'1':(pos[0]||String(trucks[truck].drivers.length+1));
      const rawRow=aoaRaw[r]||[];
      const chg=(cChg>=0)?(xlDate(rawRow[cChg])||xlDate(cell(row,cChg))):'';
      const sh2=(cTime2>=0)?cell(row,cTime2):'';
      const drv={pos,code:cell(row,cCode).replace('.0',''),name:nm,
        phone:cell(row,cPhone),dayOff:cell(row,cOff).replace('อา.','อาทิตย์'),shift:cell(row,cTime)};
      if(sh2&&chg){drv.shift2=sh2;drv.shiftFrom=chg;}
      trucks[truck].drivers.push(drv);
    }
  }
  let roster=order.map(t=>trucks[t]);
  EXTRA.forEach(x=>{if(!roster.find(t=>t.truckNo===x.truckNo))roster.push(x);});
  const drv=roster.reduce((a,t)=>a+(t.drivers||[]).length,0);
  const noShift=roster.reduce((a,t)=>a+(t.drivers||[]).filter(d=>!d.shift).length,0);
  const noOff=roster.reduce((a,t)=>a+(t.drivers||[]).filter(d=>!d.dayOff).length,0);
  const chgN=roster.reduce((a,t)=>a+(t.drivers||[]).filter(d=>d.shiftFrom).length,0);
  const chgDates=[...new Set([].concat.apply([],roster.map(t=>(t.drivers||[]).map(d=>d.shiftFrom).filter(Boolean))))].sort();
  return {ok:roster.length>=5,msg:roster.length<5?('อ่านได้แค่ '+roster.length+' คัน โครงไฟล์อาจต่างจากที่รองรับ'):'',
          roster,trucks:roster.length,drivers:drv,noShift,noOff,skipped,trainee,chgN,chgDates,
          cols:{เส้นทาง:cRoute,เบอร์รถ:cTruck,ลำดับ:cOrder,รหัส:cCode,รายชื่อ:cName,เบอร์โทร:cPhone,สินค้า:cProd,'วัน off':cOff,เวลากะ:cTime}};
}
function importFile(file){
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      pendingWb={wb,results:{}};
      wb.SheetNames.forEach(nm=>{pendingWb.results[nm]=parseSheet(wb,nm);});
      openImportDialog();
    }catch(err){alert('อ่านไฟล์ไม่สำเร็จ: '+err.message);}
  };
  r.onerror=()=>alert('เปิดไฟล์ไม่ได้');
  r.readAsArrayBuffer(file);
}
/* ดึงตารางกะสดจาก Google Sheet ผ่าน Apps Script (endpoint ?roster=live) แทนการอัปโหลด Excel
   ใช้ dialog/ปุ่ม "ใช้ตารางกะชุดนี้" เดียวกับตอนอัปโหลด Excel เลย (applyImport ไม่ต้องแก้อะไร) */
/* ============================================================================
   ทยอยเปลี่ยนตารางกะตามวันที่กำหนด (2026-08-25)
   ชีต "ตารางกะ พจส. (888)" มีคอลัมน์ K "กำหนดวันเปลี่ยนกะ" — วันมีผลของ "แถวนั้น"
   คุมทั้งแถว: เบอร์รถ · ลำดับกะ · เวลาเข้ากะ · วันหยุด · เว้นว่าง = ไม่มีคิว คงตามชุดเดิม

   ทำไมต้องประกอบที่ฝั่งนี้ ไม่ใช่ฝั่ง .gs:
   ชีตเก็บแต่ "สภาพใหม่" ของแถวที่จะเปลี่ยน ค่า "ก่อนเปลี่ยน" ไม่ได้อยู่ในชีต
   จึงต้องเอาตารางกะชุดที่ใช้อยู่ (base) มาเป็นพื้น แล้วทาบแถวที่ถึงวันแล้วลงไป

   ผลลัพธ์: สร้าง "ชุดตารางกะ" (rosterVersions) หนึ่งชุดต่อหนึ่งวันมีผล
   ทั้งระบบที่เหลือจึงไม่ต้องแก้อะไรเลย — หน้า 1/4/6 ถาม rosterFor(วันที่) เหมือนเดิม
   ============================================================================ */
/* ทาบแถวจากชีตลงบนตารางกะพื้น คืน {roster, conflicts, moved}
   applyRows = แถวที่ "ถึงวันมีผลแล้ว" ณ วันที่ที่กำลังประกอบ (รวมแถวที่ไม่มีคิวด้วย) */
function rosterCompose(base, allRows, applyRows){
  const byCode={}; applyRows.forEach(r=>{const c=String(r.code||'').trim(); if(c)byCode[c]=r;});
  /* โครงรถ: เอาจากทุกแถวในชีต (ให้รถที่เพิ่งเพิ่มในชีตมีที่อยู่) + รถที่มีในชุดพื้น (ไม่ให้รถหาย) */
  const trucks={}, order=[];
  const put=(no,rg,prod,ty)=>{
    const k=no||TRAINEE_TRUCK;
    if(!trucks[k]){trucks[k]={truckNo:k,routeGroup:rg||'',product:prod||'',type:ty||'model',drivers:[]};order.push(k);}
    return trucks[k];
  };
  (base||[]).forEach(t=>{if(t&&t.truckNo)put(t.truckNo,t.routeGroup,t.product,t.type);});
  (allRows||[]).forEach(r=>{
    const t=put(r.truckNo,r.routeGroup,r.product,r.type);
    /* แถวที่ถึงวันแล้วเท่านั้น ที่มีสิทธิ์เปลี่ยนข้อมูลระดับรถ (เส้นทาง/สินค้า/ประเภท) */
    if(byCode[String(r.code||'').trim()]===r){
      if(r.routeGroup)t.routeGroup=r.routeGroup;
      if(r.product)t.product=r.product;
      if(r.type)t.type=r.type;
    }
  });
  /* คนที่ต้องมีในชุดนี้ = คนในชุดพื้น + คนของแถวที่ถึงวันแล้ว
     คนใหม่ที่แถวยังไม่ถึงวัน = ยังไม่มีตัวตนในชุดนี้ (ถูกข้าม) */
  const seen={}, place=[];
  (base||[]).forEach(t=>((t&&t.drivers)||[]).forEach(d=>{
    const c=String((d&&d.code)||'').trim();
    const key=c||('!'+t.truckNo+'|'+d.pos+'|'+(d.name||''));
    if(seen[key])return; seen[key]=1;
    const r=c?byCode[c]:null;
    place.push(r
      ? {truckNo:r.truckNo||TRAINEE_TRUCK,pos:r.pos,code:c,name:r.name||d.name,phone:r.phone||d.phone||'',
         dayOff:r.dayOff,shift:r.shift,from:r.from||''}
      : {truckNo:t.truckNo,pos:String(d.pos||''),code:c,name:d.name||'',phone:d.phone||'',
         dayOff:d.dayOff||'',shift:d.shift||'',shift2:d.shift2,shiftFrom:d.shiftFrom,from:''});
  }));
  applyRows.forEach(r=>{
    const c=String(r.code||'').trim(); if(!c||seen[c])return; seen[c]=1;
    place.push({truckNo:r.truckNo||TRAINEE_TRUCK,pos:r.pos,code:c,name:r.name||'',phone:r.phone||'',
      dayOff:r.dayOff,shift:r.shift,from:r.from||''});
  });
  /* วางลงช่องลำดับกะ — คนที่ "ย้ายตามคิว" ได้สิทธิ์จองช่องก่อน คนที่อยู่เดิมค่อยเติมช่องที่เหลือ
     ถ้าช่องชนกัน (ทยอยเปลี่ยนแล้วจังหวะคาบเกี่ยว) ต้องไม่ทำใครหาย -> เลื่อนไปช่องว่างถัดไปและรายงาน */
  const conflicts=[];
  const usedOf={};
  const claim=(no,pos)=>{
    usedOf[no]=usedOf[no]||{};
    let p=String(pos||'').trim();
    if(!p||usedOf[no][p]){
      let n=1; while(usedOf[no][String(n)])n++;
      if(p)conflicts.push(no+' ลำดับกะ '+p+' ชนกัน → ย้ายไปกะ '+n);
      p=String(n);
    }
    usedOf[no][p]=1; return p;
  };
  const movers=place.filter(x=>byCode[x.code]===undefined?false:true);
  const stayers=place.filter(x=>!(byCode[x.code]!==undefined));
  movers.concat(stayers).forEach(x=>{
    const t=put(x.truckNo,'','','');
    const d={pos:claim(t.truckNo,x.pos),code:x.code,name:x.name,phone:x.phone,
             dayOff:x.dayOff||'',shift:x.shift||''};
    if(x.shift2)d.shift2=x.shift2;
    if(x.shiftFrom)d.shiftFrom=x.shiftFrom;
    t.drivers.push(d);
  });
  order.forEach(k=>trucks[k].drivers.sort((a,b)=>(+a.pos||99)-(+b.pos||99)));
  return {roster:order.map(k=>trucks[k]), conflicts:conflicts, moved:movers.length};
}
/* สร้างชุดตารางกะหนึ่งชุดต่อหนึ่งวันมีผล — ชุดแรก = "ตอนนี้" แล้วต่อด้วยแต่ละวันที่ยังไม่ถึง */
function rosterStageplan(base, rows, cuts, today){
  const on=d=>(rows||[]).filter(r=>!r.from||String(r.from)<=String(d));
  const out=[{ds:today, ...rosterCompose(base,rows,on(today))}];
  (cuts||[]).slice().sort().forEach(d=>{
    out.push({ds:d, ...rosterCompose(base,rows,on(d))});
  });
  return out;
}
async function importFromSheet(){

  if(btn){btn.disabled=true;btn.textContent='⏳ กำลังดึง…';}
  try{
    const res=await fetch(backendURL+'?roster=live'+tk()+'&t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(data&&data.ok===false)throw new Error(data.message||'อ่านไม่สำเร็จ');
    const roster=Array.isArray(data)?data:(data.roster||[]);
    if(!roster.length)throw new Error('ไม่พบข้อมูลตารางกะในชีต (ตรวจชื่อชีต/สิทธิ์เข้าถึงฝั่ง Apps Script)');

    const noOff=roster.reduce((a,t)=>a+(t.drivers||[]).filter(d=>!d.dayOff).length,0);

    const trainee=traineeT?(traineeT.drivers||[]).length:0;
    /* ---- คิวเปลี่ยนกะรายแถว (คอลัมน์ K) ---- ถ้า .gs ที่ deploy ยังเป็นตัวเก่า จะไม่มี rows มาให้
       กรณีนั้นทำงานเหมือนเดิมทุกอย่าง (ชุดเดียว) แต่ต้องบอกให้รู้ว่าคอลัมน์ K ยังไม่มีผล */
    const rows=Array.isArray(data&&data.rows)?data.rows:null;
    const cuts=Array.isArray(data&&data.cuts)?data.cuts.slice().sort():[];
    const sToday=(data&&data.today)||todayStr();
    const cutN={}; if(rows)cuts.forEach(d=>{cutN[d]=rows.filter(r=>String(r.from||'')===d).length;});
    const nm='Google Sheet (ปัจจุบัน) · '+nowHM()+' น.';
    pendingWb={wb:{SheetNames:[nm]},results:{[nm]:{ok:true,roster,trucks:roster.length,drivers:drv,
      noShift,noOff,skipped:0,trainee,chgN:0,chgDates:[],
      rows:rows,cuts:cuts,cutN:cutN,sToday:sToday,
      colK:(data&&data.colK)||'',badDate:(data&&data.badDate)||0,
      staged:!!(rows&&rows.length)}}};
    openImportDialog();
  }catch(err){alert('ดึงข้อมูลจาก Google Sheet ไม่สำเร็จ: '+err.message);}
  if(btn){btn.disabled=false;btn.textContent='🔄 ดึงจาก Google Sheet';}
}

    +(useStage?('\n\nสร้างทั้งหมด '+newVers.length+' ชุด (ทยอยเปลี่ยนตามคอลัมน์ K):\n· '

      :('\n\nเริ่มมีผล '+from))
    +'\n\nวันที่ดูอยู่ตอนนี้ ('+curDate+') ใช้ชุด: '+activeVerName()
    +(late?('\n\n⚠ วันเริ่มมีผลยังไม่ถึง จึงยังไม่เห็นการเปลี่ยนแปลงในวันนี้'):''));
}

function busyTyping(){
  const a=document.activeElement;
  if(!a)return false;
  const t=(a.tagName||'').toLowerCase();
  if(t!=='input'&&t!=='select'&&t!=='textarea')return false;
  return (Date.now()-lastTypeAt)<8000;
}

function dashDateList(){

function withDayContext(ds,doc,fn){

    }

function planActualOf(ds,doc){

/* ========== Section 5 · ประวัติการวิ่งงานย้อนหลังรายบุคคล (2026-08-28) ==========
   ต่อยอดจาก A.person[code].byDate ที่ dashAgg เก็บไว้แล้ว (ดิบ: เที่ยวงานต่อวัน + เวลามารายงานตัว)
   คำนวณ 2 ค่าเวลาแยกกันตามที่ผู้ใช้ยืนยัน (2026-08-28):

   - เวลานับจากรายงานตัว/เที่ยวก่อนหน้า → ปิดงานนี้ = นับต่อเนื่องทีละเที่ยว
     เที่ยว 1 นับจากเวลามารายงานตัว · เที่ยว 2 นับจากปิดงานเที่ยว 1 · เที่ยว 3 นับจากปิดงานเที่ยว 2 ...
   เที่ยวที่ยังไม่ปิดงาน (closed ว่าง) ไม่มีเลขให้คำนวณทั้งสองค่า — ไม่รวมในค่าเฉลี่ย
   ไม่ต้องแปะป้าย "+1 วัน" ตามที่ผู้ใช้สั่ง (2026-08-28) — ให้ minutesBetween() บวกข้ามวันให้เงียบๆพอ */
function personHistDays(byDate){
  const days=[]; let sumSeg=0,segN=0,dist=0;
  Object.keys(byDate||{}).sort().forEach(ds=>{
    const rec=byDate[ds]||{arrive:'',jobs:[]};
    const jobs=(rec.jobs||[]).slice().sort((a,b)=>{
      const x=hm2min(a.depart),y=hm2min(b.depart);
      if(x===null&&y===null)return 0; if(x===null)return 1; if(y===null)return -1; return x-y;
    });
    let prevClose=rec.arrive||'';
    const trips=jobs.map((j,i)=>{
      dist+=Number(j.distance)||0;
      const run=workHours(j);                 /* '' = ยังคำนวณไม่ได้ (ยังไม่ออก) */
      let seg=null;
      if(j.closed&&prevClose){
        const m=minutesBetween(prevClose,j.closed);
        if(m!==null){seg=Math.round(m/60*10)/10;sumSeg+=seg;segN++;}
      }
      if(j.closed)prevClose=j.closed;
      return Object.assign({},j,{no:i+1,run:run,seg:seg,segFrom:i===0?'รายงานตัว':('ปิดงานเที่ยว '+i)});
    });
    const lastClosed=trips.filter(t=>t.closed).slice(-1)[0];
    let spanH=null;
    if(rec.arrive&&lastClosed){const m=minutesBetween(rec.arrive,lastClosed.closed); if(m!==null)spanH=Math.round(m/60*10)/10;}
    days.push({ds:ds,arrive:rec.arrive||'',lastClose:lastClosed?lastClosed.closed:'',spanH:spanH,trips:trips});
  });
  return {days:days,avgSeg:segN?Math.round(sumSeg/segN*10)/10:null,dist:dist,
    workDays:days.filter(d=>d.trips.length>0).length};
}

       บักที่ผู้ใช้เจอ 2026-08-18: หน้า 4 บอกแผน 44 จริง 58 แต่กราฟ 1.1 บอก 27+9 และแผน 0
       (สำเนาเก่าไม่มีแผน จึงกลายเป็น "ทำเกินแผน" ทั้งก้อน) */
      const day2=(ds===curDate)?(day||null):dashCache[ds];   /* วันที่เปิดอยู่ = ข้อมูลสดชุดเดียวกับหน้า 4 */
    const row={ds:ds,trips:0,closed:0,present:0,absent:0,late:0,leave:0,ot:0,off:0,unchecked:0,sched:0,hours:0,hoursN:0,plan:0,hit:0,types:{},wt:{},noData:false,
      truckClosed:{},fleet:[],truckNote:{},
      pMain:0,pOut:0,pIdle:0,pLeave:0,pAbsent:0,pUncheck:0,pLate:0,pOtOff:0,
      planByType:{main:0,vt:0,oth_l:0,oth_s:0},
      truckCrew:{}};
      /* Section 1.1 (2026-08-17 รวมกราฟ สาย/ลา/ขาด เข้ามาแล้ว):
         แบ่งคนในแผนของวันนั้นเป็น 6 พวกที่ไม่ทับกัน รวมกันได้เท่าแผนพอดี
         หลัก · นอก · มาแต่ไม่ได้วิ่งงาน · ลา · ขาด · ยังไม่เช็ก
         "สาย" ไม่แยกเป็นช่องสี เพราะคนสายก็คือคนที่มา และนับอยู่ใน 3 ช่องแรกแล้ว
         จึงเก็บเป็น pLate ไว้โชว์เป็นตัวเลขกำกับบนหัวแท่ง (ตามที่ผู้ใช้เลือก)
         truckCrew: สภาพของรถแต่ละคันในวันนั้น สำหรับรายงาน "รถ 0 เที่ยว" */
    WT_GROUPS.forEach(x=>row.wt[x.k]={ok:0,over:0});
    if(!day2){row.noData=true;A.daily.push(row);return;}
    A.haveDays++;
    /* --- งานของแต่ละคนในวันนั้น จับด้วยรหัส พจส. --- */
    const jobsByCode={};
    (day2.jobs||[]).forEach(j=>{const c=String(j.code||'').trim();if(c)(jobsByCode[c]=jobsByCode[c]||[]).push(j);});
    /* --- คน --- ตัวเลขทั้งหมดมาจาก "ตารางที่ 1 หน้า 4" ผ่าน attendOf() ตัวเดียวกับที่หน้า 4 ใช้
       จึงตามตัวคนด้วยรหัส พจส. เหมือนหน้า 1/หน้า 4 ไม่ใช่อ่านตำแหน่งกะดิบเหมือนก่อน 2026-08-18 */
    const rs=rosterOn(ds);
    row.fleet=rs; row.truckNote=isPlain(day2.truckNote)?day2.truckNote:{};
    row.dnote=isPlain(day2.dnote)?day2.dnote:{};   /* หมายเหตุเดิมจากหน้า 1 (ต่อคัน/ต่อกะ) */
    /* สภาพลูกเรือของรถแต่ละคันในวันนั้น — ใช้อธิบายว่าทำไมรถคันนั้นไม่ได้วิ่ง */
    rs.forEach(t=>{ if(t&&t.truckNo)row.truckCrew[t.truckNo]=
      {came:0,late:0,absent:0,leave:0,off:0,uncheck:0,crew:(t.drivers||[]).length,
       route:t.routeGroup||'',jobs:0,closed:0}; });
    const AT=attendOf(ds,day2);
    const T1=AT.total;
    row.sched=T1.plan; row.present=T1.present; row.late=T1.late; row.absent=T1.absent;
    row.leave=T1.leave; row.unchecked=T1.unchecked; row.off=T1.off; row.ot=T1.ot;
    A.att.sched+=T1.plan; A.att.present+=T1.present; A.att.late+=T1.late;
    A.att.absent+=T1.absent; A.att.leave+=T1.leave; A.att.unchecked+=T1.unchecked;
    A.att.off+=T1.off; A.att.ot+=T1.ot;
    const codeSeen={};
    AT.per.forEach(x=>{
      const TC=row.truckCrew[x.truckNo];
      const v=x.v, code=x.code;
      const mine=code?(jobsByCode[code]||[]):[];
      /* งานรายคน — เก็บทุกคนที่มีงาน รวมคนที่มา OT วันหยุด เพราะเป็นงานที่ทำจริง */
      if(code&&!codeSeen[code]){
        codeSeen[code]=1;
        const pp=P(code); pp.inRoster=true; if(!pp.name&&x.name)pp.name=x.name;
        if(mine.length)pp.workDays++;
        /* Section 5 (2026-08-28): เก็บเวลามารายงานตัวของวันนี้ไว้ก่อน แม้วันนั้นจะไม่มีเที่ยวเลย
           (ต้องเห็นว่า "มา แต่ไม่ได้วิ่งงาน" ต่างจาก "ไม่มีข้อมูลวันนั้น") */
        pp.byDate[ds]=pp.byDate[ds]||{arrive:x.arrive||'',jobs:[]};
        mine.forEach(j=>{
          const gk=jobType(j);
          pp.rounds++; if(isMainBU(gk))pp.main++; else pp.out++;
          const wb=workBreakdown(j);
          if(wb.closed&&wb.total>0){pp.hrs+=wb.total;pp.hrsN++;}
          pp.byDate[ds].jobs.push({product:j.product||'',origin:j.origin||'',dest:j.dest||'',
            distance:j.distance,depart:j.depart||'',closed:j.closed||'',type:gk});
        });
        if(v==='late')pp.late++; else if(v==='absent')pp.absent++; else if(v==='leave')pp.leave++;
        /* ตัวหารรายวันของคนนี้ในช่วงที่เลือก — นับวันต่อวัน ไม่ใช่ยอดรวมทั้งช่วง */
        if(!x.off)pp.dutyDays++;                                        /* วันที่ต้องมาทำงาน */

      }
      if(x.off){ if(TC)TC.off++; if(v==='ot'){row.pOtOff++;if(TC)TC.came++;} return; }
      if(TC){ if(v==='present'||v==='ot')TC.came++;
              else if(v==='late'){TC.came++;TC.late++;}
              else if(v==='absent')TC.absent++;
              else if(v==='leave')TC.leave++;
              else TC.uncheck++; }
      if(v==='absent'||v==='late'||v==='leave'){
        const nm=x.name||'-';
        A.driver[nm]=A.driver[nm]||{absent:0,late:0,leave:0,name:nm,code:code||''};

      /* กราฟ 1.2 — แบ่งคนในแผนของวันนั้นเป็น 6 พวกที่ไม่ทับกัน รวมกันได้เท่าแผนพอดี
         *** ยึดสถานะที่ CC เช็กเป็นหลักก่อน *** ถ้า CC เช็กว่า ลา/ขาด/ยังไม่เช็ก ก็นับตามนั้น
         แม้จะมีใบงานค้างอยู่ ตัวเลขในกราฟจะได้ตรงกับตารางที่ 1 หน้า 4 และการ์ดด้านบนเสมอ
         (ก่อน 2026-08-18 เช็ก "มีงานไหม" ก่อน ทำให้คนที่ถูกเช็กว่าขาดแต่มีใบงาน กลายเป็น "มา") */
      if(v==='leave'){row.pLeave++;return;}
      if(v==='absent'){row.pAbsent++;return;}
      if(v!=='present'&&v!=='late'&&v!=='ot'){row.pUncheck++;return;}

      if(hasMain)row.pMain++; else if(hasOut)row.pOut++; else row.pIdle++;
    });
    /* --- ปริมาณงานเทียบแผน --- ตัวเลขมาจาก "ตารางที่ 2 หน้า 4" ผ่าน planActualOf()
       ทั้งฝั่งแผนและฝั่งงานจริง ใช้สูตรเดียวกับหน้า 4 จึงไม่มีทางเพี้ยนจากกัน */
    const PA=planActualOf(ds,day2);
    JOBTYPES.forEach(x=>{
      const pl=PA.plan[x.k]||0, ac=PA.act[x.k]||0;
      row.planByType[x.k]=pl; A.planByType[x.k]=(A.planByType[x.k]||0)+pl;

      row.types[x.k]=ac;      A.byType[x.k]=(A.byType[x.k]||0)+ac;

    /* --- เที่ยว / เส้นทาง / รถ / เวลา --- */
    const per={};
    (day2.jobs||[]).forEach(j=>{

      const gk=jobType(j);          /* ประเภทงานนับไว้แล้วใน planActualOf ข้างบน ไม่นับซ้ำที่นี่ */
      const p=(j.product||'(ไม่ระบุ)').trim(); A.prod[p]=(A.prod[p]||0)+1;
      const o=(j.origin||'(ไม่ระบุ)').trim(); A.origin[o]=(A.origin[o]||0)+1;
      /* นับรถตาม "เลขรถที่วิ่งจริง" ให้ตรงกับหน้า 4 (2026-08-17) */
      const tk=roundTruckOf(j); A.truck[tk]=(A.truck[tk]||0)+1; per[tk]=(per[tk]||0)+1; A.trucksSeen[tk]=1;
      if(row.truckCrew[tk]){row.truckCrew[tk].jobs++; if(j.closed)row.truckCrew[tk].closed++;}
      /* งานของคนที่ไม่อยู่ในตารางกะของวันนั้น ต้องไม่หายไปจากรายงานรายคน */
      const jc=String(j.code||'').trim();
      if(jc&&!codeSeen[jc]){
        const pp=P(jc); if(!pp.name&&j.driver)pp.name=String(j.driver);
        pp.rounds++; if(isMainBU(gk))pp.main++; else pp.out++;
        const wb0=workBreakdown(j);
        if(wb0.closed&&wb0.total>0){pp.hrs+=wb0.total;pp.hrsN++;}
        /* Section 5 (2026-08-28): คนนี้ไม่อยู่ในตารางกะของวันนี้ (เช่น ย้ายคัน/นอกกอง)
           จึงไม่มีเวลารายงานตัวให้อ้างอิง — เที่ยวแรกของวันนี้จะโชว์ "-" ตามที่ยืนยันไว้ */
        pp.byDate[ds]=pp.byDate[ds]||{arrive:'',jobs:[]};
        pp.byDate[ds].jobs.push({product:j.product||'',origin:j.origin||'',dest:j.dest||'',
          distance:j.distance,depart:j.depart||'',closed:j.closed||'',type:gk});
      }
      if(j.closed){
        A.closed++; row.closed++;
        row.truckClosed[tk]=(row.truckClosed[tk]||0)+1;
        const wb=workBreakdown(j);
        if(wb.total>0){A.hours.push(wb.total);row.hours+=wb.total;row.hoursN++;}
        const wk=workGroup(j), g=A.wt[wk];
        if(wb.total>0){g.n++;g.sum+=wb.total;
          if(wb.total>workLimit(j)){g.over++;A.over8++;row.wt[wk].over++;}else{g.ok++;row.wt[wk].ok++;}}
      }
    });
    /* "ครบ 3 รอบ" = จำนวน "คัน" ที่เคยทำครบในวันใดก็ได้ ไม่ใช่จำนวนครั้ง (2026-08-17) */
    /* hitTruckSet = "เคยทำครบในวันใดก็ได้" นับหัวรถไม่ซ้ำ (ของเดิม ยังใช้ที่อื่น)
       row.hit + hitDaySum = จำนวนคันที่ทำครบ "ในวันนั้น" ใช้หาค่าเฉลี่ยต่อวัน (2026-08-26) */
    row.hit=0;
    Object.keys(per).forEach(tk=>{if(per[tk]>=TARGET_ROUNDS){A.hitTruckSet[tk]=1;row.hit++;}});
    A.hitDaySum+=row.hit;
    A.daily.push(row);
  });
  A.hitTrucks=Object.keys(A.hitTruckSet).length;
  A.hoursAvg=A.hours.length?(A.hours.reduce((a,b)=>a+b,0)/A.hours.length):0;
  A.attRate=A.att.sched?(A.att.present/A.att.sched*100):0;
  A.tripsPerDay=A.haveDays?(A.trips/A.haveDays):0;
  /* รายคนเรียงพร้อมใช้: รอบมากก่อน ถ้าเท่ากันดู ชม./รอบ น้อยกว่า = ดีกว่า
     (ลำดับนี้ใช้กับกราฟ 1.3 ที่เรียงตามจำนวนรอบ · ตาราง 1.4 เรียงใหม่เองด้วยค่าต่อวัน) */
  A.people=Object.keys(A.person).map(k=>{const p=A.person[k];
    p.hpr=p.hrsN?Math.round(p.hrs/p.hrsN*10)/10:null;
    /* ---- เกณฑ์รายวัน (2026-08-19) ทุกตัวหารอยู่ในช่วงวันที่เลือกเท่านั้น ----
       rpd     รอบต่อวันที่มาทำงาน — ตัวชี้วัดหลักของตาราง 1.4
       latePd  สายต่อวันที่ต้องมาทำงาน · leavePd ลา · absPd ขาด (ครั้ง/วัน)
       null = ยังไม่มีวันให้หาร ต้องไม่กลายเป็น 0 เพราะ 0 แปลว่า "มาแล้วไม่ได้วิ่ง" ซึ่งคนละเรื่อง */
    p.rpd    = p.cameDays ? Math.round(p.rounds /p.cameDays*100)/100 : null;
    p.latePd = p.dutyDays ? Math.round(p.late   /p.dutyDays*100)/100 : null;
    p.leavePd= p.dutyDays ? Math.round(p.leave  /p.dutyDays*100)/100 : null;
    p.absPd  = p.dutyDays ? Math.round(p.absent /p.dutyDays*100)/100 : null;
    /* Section 5 · ประวัติรายบุคคล — คำนวณครั้งเดียวตรงนี้ ใช้ซ้ำได้ทั้งตารางสรุปและกล่องรายละเอียด */
    const H=personHistDays(p.byDate);
    p.histDays=H.days; p.histAvgSeg=H.avgSeg; p.histDist=H.dist; p.histWorkDays=H.workDays;
    return p;})
    .filter(p=>p.rounds>0||p.inRoster);
  A.people.sort((a,b)=>(b.rounds-a.rounds)
    || ((a.hpr===null?1e9:a.hpr)-(b.hpr===null?1e9:b.hpr))
    || String(a.name||a.code).localeCompare(String(b.name||b.code),'th'));
  return A;
}
/* ---------- ชิ้นส่วนกราฟ ---------- */
function dBars(obj,limit,color,unit){
  const all=Object.keys(obj).map(k=>[k,obj[k]]).sort((a,b)=>b[1]-a[1]);
  const arr=all.slice(0,limit||8);
  if(!arr.length)return '<div class="cno">ไม่มีข้อมูล</div>';
  const max=arr[0][1]||1, sum=all.reduce((a,b)=>a+b[1],0);
  const u=unit||'';
  return arr.map(([k,v],i)=>{
    const tip=k+' : '+v+u+(sum?(' ('+Math.round(v/sum*100)+'% ของทั้งหมด '+sum+u+')'):'')+' · อันดับที่ '+(i+1);
    return `<div class="drow" title="${esc(tip)}">
      <div><div style="margin-bottom:3px">${esc(k)}</div>
        <div class="dbar2"><i style="width:${Math.round(v/max*100)}%${color?(';background:'+color):''}"></i></div></div>
      <div class="dnum">${v}</div></div>`;}).join('');
}
/* ข้อความรายละเอียดของวันหนึ่ง — ใช้ทั้งใน tooltip และแผงด้านล่าง */
function dayDetailText(r){
  if(!r)return '';
  if(r.noData)return r.ds+'\nไม่มีข้อมูลของวันนี้';
  const L=[r.ds];
  L.push('เที่ยวงาน '+r.trips+' · ปิดงาน '+r.closed+(r.plan?(' · แผน '+r.plan):''));
  L.push('พจส. ต้องมา '+r.sched+' · มา '+r.present+' · สาย '+r.late+' · ขาด '+r.absent+' · ลา '+r.leave
    +(r.unchecked?(' · ยังไม่เช็ก '+r.unchecked):'')+(r.ot?(' · OT '+r.ot):''));
  const TY=r.types||{}, WTt=r.wt||{};
  const ty=JOBTYPES.filter(t=>TY[t.k]).map(t=>t.s+' '+TY[t.k]);
  if(ty.length)L.push('ประเภทงาน: '+ty.join(' · '));
  const wt=WT_GROUPS.filter(x=>WTt[x.k]&&(WTt[x.k].ok||WTt[x.k].over))
    .map(x=>x.name+' ไม่เกิน '+WTt[x.k].ok+'/เกิน '+WTt[x.k].over);
  if(wt.length)L.push('เวลา: '+wt.join(' · '));
  if(r.hoursN)L.push('เวลาทำงานเฉลี่ย '+(Math.round(r.hours/r.hoursN*10)/10)+' ชม./เที่ยว');
  return L.join('\n');
}

function chNiceMax(v){v=Number(v);if(!isFinite(v))v=0;v=Math.max(1,Math.ceil(v));if(v<=5)return 5;if(v<=10)return 10;return Math.ceil(v/5)*5;}

/* ---------- ความกว้างที่กราฟมีให้ใช้จริง (2026-08-17) ----------
   ผู้ใช้สั่งว่า "พื้นหลังกราฟที่เป็นเส้น ทำให้ยาวเต็มหน้าเป็นเบสฐานไว้เลย ต่อให้ข้อมูลมีน้อย"

   cols = 1 พาเนลเต็มความกว้าง · 2 พาเนลในกริดสองคอลัมน์

function dashFillW(cols){
  const c=(cols===2)?dashFillCache.w2:dashFillCache.w1;
  if(c>0)return c;
  /* ยังไม่เคยวัด — ประมาณไว้ก่อน แล้ว renderDash จะวัดของจริงและวาดซ้ำอีกรอบเดียว */
  const v=document.getElementById('view');
